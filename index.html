াগারে বইয়ের সংখ্যা বৃদ্ধি করা, আসন সংখ্যা বৃদ্ধি করা, ইন্টারনেট স্পিড দ্রুতগতি সম্পন্ন করা, ই-লাইব্রেরি দ্রুত পাবলিশ করাসহ গ্রন্থাগারের উন্নয়নে সব ধরণের ব্যবস্থা গ্রহণের জন্য বিশ্ববিদ্যালয়ের সংশ্লিষ্ট কর্তৃপক্ষের সুদৃষ্টি কামনা করছি।","img":""},{"id":"a03","bn":"সামাজিক যোগাযোগ মাধ্যমে নিষ্ক্রিয় ইবি","en":"IU Inactive on Social Media","paper":"Daily Amader Shomoy","date":"01 January 2024","link":"https://epaper.dainikamadershomoy.com/2024/01/01/page-04?fbclid=IwY2xjawNHOnNleHRuA2FlbQIxMABicmlkETFPczhjaEtUQVZyRUJnSGhsAR6E7xN7yFw0zRoPQJtLPRrycEdp3-wyQM28wci2177YUGvKuIJPqMUrmte4Cw_aem_F5M468AKrlRJN9DI5j5djw","content":"প্রতিষ্ঠার ৪৪ বছরেও সামাজিক যোগাযোগ মাধ্যমের কোনো সাইটেই ইসলামী বিশ্ববিদ্যালয় (ইবি) এর কোনো ভেরিফাইড একাউন্ট নেই। আধুনিক এই যুগে প্রতিটি প্রতিষ্ঠানের সামাজিক যোগাযোগ মাধ্যমে সক্রিয়তা অত্যন্ত গুরুত্বপূর্ণ। বর্তমানে যেকোনো তথ্য দ্রুত ছড়িয়ে দেওয়ার মাধ্যম হলো সামাজিক যোগাযোগ মাধ্যম। বিশ্ববিদ্যালয়ের যেকোনো গুরুত্বপূর্ণ নোটিশ, বিজ্ঞাপন, প্রচার-সম্প্রচার, প্রতিবেদন, খবরাখবর দ্রুত শিক্ষার্থী, কর্মকর্তা ও অন্যান্য সকলকে জানানোর জন্য সামাজিক যোগাযোগ মাধ্যমে সক্রিয় থাকা খুবই গুরুত্বপূর্ণ। এছাড়াও গুজব রটানো থেকে বিরত থাকা এবং সঠিক তথ্যসূত্র যুক্ত তথ্য নিশ্চিতের জন্য ভেরিফাইড একাউন্ট থাকার প্রয়োজনীয়তা রয়েছে। বহির্বিশ্বে বিশ্ববিদ্যালয়ের কার্যকলাপ, ঐতিহ্য, প্রাপ্তি, গুণাবলি তুলে ধরার জন্য প্রতিটি শিক্ষা প্রতিষ্ঠানের সামাজিক যোগাযোগ মাধ্যমে সক্রিয় থাকা অবশ্যই কার্যকরী একটি বিষয়। বিশ্ববিদ্যালয় এবং বিশ্ববিদ্যালয়ের শিক্ষার্থীদের সকল অর্জন সকলের কাছে একযোগে ছড়িয়ে দেওয়ার জন্যেও বর্তমানে অধিকাংশ বিশ্ববিদ্যালয়ের সামাজিক যোগাযোগ মাধ্যমে সক্রিয়তা দেখা যায়। তাই সামাজিক যোগাযোগ মাধ্যমের সকল গুরুত্বপূর্ণ সাইটে সক্রিয়তার জন্য বিশ্ববিদ্যালয় কর্তৃপক্ষের সকল ধরনের পদক্ষেপ গ্রহণের জন্য সুদৃষ্টি কামনা করছি।","img":""},{"id":"a02","bn":"চালু হোক ইবির ক্যাফেটেরিয়া","en":"Let IU's Cafeteria Open","paper":"Prothom Alo","date":"09 January 2024","link":"https://www.facebook.com/photo.php?fbid=2013576385684656&set=pb.100010969419262.-2207520000&type=3","content":"ইসলামী বিশ্ববিদ্যালয়ের (ইবি) এক ঢেঁকির কুমির হলো এর ক্যাফেটেরিয়া। তালাবদ্ধ ক্যাফেটেরিয়ার তালা খোলা দেখতে পাওয়া যেন স্বপ্নকে ছুঁতে পাওয়ার মতো। ক্যাফেটেরিয়া থাকলেও এটির নেই কোনো পরিচালনা। শেষ কবে ক্যাফেটেরিয়া খোলা ছিল, তাও কারো জানা নেই। ইবির ১৭ হাজার শিক্ষার্থীর বিপরীতে ক্যাফেটেরিয়াতে আসন রয়েছে মাত্র ৮০ থেকে ৯০ জনের, নেই কোনো সুন্দর ও স্থায়ী ডেকোরেশন এবং পরিবেশও খাবার খাওয়া বা আড্ডা দেওয়ার জন্য উপযোগী নয়। এর আগেও যখন ক্যাফেটেরিয়া চলমান ছিল তখন এর খাবারের নিম্নমান এবং খাবারের দাম তুলনামূলক বেশি হওয়ায় শিক্ষার্থীরা ক্যাফেটেরিয়ার প্রতি আগ্রহ হারায়। পরবর্তীতে ঠিকাদার জটিলতার কারণে বন্ধ হয়ে যায় এটি। বিশ্ববিদ্যালয়ের ক্যাফেটেরিয়াকে এর ঐতিহ্য হিসেবেও ধরা হয়, যেখানে থাকে শিক্ষার্থীদের বিশ্ববিদ্যালয় জীবনের অসংখ্য স্মৃতি। কিন্তু দীর্ঘদিন বন্ধ থাকা সত্ত্বেও এর ব্যাপারে উদাসীন দায়িত্ব পালন করছে বিশ্ববিদ্যালয় কর্তৃপক্ষ। বিশ্ববিদ্যালয় ক্যাফেটেরিয়া বন্ধ থাকাতে বাহিরে উচ্চ দামে খাবার কিনতে হচ্ছে শিক্ষার্থীদের এবং প্রয়োজনে যেকোনো সময়ে খাবারও পাচ্ছে না শিক্ষার্থীরা। এছাড়াও হলের ডাইনিংয়ে তিন বেলা নির্দিষ্ট সময়ে খাবার খাওয়া ব্যতীতও অন্যান্য সময় গুলোতে খাবার খাওয়ার জন্য হলেও ক্যাফেটেরিয়া চালু রাখা উচিত। ক্লাসের শেষে ফাঁকা সময়ে, বন্ধুদের নিয়ে আড্ডায় মেতে উঠার জন্য, নির্দিষ্ট তিন বেলা ব্যতীতও খাবার খাওয়ার সুবিধার জন্য এবং অল্প টাকায় ভালো মানের খাবার পাওয়ার জন্যে বিশ্ববিদ্যালয় ক্যাফেটেরিয়া একটি অন্যতম জায়গা। খাবারের মান ঠিক রেখে, পরিষ্কার-পরিচ্ছনতার সহীত, যথার্থ আসন সহ সুন্দর ডেকোরেশনের সাথে প্রয়োজনীয় সকল ব্যবস্থা গ্রহণ করে ক্যাফেটেরিয়া পুনরায় চালু করার জন্য বিশ্ববিদ্যালয়ের সংশ্লিষ্ট কর্তৃপক্ষের সুদৃষ্টি কামনা করছি।","img":""},{"id":"a01","bn":"ইবির ফোয়ারা চালু হোক","en":"Let IU's Fountain Be Activated","paper":"Daily Kaler Kantho","date":"10 December 2023","link":"https://www.facebook.com/photo.php?fbid=1995359774172984&set=pb.100010969419262.-2207520000&type=3","content":"বাংলাদেশে স্বাধীনতা পরবর্তী স্থাপিত প্রথম পাবলিক বিশ্ববিদ্যালয় ইসলামী বিশ্ববিদ্যালয়। ইসলামী বিশ্ববিদ্যালয়ের একমাত্র ফোয়ারার নাম 'সততা ফোয়ারা'। বিশ্ববিদ্যালয়ের মেইন ফটক দিয়ে প্রবেশের পরই স্মৃতিসৌধ এবং শহীদ মিনারের সাথেই অন্যতম সুন্দর স্থাপনা এটি। তবে ফোয়ারা থাকলেও ফোয়ারাতে নেই পানির বর্ষণ। দৈনন্দিন চলমান না থাকলেও অন্তত বিশেষ দিবসগুলোতে চালু রাখা যেতে পারে। ক্যাম্পাসের সৌন্দর্য ফুটিয়ে তোলার বিপরীতে যেন যথাযথ ব্যবহার না হওয়ায় অন্ধকারাচ্ছন্নে রয়েছে এটি। দীর্ঘদিন বন্ধ থাকা সত্ত্বেও ফোয়ারার ব্যাপারে কোনো রকম ব্যবস্থা গ্রহণ করেনি বিশ্ববিদ্যালয় প্রশাসন। বিশ্ববিদ্যালয়ের সৌন্দর্য বাড়াতে এবং উৎসবের দিনগুলোতে বহমান ফোয়ারা অবশ্যই উৎসবমুখর পরিবেশের সৃষ্টি করে। তাই উক্ত বিষয়ে নজরদারি করে ফোয়ারা চালু রাখার জন্য বিশ্ববিদ্যালয় প্রশাসনের দৃষ্টি আকর্ষণ করছি।","img":""}],"reports":[{"id":"r08","bn":"সুযোগ সুবিধার সংকটে ইবিতে কমছে বিদেশি শিক্ষার্থী","en":"Foreign Student Enrollment Declines at IU Amid Lack of Adequate Facilities","paper":"Daily Amader Shomoy","date":"05 May 2026","link":"https://epaper.dainikamadershomoy.com/2026/10/14/page-03","img":"images/clip-mveq0381.jpg","content":"তুলনামূলক কম খরচে উচ্চশিক্ষার সুযোগ থাকলেও আন্তর্জাতিক শিক্ষার্থীদের আকৃষ্ট করতে পারছে না ইসলামী বিশ্ববিদ্যালয় (ইবি)। পর্যাপ্ত প্রচার-প্রচারণার অভাব, বৃত্তি ও টিউশন ফি মওকুফের সুযোগ না থাকা, ভাষাগত জটিলতা এবং প্রত্যাশিত একাডেমিক পরিবেশের ঘাটতিসহ নানা কারণে বিশ্ববিদ্যালয়টিতে কমছে বিদেশি শিক্ষার্থীর সংখ্যা। আবাসন ও জীবনযাত্রার ব্যয় তুলনামূলক সাশ্রয়ী হলেও আর্থিক সহায়তা, স্বাস্থ্যসেবা, ইংরেজি মাধ্যমে পাঠদান ও বিশেষ একাডেমিক সহযোগিতার সীমাবদ্ধতা নিয়ে অসন্তোষ রয়েছে অধ্যয়নরত শিক্ষার্থীদের মধ্যে। এ পরিস্থিতিতে আন্তর্জাতিক শিক্ষার্থী বাড়াতে মাস্টারপ্ল্যান প্রণয়ন ও প্রচার-প্রচারণা জোরদারের উদ্যোগ নিয়েছে বিশ্ববিদ্যালয় প্রশাসন।\n\nজানা যায়, ২০১৬-১৭ শিক্ষাবর্ষ থেকে এ পর্যন্ত ইবিতে নেপাল, সোমালিয়া, ইথিওপিয়া, ভারত, যুক্তরাষ্ট্র, যুক্তরাজ্য, গাম্বিয়া ও শ্রীলঙ্কাসহ বিভিন্ন দেশের মোট ৭২ জন আন্তর্জাতিক শিক্ষার্থী ভর্তি হয়েছেন। তাদের মধ্যে ৩৬ জন কোর্স সম্পন্ন করেছেন, ২৩ জন ঝরে পড়েছেন এবং ১৩ জনের পড়াশোনা চলমান রয়েছে। বর্তমানে অধ্যয়নরত শিক্ষার্থীদের মধ্যে ১০ জন পিএইচডি ও এমফিল পর্যায়ে রয়েছেন। অনার্স পর্যায়ে পড়ছেন মাত্র তিনজন গাম্বিয়ার একজন ছাত্রী ও নেপালের দুজন ছাত্র। শিক্ষার্থীদের অভিজ্ঞতায় উঠে এসেছে, শুধু কম খরচে পড়াশোনার সুযোগ থাকলেই আন্তর্জাতিক শিক্ষার্থীদের আকৃষ্ট করা সম্ভব নয়; প্রয়োজন কার্যকর প্রচারণা, মানসম্মত একাডেমিক পরিবেশ ও প্রয়োজনীয় প্রাতিষ্ঠানিক সহায়তা।\n\nনেপাল থেকে আসা ফার্মেসি বিভাগের ২০২১-২২ শিক্ষাবর্ষের শিক্ষার্থী প্রবেশ কুমার মাহাতো বলেন, নেপালে ইবির পর্যাপ্ত প্রচার-প্রচারণা না থাকায় বিশ্ববিদ্যালয়টি সম্পর্কে অনেকেই জানেন না। ফলে তুলনামূলক কম খরচে এখানে পড়াশোনার সুযোগ থাকলেও সম্ভাব্য শিক্ষার্থীদের কাছে সেই তথ্য পৌঁছাচ্ছে না।\n\nপড়াশোনার ব্যয় সম্পর্কে প্রবেশ বলেন, ইবিতে পড়ার খরচ তুলনামূলক কম। ব্যক্তিগত ব্যয়ের ধরন অনুযায়ী জীবনযাত্রার খরচে পার্থক্য হলেও মাসে গড়ে তিন হাজার টাকায় খাবারের ব্যবস্থা করা সম্ভব। তবে আন্তর্জাতিক শিক্ষার্থীদের জন্য বৃত্তি, টিউশন ফি মওকুফ কিংবা স্বাস্থ্যবীমার ব্যবস্থা না থাকাকে বড় সীমাবদ্ধতা হিসেবে উল্লেখ করেন তিনি। এসব বিষয়ে অভিযোগ জানিয়েও কার্যকর সাড়া পাননি বলে জানান এই শিক্ষার্থী।\n\nভাষাগত জটিলতা ও প্রশাসনিক কার্যক্রম নিয়েও অভিজ্ঞতার কথা তুলে ধরেন প্রবেশ। তার ভাষ্য, শিক্ষকরা বাংলা ও ইংরেজি দুই ভাষায় কথা বললেও পাঠদানের ক্ষেত্রে সবসময় প্রত্যাশিত ইংরেজি মাধ্যম নিশ্চিত হয় না। পরীক্ষার প্রশ্নপত্র ইংরেজিতে পাওয়া গেলেও কিছু প্রশাসনিক কার্যক্রমে বাংলা ব্যবহারের কারণে সমস্যায় পড়তে হয়। এ ছাড়া বিদেশি শিক্ষার্থীদের জন্য আলাদা একাডেমিক মেন্টর বা টিউটর না থাকায় অনেক ক্ষেত্রে সহপাঠী কিংবা শ্রেণি প্রতিনিধির ওপর নির্ভর করতে হয়।\n\nতবে গাম্বিয়া থেকে আসা অ্যাকাউন্টিং অ্যান্ড ইনফরমেশন সিস্টেমস বিভাগের ২০২১-২২ শিক্ষাবর্ষের শিক্ষার্থী সালিমা জালোর অভিজ্ঞতায় উঠে এসেছে আরও কিছু সমস্যা। খাবার, চিকিৎসা ও দৈনন্দিন জীবনযাপনের ব্যয় নিজেদের বহন করতে হওয়ায় বিদেশি শিক্ষার্থীদের ওপর আর্থিক চাপ তৈরি হয়। অন্য কিছু সরকারি বিশ্ববিদ্যালয়ে আন্তর্জাতিক শিক্ষার্থীদের জন্য আবাসিক হলে খাবার, মৌলিক স্বাস্থ্যসেবা ও মাসিক ভাতার মতো সুবিধা থাকলেও ইবিতে এসব সহায়তার সুযোগ সীমিত। সালিমা বলেন, বিদেশি শিক্ষার্থীদের জন্য অন্তর্ভুক্তিমূলক পরিবেশ ও সামাজিকভাবে একীভূত হওয়ার পর্যাপ্ত উদ্যোগ নেই। সহপাঠীদের সঙ্গে নিয়মিত যোগাযোগ, একাডেমিক আলোচনা এবং প্রত্যাশিত ইংরেজি মাধ্যমে পাঠদানের সুযোগ নিয়েও তার অসন্তোষ রয়েছে।\n\nআবাসন ও জীবনযাত্রার ক্ষেত্রে অবশ্য কিছু ইতিবাচক দিকও রয়েছে। বিদেশি শিক্ষার্থীদের অনেকে হলের পরিবেশ, নিরাপত্তা, ওয়াই-ফাই ও পরিচ্ছন্নতার ব্যবস্থাকে মোটামুটি সন্তোষজনক মনে করেন। তবে বিশুদ্ধ পানির ব্যবস্থা, স্বাস্থ্যসেবা এবং দৈনন্দিন প্রয়োজন মেটাতে আরও প্রাতিষ্ঠানিক সহযোগিতা চান তারা। পাশাপাশি পর্যাপ্ত ল্যাব সুবিধার অভাবও কিছু শিক্ষার্থীর উদ্বেগের কারণ। কয়েকজন শিক্ষার্থীর ভাষ্য, তাদের পরিচিত দুজন পড়াশোনা ছেড়ে নিজ দেশে ফিরে গেছেন। ভাষাগত সমস্যা, শিক্ষার মান নিয়ে উদ্বেগ, ল্যাব সুবিধার সীমাবদ্ধতা ও বৃত্তির অভাবকে তাদের ফিরে যাওয়ার কারণ হিসেবে উল্লেখ করা হয়েছে।\n\nএ বিষয়ে বিশ্ববিদ্যালয়ের আন্তর্জাতিক শিক্ষার্থী সম্পর্ক সংস্থার পরিচালক অধ্যাপক ড. আসাদুজ্জামান বলেন, আন্তর্জাতিক শিক্ষার্থীর সংখ্যা বাড়াতে বিশ্ববিদ্যালয় প্রশাসন কাজ করছে। এজন্য একটি মাস্টারপ্ল্যান তৈরি করা হয়েছে। নভেম্বরের মাঝামাঝি সময়ে এ বিষয়ে সিদ্ধান্ত আসতে পারে। তিনি বলেন, বিদেশি শিক্ষার্থী ভর্তিতে প্রচার-প্রচারণা বাড়ানোর জন্য বুকলেট তৈরি এবং বিশ্ববিদ্যালয়ের ওয়েবসাইটসহ বিভিন্ন মাধ্যমে তথ্য প্রচারের উদ্যোগ নেওয়া হচ্ছে। বৃত্তির বিষয়ে তিনি জানান, এটি নীতিগত সিদ্ধান্তের বিষয়; এক্ষেত্রে বিশ্ববিদ্যালয় মঞ্জুরি কমিশনের (ইউজিসি) সিদ্ধান্ত প্রয়োজন।\n\nশিক্ষার্থীদের মেন্টরশিপের বিষয়ে অধ্যাপক আসাদুজ্জামান বলেন, এ লক্ষ্যে ‘ডিজিটাল লার্নিং রিসোর্স সেন্টার’ করা হয়েছে। এ নিয়ে শিক্ষার্থীদের সঙ্গে কয়েক দফা আলোচনাও হয়েছে। এর মাধ্যমে শিক্ষার্থীদের সঙ্গে যোগাযোগ বৃদ্ধি এবং বাইরের গবেষকদের সঙ্গে সহযোগিতামূলক কাজের সুযোগ সহজ হবে বলে আশা করছেন তিনি।\n\nঅন্যদিকে বিশ্ববিদ্যালয়ের ট্রেজারার অধ্যাপক ড. ইদ্রিস আলী বলেন, তিনি কিছুদিন আগে দায়িত্ব নিয়েছেন। বিষয়টি নিয়ে এখনও বিস্তারিত আলোচনা হয়নি। তবে বিদেশি শিক্ষার্থীদের ভাষাগত জটিলতা রয়েছে বলে তিনি জানেন। সব মিলিয়ে, ইবিতে বিদেশি শিক্ষার্থীদের জন্য কম খরচে পড়াশোনার সুযোগ থাকলেও আন্তর্জাতিক পর্যায়ে পরিচিতি বৃদ্ধি, আর্থিক সহায়তা, ভাষাবান্ধব পাঠদান ও একাডেমিক পরিবেশ উন্নয়নের ঘাটতি বড় চ্যালেঞ্জ হয়ে উঠেছে।"},{"id":"r07","bn":"জাতীয় গ্রিডে বিদ্যুৎ সরবরাহ করছে ইসলামী বিশ্ববিদ্যালয়","en":"IU Supplying Electricity to the National Grid","paper":"Daily Amader Shomoy","date":"05 May 2026","link":"https://epaper.dainikamadershomoy.com/2026/05/05/page-02","content":"নবায়নযোগ্য জ্বালানি ব্যবহারে নতুন দৃষ্টান্ত স্থাপন করেছে ইসলামী বিশ্ববিদ্যালয় (ইবি)। রুফটপ সোলার সিস্টেমের মাধ্যমে বিদ্যুৎ উৎপাদন করে জাতীয় গ্রিডে সরবরাহ করছে বিশ্ববিদ্যালয়টি। একই সঙ্গে নিজস্ব বিদ্যুৎ চাহিদার একটি উল্লেখযোগ্য অংশ সোলার বিদ্যুৎ দিয়ে পূরণ করে লক্ষাধিক টাকা সাশ্রয় করছে প্রতিষ্ঠানটি।\n\nজানা যায়, ২০০ কিলোওয়াট ক্ষমতাসম্পন্ন সোলার পিভি প্যানেল স্থাপনের মাধ্যমে ২০২৩ সালের জুলাই মাস থেকে বিশ্ববিদ্যালয়ে বিদ্যুৎ উৎপাদন শুরু হয়। ইজিপি টেন্ডারের মাধ্যমে বাস্তবায়িত এই প্রকল্পে মোট ব্যয় হয়েছে প্রায় ১ কোটি ৮৬ লাখ টাকা। বিশ্ববিদ্যালয়ের রবীন্দ্র-নজরুল ও বিবিএ ভবনের ছাদে এই সোলার প্যানেল স্থাপন করা হয়েছে। প্যানেলগুলোতে ২০টি ১০ কিলোওয়াট ক্ষমতার ইনভার্টার ব্যবহার করা হয়েছে এবং পুরো সিস্টেমটি গ্রিড-টাইড। প্যানেলগুলো ন্যূনতম ২৫ বছর বিদ্যুৎ উৎপাদনে সক্ষম এবং ওয়ারেন্টি ২০ বছরের।\n\n২০২৩ সালের জুলাই থেকে ২০২৬ সালের মার্চ পর্যন্ত এই সোলার সিস্টেম থেকে মোট ৫ লাখ ৫৫ হাজার ইউনিট বিদ্যুৎ উৎপাদিত হয়েছে। সর্বশেষ ২০২৫ সালের মার্চ থেকে ২০২৬ সালের মার্চ পর্যন্ত এক বছরে সোলার প্যানেল থেকে মোট ১ লাখ ৭৮ হাজার ৮৮৩ কিলোওয়াট বিদ্যুৎ উৎপাদিত হয়েছে। এর মধ্যে বিশ্ববিদ্যালয় নিজে ব্যবহার করেছে ১ লাখ ৪৪ হাজার ১৭৩ কিলোওয়াট এবং অবশিষ্ট ৩৪ হাজার ৭১০ কিলোওয়াট বিদ্যুৎ জাতীয় গ্রিডে সরবরাহ করা হয়েছে। এতে বিশ্ববিদ্যালয়ের ১৫ লাখ ২৪ হাজার ৬৭৬ টাকা সাশ্রয় হয়েছে বলে দাবি সংশ্লিষ্টদের। বিশ্ববিদ্যালয়ের দিনের মোট বিদ্যুৎ চাহিদা প্রায় ২.৫ মেগাওয়াট। এই প্রকল্পটি টেকসই উন্নয়ন লক্ষ্যমাত্রার (এসডিজি) বিশেষত এসডিজি-৭ (সাশ্রয়ী ও পরিচ্ছন্ন জ্বালানি) অর্জনে কার্যকর ভূমিকা রাখছে। ভবিষ্যতে বিশ্ববিদ্যালয়ের নতুন ও পুরাতন ভবনগুলোর অব্যবহৃত ছাদেও সোলার প্যানেল স্থাপনের পরিকল্পনা রয়েছে বলে জানা গেছে।\n\nপ্রকল্প পরিচালক নওয়াব আলী বলেন, ‘জুলাই ২০২৩ থেকে শুরু করে এ পর্যন্ত আমরা মোট ৫ লাখ ৫৫ হাজার ইউনিট বিদ্যুৎ উৎপাদন করতে সক্ষম হয়েছি। গত এক বছরেই বিশ্ববিদ্যালয়ের ১৫ লাখ ২৪ হাজার টাকার বেশি সাশ্রয় হয়েছে। এই প্রকল্পটি দীর্ঘমেয়াদি, প্যানেলগুলো ন্যূনতম ২৫ বছর বিদ্যুৎ উৎপাদন করবে। ভবিষ্যতে নতুন ও পুরাতন ভবনে আরও প্যানেল যুক্ত করার পরিকল্পনা রয়েছে।’\n\nএ বিষয়ে বিশ্ববিদ্যালয়ের প্রধান প্রকৌশলী এ কে এম শরীফ উদ্দিন বলেন, ‘জ্বালানি সংকটের এই সময়ে ইসলামী বিশ্ববিদ্যালয়ের রুফটপ সোলার সিস্টেম একটি কার্যকর সমাধান হিসেবে প্রমাণিত হয়েছে। আমাদের উৎপাদিত বিদ্যুৎ প্রথমে বিশ্ববিদ্যালয়ের নিজস্ব চাহিদা মেটাচ্ছে, এরপর অতিরিক্ত বিদ্যুৎ জাতীয় গ্রিডে যুক্ত হচ্ছে। ভবিষ্যতে বিশ্ববিদ্যালয়ের অব্যবহৃত ছাদগুলোতে আরও সোলার প্যানেল স্থাপন করা হবে, যা বিদ্যুৎ সাশ্রয়কে আরও বাড়াবে।’","img":"images/clip-mveq1z0p.jpg"},{"id":"r06","bn":"উত্তপ্ত গরমে ইবি ক্যাম্পাসের আনসার সদস্যদের মানবেতর জীবন","en":"Inhuman Life of Ansar Members on IU Campus in Scorching Heat","paper":"Daily Amader Shomoy","date":"21 April 2026","link":"https://epaper.dainikamadershomoy.com/view/2026/04/21/07/07_102","content":"ইসলামী বিশ্ববিদ্যালয় (ইবি) ক্যাম্পাসে দায়িত্বরত আনসার সদস্যদের জীবনযাপন অত্যন্ত করুণ অবস্থায় রয়েছে। দিনরাত ক্যাম্পাসের নিরাপত্তা নিশ্চিত করলেও বিভিন্ন সুযোগ-সুবিধা থেকে বঞ্চিত হচ্ছেন বলে অভিযোগ উঠেছে।\n\nজানা গেছে, বিশ্ববিদ্যালয়ে মোট ৯৪ জন আনসার সদস্য দায়িত্ব পালন করছেন। এর মধ্যে কুষ্টিয়া জোনের ৫০ জন এবং ঝিনাইদহ জোনের ৪৪ জন। তারা প্রধান ফটক, লালন শাহ হল সংলগ্ন পকেট গেট এবং শাহ আজিজুর রহমান হল সংলগ্ন পকেট গেট এই তিনটি গুরুত্বপূর্ণ ফটক সহ বিভিন্ন হল গেইটে নিয়মিত রুটিন-ওয়ার্ক দায়িত্ব পালন করেন।\n\nসম্প্রতি নিরাপত্তা জোরদারের লক্ষ্যে দুইটি পকেট গেটে নতুন করে আনসারদের জন্য কক্ষ তৈরি করা হলেও সেখানে নেই কোনো বিদ্যুৎ সংযোগ। ফলে লাইট বা ফ্যানের সুবিধা থেকে বঞ্চিত হওয়ায় গরমে অতিষ্ট তারা।\n\nসরেজমিনে দেখা গেছে, প্রধান ফটকে নিরাপত্তা কক্ষে বিদ্যুৎ সংযোগ থাকলেও একটি ছোট ফ্যান রয়েছে, যা অচল অবস্থায় রয়েছে। বৃষ্টির সময় ছাদ থেকে পানি পড়ে, নিচ দিয়ে ড্রেনের পানি প্রবাহিত হয়। অধিকাংশ জানালার কাচ ভাঙা, যা নিরাপত্তা ও বসবাস, দুই দিক থেকেই ঝুঁকিপূর্ণ।\n\nকুষ্টিয়া জোনের আনসারদের ক্যাম্প বিশ্ববিদ্যালয়ের কেন্দ্রীয় মসজিদের নিচতলায় অবস্থিত। সেখানে বসবাসের পরিবেশ অত্যন্ত নাজুক। অধিকাংশ ফ্যান নষ্ট, একটি কক্ষে কোনো জানালাই নেই এবং ৪টি ফ্যানের স্থানে মাত্র ১টি, সেটিও প্রায় অচল। অন্য একটি কক্ষে এক সুইচে ৪ থেকে ৫টি ফ্যান পরিচালিত হয়। আরেক কক্ষে ৪টির মধ্যে ৩টি ফ্যানই অচল। এই ক্যাম্পে প্রস্রাবের কোনো আলাদা ব্যবস্থা নেই। পায়খানার জন্য কেন্দ্রীয় মসজিদের টয়লেট ব্যবহার করতে হয়। বৃষ্টি হলে কমান্ডারদের থাকার রুমে পানি ঢুকার অভিযোগও রয়েছে।\n\nঝিনাইদহ জোনের আনসার সদস্যদের ক্যাম্প মীর মুগ্ধ সরোবর সংলগ্ন এলাকায় অবস্থিত। সেই ক্যাম্পেও বৃষ্টি হলে ভিতরে পানি ঢুকে, বসবাসের জন্য অনুপযুক্ত বলে অভিযোগ করেন আনসার সদস্যরা।\n\nএকাধিক আনসার সদস্য জানান, প্রতিদিন দীর্ঘ সময়, অনেক সময় প্রায় ১৮ ঘণ্টা ডিউটি শেষে আনসার সদস্যদের জন্য পর্যাপ্ত বিশ্রাম বা ঘুমের পরিবেশ নেই। এতে তাদের শারীরিক ও মানসিক ক্লান্তি বাড়ছে, যা সরাসরি নিরাপত্তা ব্যবস্থার ওপর প্রভাব ফেলতে পারে। নতুন দুই গেইটে (লালন ও আজিজ হল সংলগ্ন) ছোট করে বসার জায়গা তৈরি করে দিলেও কোনো ফ্যানের ব্যবস্থা নাই। গরমে নাভিশ্বাস, সামনে তো আরও গরম পড়বে। দ্রুত ব্যবস্থা নেওয়ার অনুরোধ। \n\nলালন শাহ হল সংলগ্ন পকেট গেটে দায়িত্বে থাকা এক আনসার সদস্য বলেন, ‘বিদ্যুৎ সংযোগ দিয়ে লাইট ও ফ্যানের ব্যবস্থা করা হলে আমাদের কষ্ট অনেকটাই কমতো। রাতের অন্ধকারে ডিউটি করা খুবই কঠিন। রাতে অন্ধকার, দিনে গরম।’\n\nপ্রধান ফটকে ডিউটিরত এক আনসার সদস্য জানান, ‘গত শনিবার নিরাপত্তাকর্মী আশরাফ কয়েকদিনের দিনের মধ্যে ফ্যান লাগানোর আশ্বাস দিয়েছেন।’\n\nপ্রশাসনিক উদাসীনতার অভিযোগ করে সহকারী কমান্ডার আকমল হোসেন বলেন, ‘৩ থেকে ৪ মাস আগে এক সহকারী প্রক্টর বরাত একটি ফাইল ট্রেজারারের মাধ্যমে প্রকৌশল অফিসে পাঠান। আমাদের আশ্বস্ত করা হয়েছিল ফ্যানগুলো ঠিক করে দেওয়া হবে। কিন্তু ফাইলটি এখনো প্রকৌশল অফিসেই পড়ে আছে, কোনো কাজ হয়নি।’\n\nকুষ্টিয়া জোনের কমান্ডার মাহবুব বলেন, ‘১৮ ঘণ্টা ডিউটির পর একজন মানুষের বিশ্রামের ন্যূনতম পরিবেশও এখানে নেই। পকেট গেটের কক্ষগুলোতে কোনো ফ্যান বা লাইট নেই, সরাসরি রোদ পড়ে। সারাদিন-সারারাত গরমে কষ্ট করতে হয়, মশার উপদ্রবও প্রচুর। প্রশাসন যেভাবে অন্যান্য কাজে আন্তরিক, ঠিক আমাদের প্রতিও আন্তরিকতা দেখাবে বলে বিশ্বাস করি।’\n\nবিশ্ববিদ্যালয়ের প্রক্টর অধ্যাপক ড. শাহিনুজ্জামান বলেন, ‘মূলত এগুলো তদারকি করছেন নিরাপত্তাকর্মীদের একটি শাখা। তারা লিখিত আবেদন করলে আমি তাৎক্ষণিক ব্যবস্থা নিতে সহযোগিতা করতে পারি।’\n\nপ্রকৌশল অফিসে যোগাযোগ করা হলে প্রধান প্রকৌশলী এ. কে. এম. শরীফ উদ্দিন জানান, “আমরা প্রস্তাবিত ফাইল তৈরি করে অর্থ ও হিসাব বিভাগে পাঠিয়ে দিয়েছি। সেখান থেকে অর্থ অনুমোদন হয়ে আসলে কাজ করা যাবে।”\n\nফাইলের আপডেট জানতে অর্থ ও হিসাব বিভাগে গেলে তারা ফাইল রিসিভ করার তথ্যপ্রমাণাদি দেখাতে পারলে বর্তমানে ফাইলটি খুঁজে পাচ্ছেন না বলে জানান।\n\nএব্যাপারে পরিচালক আনার পাশা বলেন, “আমরা ফাইলটি প্রকৌশল অফিস থেকে ৫ মাস আগে (১ নভেম্বর ২০২৫) রিসিভ করেছি। কিন্তু এখন ফাইলটি খুঁজে পাওয়া যাচ্ছে না। ফাইলটি খুঁজে না পেলে আবারও প্রকৌশল অফিসে যোগাযোগ করবো পুনরায় তৈরি করে দেয়ার জন্যে।”\n\nএবিষয়ে বিশ্ববিদ্যালয়ের ট্রেজারার অধ্যাপক ড. মো. জাহাঙ্গীর আলম বলেন, “বিষয়টি আমার নলেজে ছিল না। প্রধান প্রকৌশলীকে নির্দেশনা দিয়েছি যাতে দ্রুত কাজ শেষ করা হয়।”","img":"images/clip-mveq30fn.jpg"},{"id":"r05","bn":"ইসলামী বিশ্ববিদ্যালয়ে ক্ষুদ্র নৃগোষ্ঠীদের জীবন ও প্রত্যাশা","en":"Life and Aspirations of Indigenous Communities at IU","paper":"Daily Agrajatra Pratidin","date":"24 February 2026","link":"https://epaper.agrajatrapratidin.com/2026-02-24/edition-147/8/map_147_1123_2qxpnfjcx/","content":"সাম্প্রদায়িক সম্প্রীতি, সহাবস্থান ও বহুত্ববাদী চর্চার এক অনন্য বিদ্যাপীঠ ইসলামী বিশ্ববিদ্যালয় (ইবি)। দেশের বিভিন্ন অঞ্চল, ভাষা ও সংস্কৃতির শিক্ষার্থীদের অংশগ্রহণে ক্যাম্পাসটি হয়ে উঠেছে বৈচিত্র্যের মিলনমেলা। এই বহুসাংস্কৃতিক পরিমণ্ডলে আদিবাসী শিক্ষার্থীরাও নিজেদের স্বতন্ত্র পরিচয় ও ঐতিহ্য নিয়ে শিক্ষাজীবন অতিক্রম করছেন।\n\nজানা যায়, চাকমা, মারমা, ত্রিপুরা, বর্মন, টুডু, গারো, ম্রো, রাজবংশী, সাঁওতাল ও ওরাওসহ বিভিন্ন সম্প্রদায়ের শিক্ষার্থীরা এখানে অধ্যয়ন করছেন। ২০২০-২১ থেকে ২০২৪-২৫ শিক্ষাবর্ষ পর্যন্ত আনুমানিক দেড় শতাধিক আদিবাসী শিক্ষার্থী ভর্তি হয়েছেন বলে জানা যায়। যদিও সুনির্দিষ্ট পরিসংখ্যান প্রশাসনের পক্ষ থেকে প্রকাশিত হয়নি। বিশ্ববিদ্যালয়ে আদিবাসী সম্প্রদায় থেকে একজন শিক্ষক রয়েছেন, বাংলা বিভাগের সহকারী অধ্যাপক ড. তিয়াশা চাকমা।\n\nআদিবাসী শিক্ষার্থীদের পারস্পরিক সহযোগিতা ও কল্যাণে ক্যাম্পাসে ‘জুম্ম ছাত্র কল্যাণ সমিতি’ নামে একটি সংগঠন রয়েছে বলে জানা যায়। তবে বর্তমানে সংগঠনটির কমিটি বিলুপ্ত রয়েছে।\n\nসরকারি নীতিমালা অনুযায়ী পাবলিক বিশ্ববিদ্যালয়গুলোতে আদিবাসী শিক্ষার্থীদের জন্য নির্দিষ্ট আসন সংরক্ষিত থাকে। জানা যায়, ভর্তি পরীক্ষায় অংশগ্রহণ করে নির্ধারিত নম্বর অর্জনের পর কোটা তালিকায় বিবেচিত হতে হয়। এরপর ইউনিয়ন পরিষদ, সার্কেল চিফ বা জেলা প্রশাসকের কার্যালয় থেকে প্রাপ্ত সনদপত্র জমা দিতে হয়। মেধাতালিকা ও কোটা তালিকা আলাদাভাবে প্রকাশ করা হয়।\n\nতবে সনদ সংগ্রহে প্রশাসনিক জটিলতা, কাগজপত্র যাচাইয়ে বিলম্ব, কখনো কোটা আসন পূরণ না হওয়া এবং “কোটা স্টুডেন্ট” পরিচয়ে সামাজিক নেতিবাচক মন্তব্য, এসব বিষয় শিক্ষার্থীদের জন্য চ্যালেঞ্জ হয়ে দাঁড়ায়।\n\nজানা যায়, হল সিট বরাদ্দে রাজনৈতিক প্রভাবের অভিযোগ রয়েছে। দূরবর্তী পার্বত্য অঞ্চল থেকে আগত শিক্ষার্থীরা নীতিগতভাবে অগ্রাধিকার পাওয়ার কথা থাকলেও বাস্তবে সিট পেতে দেরি হয়। সাংস্কৃতিক পার্থক্যের কারণে অনেক সময় মানসিক অস্বস্তিও তৈরি হয়।\n\nআদিবাসী শিক্ষার্থীদের সম্মিলিত দাবি, নির্দিষ্ট কক্ষ বা ব্লকের ব্যবস্থা করে নিরাপদ ও বৈষম্যহীন পরিবেশ নিশ্চিত করা। বিশেষ করে ছাত্রীদের ক্ষেত্রে খাদ্যাভ্যাস ও সাংস্কৃতিক ভিন্নতার কারণে নানা সমস্যার মুখোমুখি হতে হয় বলে জানা যায়।\n\nধর্মীয় ও সাংস্কৃতিক চর্চার ক্ষেত্রে জানা যায়, মুসলিম ও হিন্দু শিক্ষার্থীদের জন্য মসজিদ ও মন্দির থাকলেও বৌদ্ধ শিক্ষার্থীদের জন্য আলাদা বিহার নেই। এছাড়া তাদের গুরুত্বপূর্ণ ধর্মীয় উৎসব, বিশেষ করে বৈসাবি, বিঝু, ওয়াংগালা প্রভৃতি উৎসবে একাডেমিক কার্যক্রম বন্ধ থাকে না বলেও অভিযোগ রয়েছে। নিজস্ব রান্না বা ঐতিহ্যবাহী খাবারের সুযোগও সীমিত। ধর্মীয় আচার পালন কিংবা ঐতিহ্যবাহী পোশাক ও উৎসব উদযাপনে কখনো কটূক্তির শিকার হওয়ার অভিযোগও রয়েছে। এ বিষয়ে প্রশাসনিক সহযোগিতা ও একাডেমিক কার্যক্রমে নমনীয়তার দাবি জানিয়েছেন শিক্ষার্থীরা।\n\nপ্রতি বছর ৯ আগস্ট আন্তর্জাতিক আদিবাসী দিবস অন্যান্য বিশ্ববিদ্যালয়ে পালন হলেও ইসলামী বিশ্ববিদ্যালয়ে পালিত হয় না বলে জানা যায়। এ বিষয়ে দিবসটি পালনের সুযোগ দেওয়ার দাবি রয়েছে।\n\nসনদ যাচাই, বৃত্তি পেতে বিলম্ব, হল সিট সমস্যা, এসব প্রশাসনিক জটিলতার কথাও জানা যায়। পড়াশোনা শেষে চাকরিক্ষেত্রে বৈষম্যের আশঙ্কা, কর্পোরেট সেক্টরে সাংস্কৃতিক পরিচয় নিয়ে অস্বস্তি এবং নিজ এলাকায় পর্যাপ্ত কর্মসংস্থানের অভাবও চ্যালেঞ্জ হিসেবে দেখা দেয়।\n\nসাম্প্রতিক বছরগুলোতে কোটা নীতি ও সচেতনতা বৃদ্ধির ফলে ভর্তি সংখ্যা কিছুটা বেড়েছে। তবে পার্বত্য অঞ্চলে শিক্ষার সুযোগ সীমিত থাকায় সামগ্রিক অনুপাত এখনো কম। এলামনাইয়ের নির্দিষ্ট পরিসংখ্যান না থাকলেও বিভিন্ন বিভাগ থেকে পাস করা শিক্ষার্থীরা বিসিএস ও অন্যান্য ভালো অবস্থানে রয়েছেন বলে জানা যায়।\n\n২০২৪-২৫ শিক্ষাবর্ষের অ্যাপ্লাইড কেমিস্ট্রি অ্যান্ড কেমিক্যাল ইঞ্জিনিয়ারিং বিভাগের শিক্ষার্থী সুকীর্তি চাকমা বলেন, “আমাদের জন্য হলে সিট বরাদ্দ দিয়ে শতভাগ আবাসিকতা নিশ্চিত করা প্রয়োজন। আমাদের ধর্মীয় ও সাংস্কৃতিক উৎসব পালনের পরিবেশ তৈরি করা দরকার। বিশেষ করে বিঝু উৎসবে একাডেমিক কার্যক্রম বা পরীক্ষা না রাখার বিষয়টি বিবেচনা করা উচিত। পাশাপাশি আমাদের সেইফটি কনসার্ন, বিশেষ করে মেয়েদের নিরাপত্তা নিশ্চিত করা প্রয়োজন।”\n\n২০২৩-২৪ শিক্ষাবর্ষের কমিউনিকেশন অ্যান্ড মাল্টিমিডিয়া জার্নালিজম বিভাগের শিক্ষার্থী সুমনা চাকমা বলেন, “কোটা আমাদের ন্যায্য অধিকার। আমরা যে অবস্থা থেকে উঠে আসি সেদিক দিয়ে বিবেচনা করলে এত দূর আসাটাই অনেক বড় অর্জন। আমরা সাধারণ শিক্ষার্থীদের মতো সমান সুযোগ চাই। আমাদের সংস্কৃতি ও পরিচয়কে সম্মান জানিয়ে শিক্ষা গ্রহণের পরিবেশ চাই। বিশ্ববিদ্যালয় হোক বৈচিত্র্যের মিলনমেলা। যেখানে সকল জাতি, ধর্ম ও সংস্কৃতি সমান মর্যাদা পাবে।”\n\nজুম্ম ছাত্র কল্যাণ সমিতির সাবেক সাধারণ সম্পাদক পিকাসু চাকমা জানান, “প্রশাসন যদি হলে সিট প্রদানের ক্ষেত্রে আরও সুদৃষ্টি দিতো তাহলে আমাদের জন্য সুবিধার হতো। কিছু সময় ক্যাম্পাসে বুলিংয়ের স্বীকার হতে হয়। এছাড়া তেমন বড় কোনো অসুবিধা নেই।”\n\nপ্রভোস্ট কাউন্সিলের সভাপতি অধ্যাপক ড. মো. জালাল উদ্দিন বলেন, “আমরা শিক্ষাবর্ষভিত্তিক হলে আবেদনের ভিত্তিতে আসন বন্টন করে থাকি। এক্ষেত্রে মেয়েদের হলে ক্ষুদ্র নৃগোষ্ঠীদের আবেদন তুলনামূলক কম হয়ে থাকে। তবে তাদেরকে আমরা সিট বন্টনের ক্ষেত্রে অগ্রাধিকার দিয়ে থাকি।”\n\nবৈচিত্র্যময় ক্যাম্পাসে অন্তর্ভুক্তিমূলক নীতিমালা ও সহায়ক পরিবেশ নিশ্চিত করা গেলে আদিবাসী শিক্ষার্থীদের অংশগ্রহণ ও অবদান আরও সমৃদ্ধ হবে বলে মনে করছেন সংশ্লিষ্টরা।","img":"images/clip-mveq458x.jpg"},{"id":"r04","bn":"ক্যাম্পাসে নিরব সংগ্রাম: তিন দশকের বেশি সময় ধরে বিশ্বজিত","en":"Silent Struggle on Campus: Biswajit for Over Three Decades","paper":"Daily Agrajatra Pratidin","date":"11 February 2026","link":"https://epaper.agrajatrapratidin.com/2026-02-11/edition-133/2/","content":"ইসলামী বিশ্ববিদ্যালয় (ইবি) ক্যাম্পাসের প্রতিদিনের চেনা দৃশ্যের এক অবিচ্ছেদ্য অংশ শ্রী বিশ্বজিত চন্দ্র দাস। বয়স ৪০ হলেও তাঁর কর্মজীবনের অভিজ্ঞতা প্রায় তিন দশকের বেশি। দীর্ঘ ৩১ বছর ধরে তিনি মুচির কাজ করে আসছেন, যার পুরোটাই কেটেছে এই বিশ্ববিদ্যালয় ক্যাম্পাসেই।\n\nবিশ্বজিত চন্দ্র দাসের বাড়ি ঝিনাইদহের ত্রিবেণী এলাকায়। সংসারে স্ত্রী ও দুই সন্তান রয়েছে। সীমিত আয়ের মধ্যেই চলে তাঁর পরিবার। তবু জীবনের প্রতি রয়েছে দৃঢ়তা আর পরিশ্রমের প্রতি অটল শ্রদ্ধা।\n\nপ্রতিদিন সকাল ৯টা থেকে তিনি ক্যাম্পাসের আমবাগানের মেহগনি গাছের সামনে বসেন। সেখানে বিকেল ৪টা পর্যন্ত কাজ করেন। সন্ধ্যার পর সাড়ে ৮টা পর্যন্ত তিনি বিভিন্ন আবাসিক হলে গিয়ে কাজ করে থাকেন।\n\nবৃহস্পতিবার ও শনিবার শাহ আজিজুর রহমান হলে, শুক্রবার ও রবিবার শহীদ জিয়াউর রহমান হলে, মঙ্গলবার লালন শাহ হলে এবং সোমবার ও বুধবার সাদ্দাম হোসেন হলে।\n\nএই দীর্ঘ সময়ে শিক্ষক, শিক্ষার্থী ও কর্মচারীদের অনেকেই তাঁকে চেনেন এবং প্রয়োজনের সময় তাঁর কাছেই আসেন।\n\nমুচির কাজ করে প্রতিদিন গড়ে ৪০০ থেকে ৫০০ টাকা আয় হয় তাঁর। এই আয় দিয়েই চলে পরিবারের যাবতীয় খরচ। ক্যাম্পাস বন্ধ থাকলে তিনি বিভিন্ন বাড়িতে বসে কাজ করেন, যাতে আয়ের ধারাবাহিকতা বজায় থাকে।\n\nবিশ্বজিত চন্দ্র দাস জানান, একসময় মুচির কাজের পাশাপাশি তিনি থানায় প্রায় ১৬ বছর পরিচ্ছন্নতাকর্মী হিসেবেও কাজ করেছেন। তবে চাকরিটি স্থায়ী না হওয়ায় শেষ পর্যন্ত তা ছেড়ে দিতে হয়। পরে মাঈশা কোম্পানিতেও চাকরি করেছিলেন। কিন্তু সেখানে নিয়মিত বেতন না পাওয়া ও কর্মপরিবেশ ভালো না হওয়ায় সে চাকরিও ছেড়ে দেন।\n\n“সংসার চলে যায়, এইটাই বড় কথা,” বলেন বিশ্বজিত চন্দ্র দাস।\n\nক্যাম্পাসে কাজ করতে কোনো অসুবিধা হয় না বলেও জানান তিনি। বরং পরিচিত পরিবেশ, মানুষের সহযোগিতা ও সম্মানবোধ তাঁকে স্বস্তি দেয়। পরিবারে সবাই সুস্থ আছে, এটিই তাঁর কাছে সবচেয়ে বড় শান্তির বিষয়।\n\nশহীদ জিয়াউর রহমান হলের আবাসিক শিক্ষার্থী রায়হান উদ্দিন সজিব বলেন, “বিশ্বজিত দাদা আমাদের ক্যাম্পাসের নীরব পরিশ্রমী মানুষদের একজন। দীর্ঘদিন ধরে তিনি সততা ও নিষ্ঠার সঙ্গে কাজ করে যাচ্ছেন। তাঁর আচরণ ও পরিশ্রম আমাদের জন্য অনুপ্রেরণা। এমন মানুষদের সম্মান দেওয়া আমাদের দায়িত্ব।”\n\nআরেক শিক্ষার্থী সাইফুল ইসলাম বলেন, “আমরা অনেক সময় ক্যাম্পাসের এমন মানুষদের গুরুত্ব দিই না, কিন্তু বিশ্বজিত দাদার মতো মানুষরাই ক্যাম্পাসের সৌন্দর্য ও মানবিক দিককে ধরে রেখেছেন। পড়াশোনার পাশাপাশি তাঁর জীবনসংগ্রাম আমাদের অনেক কিছু শেখায়।”\n\nবিশ্ববিদ্যালয়ের হাজারো মানুষের ভিড়ে বিশ্বজিত চন্দ্র দাস হয়তো খুব পরিচিত মুখ নন, কিন্তু তাঁর দীর্ঘদিনের শ্রম, সততা ও আত্মসম্মান তাঁকে নিঃসন্দেহে ক্যাম্পাসের এক নীরব অনুপ্রেরণায় পরিণত করেছে। জীবনসংগ্রামের মাঝেও কাজের প্রতি নিষ্ঠা ও দায়িত্ববোধই তাঁকে আজও প্রতিদিন সকালে আমবাগানের মেহগনি গাছের নিচে বসতে শক্তি জোগায়।","img":"images/clip-mveq4psw.jpg"},{"id":"r03","bn":"ইসলামী বিশ্ববিদ্যালয়ের ক্যাম্পাস অনিরাপদ: সীমানাপ্রাচীর ও প্রহরী সঙ্কট","en":"IU Campus Unsafe: Boundary Wall and Guard Crisis","paper":"Daily Amader Shomoy","date":"28 January 2026","link":"https://epaper.dainikamadershomoy.com/2026/01/28/page-06","content":"প্রায় ১৭৫ একর বিস্তৃত ইসলামী বিশ্ববিদ্যালয় (ইবি) ক্যাম্পাসের বিভিন্ন গুরুত্বপূর্ণ অংশে নিরাপত্তা প্রাচীর ভাঙা, নিচু কিংবা একেবারেই না থাকায় বিশ্ববিদ্যালয়ের সার্বিক নিরাপত্তা নিয়ে চরম উদ্বেগ দেখা দিয়েছে। দীর্ঘদিন ধরে এসব ঝুঁকিপূর্ণ স্থান সংস্কারে কার্যকর উদ্যোগ না থাকায় অবাধ প্রবেশ বাড়ছে স্থানীয় মানুষ ও যানবাহনের।\n\nসরেজমিনে গিয়ে দেখা যায়, বিশ্ববিদ্যালয়ের মীর মুগ্ধ সরোবর সংলগ্ন সীমানা প্রাচীর বেশ কয়েকটি স্থানে নিচু ও ভাঙা অবস্থায় রয়েছে। এর ফলে কোনো ধরনের বাধা ছাড়াই স্থানীয়রা ক্যাম্পাসে প্রবেশ করছে। বিশেষ করে লেকের একপাশে রাতের বেলায় পর্যাপ্ত আলোর ব্যবস্থা না থাকায় ওই এলাকা আরও ঝুঁকিপূর্ণ হয়ে উঠছে।\n\nএছাড়া শাহ আজিজুর রহমান পকেট গেট সংলগ্ন নিরাপত্তা প্রাচীর কয়েক মাস আগে ভেঙে পড়লেও এখন পর্যন্ত সেটি সংস্কারের কোনো দৃশ্যমান উদ্যোগ নেয়নি প্রশাসন। ভাঙা অবস্থাতেই পড়ে থাকায় এটি নিরাপত্তা হুমকির বড় উৎস হয়ে দাঁড়িয়েছে।\n\nঅন্যদিকে, ইসলামী বিশ্ববিদ্যালয় থানা সংলগ্ন গেট সবসময় খোলা থাকায় সেখানে কার্যত কোনো নিরাপত্তা বেষ্টনী নেই। এদিক দিয়ে মানুষ ও যানবাহন নির্বিঘ্নে ক্যাম্পাসে প্রবেশ করছে। প্রশাসন মাঝে মাঝে বাঁশের অস্থায়ী ঘের দিলেও তা টেকসই নয় এবং কার্যকর নিরাপত্তা নিশ্চিত করতে ব্যর্থ হচ্ছে।\n\nইবি ল্যাবরেটরি স্কুল অ্যান্ড কলেজের নিরাপত্তা গেট নিচু হওয়ায় সেখান দিয়ে অনেকে গেট টপকে যাতায়াত করছে, এমন অভিযোগও উঠেছে। এতে শিক্ষার্থী ও শিক্ষা প্রতিষ্ঠানের নিরাপত্তা প্রশ্নের মুখে পড়ছে।\n\nএছাড়া বিশ্ববিদ্যালয়ের আবাসিক এলাকার দিকেও একাধিক স্থানে সীমানা প্রাচীর নেই কিংবা সম্পূর্ণ উন্মুক্ত অবস্থায় রয়েছে, যা আবাসিক শিক্ষার্থী ও শিক্ষকদের নিরাপত্তা ঝুঁকি আরও বাড়িয়ে তুলছে।\n\nবিশ্ববিদ্যালয়ের বিভিন্ন অংশে এ ধরনের নিরাপত্তা দুর্বলতা অব্যাহত থাকায় শিক্ষার্থী ও সংশ্লিষ্টদের মাঝে উদ্বেগ বাড়ছে। দ্রুত সময়ের মধ্যে টেকসই ও আধুনিক নিরাপত্তা প্রাচীর নির্মাণের পাশাপাশি পর্যাপ্ত আলোর ব্যবস্থা এবং কার্যকর নজরদারির দাবি জানিয়েছেন সংশ্লিষ্টরা।\n\nএ ব্যাপারে হিসাববিজ্ঞান ও তথ্যপদ্ধতি বিভাগের শিক্ষার্থী মো. হাসিব রামিম বলেন, “বিশ্ববিদ্যালয়ের মতো একটি গুরুত্বপূর্ণ প্রতিষ্ঠানে এভাবে উন্মুক্ত প্রবেশ সত্যিই উদ্বেগজনক। রাতের বেলায় চলাচলের সময় নিরাপত্তাহীনতা বেশি অনুভূত হয়। দ্রুত সীমানা প্রাচীর সংস্কার না হলে যেকোনো সময় অনাকাঙ্ক্ষিত ঘটনা ঘটতে পারে।”\n\nলোকপ্রশাসন বিভাগের শিক্ষার্থী সাইফুল ইসলাম বলেন, “ক্যাম্পাসে অবাধে বহিরাগত ও যানবাহন প্রবেশ করায় শিক্ষার্থীদের নিরাপত্তা ঝুঁকির মধ্যে পড়ছে। প্রশাসনের উচিত বিষয়টিকে গুরুত্ব দিয়ে স্থায়ী ও কার্যকর নিরাপত্তা ব্যবস্থা গ্রহণ করা।”\n\nবায়োমেডিকেল ইঞ্জিনিয়ারিং বিভাগের শিক্ষার্থী মাহমুদা আক্তার মিমি বলেন, “বিশেষ করে ছাত্রীদের জন্য নিরাপত্তা সবচেয়ে গুরুত্বপূর্ণ। ভাঙা বা নিচু প্রাচীর এবং পর্যাপ্ত আলোর অভাব আমাদের চলাচলে ভীতি তৈরি করে। দ্রুত আধুনিক নিরাপত্তা প্রাচীর ও পর্যাপ্ত লাইটিং নিশ্চিত করা জরুরি।”\n\nক্যাম্পাসের নিরাপত্তার দায়িত্বে থাকা আনসার সদস্য সহকারী কমান্ডার মাহবুবুর রহমান বলেন, “আমরা প্রশাসনকে সর্বদা আনসার সদস্য সংকটের ব্যাপারে অবগত করেছি। আনসার সদস্য সংকটের কারণে অনেকেই ডাবল ডিউটি করে থাকে। তাছাড়াও সীমানা প্রাচীর সংস্কারের কাজ প্রকৌশল অফিসের নিয়ন্ত্রণে।”\n\nপ্রক্টর ড. মো. শাহীনুজ্জামান বলেন, “পর্যাপ্ত আনসার সদস্যের অভাবে আমরা পুরো বিশ্ববিদ্যালয় ক্যাম্পাস নিরাপত্তার আওতায় আনতে পারছি না। প্রায় আরও ১৫ থেকে ২০ জন আনসার সদস্য নিয়োগের প্রয়োজনীয়তা রয়েছে। এ ব্যাপারে সরকার থেকে ব্যবস্থা নেয়া ছাড়া বিকল্প ব্যবস্থা নেই।”\n\nসীমানাপ্রাচীর নিয়ে তিনি বলেন, “স্থানীয়দের প্রভাবের কারণে অনেক জায়গায় সীমানাপ্রাচীর ভেঙে দেয়া হচ্ছে। বাজেটের অর্থের অভাবে সীমানাপ্রাচীর পুনঃনির্মাণ করা যাচ্ছে না। সীমানাপ্রাচীর নির্মাণ করা গেলে অনেকটাই সুবিধা হবে। আমরা সীমানাপ্রাচীর নির্মাণের জন্য বাজেটে আবেদন করেছি। বাজেট পাশ হলে প্রাচীর নির্মাণ সম্ভব হবে।”","img":"images/clip-mveq5bb5.jpg"},{"id":"r02","bn":"ইবিতে ৯ মসজিদ: ক্যাম্পাসজুড়ে ইবাদতের আবহ","en":"9 Mosques at IU: An Atmosphere of Worship Across Campus","paper":"Daily Agrajatra Pratidin","date":"28 December 2025","link":"https://www.agrajatrapratidin.com/education/news/12928","content":"কুষ্টিয়ার ইসলামী বিশ্ববিদ্যালয় (ইবি) শিক্ষা, গবেষণা ও নৈতিক চর্চার পাশাপাশি ধর্মীয় অনুশীলনের এক অনন্য দৃষ্টান্ত স্থাপন করেছে। বিশ্ববিদ্যালয় ক্যাম্পাসজুড়ে অবস্থিত মোট ৯টি মসজিদ ইবিকে দেশের অন্যান্য পাবলিক বিশ্ববিদ্যালয়ের তুলনায় স্বতন্ত্র বৈশিষ্ট্য দিয়েছে।\n\nএসব মসজিদের মধ্যে রয়েছে একটি কেন্দ্রীয় মসজিদ, চারটি হল মসজিদ, লালন শাহ হল পকেট গেট সংলগ্ন একটি মসজিদ, প্রশাসন ভবন সংলগ্ন একটি মসজিদ, উপাচার্য বাসভবন সংলগ্ন ভিসি মসজিদ এবং ইসলামী বিশ্ববিদ্যালয় থানার মসজিদ।\n\nশিক্ষার্থীদের পাশাপাশি স্থানীয় এলাকার মুসল্লিরাও ইসলামী বিশ্ববিদ্যালয়ের এই ৯টি মসজিদে নিয়মিত ইবাদতে অংশ নেন। শুধুমাত্র কেন্দ্রীয় মসজিদেই জুমার নামাজ অনুষ্ঠিত হয় এবং প্রতি শুক্রবার সেখানে শিক্ষার্থী, শিক্ষক, কর্মকর্তা-কর্মচারী, স্থানীয় লোকজনসহ বিপুলসংখ্যক মুসল্লির সমাগম ঘটে।\n\nইসলামী বিশ্ববিদ্যালয়ের কেন্দ্রীয় মসজিদটি দেশের ধর্মীয় স্থাপত্যের অন্যতম গুরুত্বপূর্ণ নিদর্শন হিসেবে বিবেচিত। প্রায় ৫ দশমিক ৫৬ একর জায়গাজুড়ে অবস্থিত এই মসজিদের ধারণক্ষমতা প্রায় ১৭ হাজার মুসল্লি। মসজিদটির প্রধান গম্বুজের উচ্চতা ১৫০ ফুট এবং পুরো স্থাপনায় রয়েছে মোট ১৪টি গম্বুজ। ১৯৯৪ সালে প্রতিষ্ঠিত এই কেন্দ্রীয় মসজিদটি বাংলাদেশ সরকার ও সৌদি আরব সরকারের যৌথ অর্থায়নে নির্মিত হয়। এটি বাংলাদেশের তৃতীয় বৃহত্তম মসজিদ এবং যেকোনো ধরনের শিক্ষাপ্রতিষ্ঠানভিত্তিক দেশের সবচেয়ে বৃহত্তম মসজিদ হিসেবে পরিচিত।\n\nতবে ক্যাম্পাসজুড়ে মসজিদের সংখ্যা উল্লেখযোগ্য হলেও কিছু হলে এখনো ইমাম সংকট রয়েছে। জানা যায়, বর্তমানে শহীদ আনাস হল ও লালন শাহ হলে স্থায়ী নিয়োগপ্রাপ্ত কোনো ইমাম নেই। ফলে এসব হলের শিক্ষার্থীরা নিয়মিত ধর্মীয় কার্যক্রম পরিচালনায় কিছুটা ভোগান্তির মুখে পড়ছেন বলে সংশ্লিষ্টরা জানিয়েছেন।\n\nএ বিষয়ে হল প্রভোস্টরা দ্রুত স্থায়ী ইমাম নিয়োগের দাবি জানিয়েছেন। তাদের মতে, হলভিত্তিক মসজিদগুলোতে ইমাম নিয়োগ নিশ্চিত করা গেলে শিক্ষার্থীদের ধর্মীয় অনুশীলন আরও সহজ ও নিয়মতান্ত্রিক হবে।\n\nইসলামী আদর্শ ও আধুনিক শিক্ষার সমন্বয়ে মানবিক ও নৈতিক নাগরিক গড়ে তোলার যে লক্ষ্য নিয়ে ইসলামী বিশ্ববিদ্যালয় প্রতিষ্ঠিত হয়েছে, ক্যাম্পাসজুড়ে বিস্তৃত এই ৯টি মসজিদ সেই দর্শনকে বাস্তব রূপ দিয়েছে বলে মনে করছেন সংশ্লিষ্টরা।\n\nকেন্দ্রীয় মসজিদের খতিব আশরাফ উদ্দিন খান বলেন, “আমাদের ক্যাম্পাসে বর্তমানে যে ৯টি মসজিদ রয়েছে সেগুলো ক্যাম্পাসে শিক্ষার্থীদের ইসলামী মূল্যবোধে গুরুত্বপূর্ণ ভূমিকা রাখছে। শিক্ষার্থীদের উচিত নিয়মিত এবাদত পালনে আগ্রহী হওয়া এবং শুধু নামাজের জন্য নয় জ্ঞান অর্জনের জন্যেও মসজিদে আগমন করা।”\n\nতিনি আরও বলেন, ”ইবির কেন্দ্রীয় মসজিদের পূর্ণাঙ্গ কাজ এখনো শেষ হয়নি। সংশ্লিষ্ট কর্তৃপক্ষের কাছে অনুরোধ করবো যাতে দ্রুত এর কাজ শেষ করা হয়।”\n\nউপাচার্য অধ্যাপক ড. নকীব মোহাম্মদ নসরুল্লাহ বলেন, “ইসলামী বিশ্ববিদ্যালয় শুধু একটি উচ্চশিক্ষা প্রতিষ্ঠান নয়; এটি নৈতিকতা, মানবিকতা ও ধর্মীয় মূল্যবোধ চর্চার এক অনন্য কেন্দ্র। ক্যাম্পাসজুড়ে অবস্থিত ৯টি মসজিদ শিক্ষার্থী, শিক্ষক ও কর্মচারীদের ধর্মীয় অনুশীলনের সুযোগ নিশ্চিত করার পাশাপাশি নৈতিক ও শালীন জীবনচর্চায় উদ্বুদ্ধ করছে। বিশেষ করে কেন্দ্রীয় মসজিদটি আমাদের বিশ্ববিদ্যালয়ের ধর্মীয় ও সাংস্কৃতিক পরিচয়ের প্রতীক। ইবাদতের মাধ্যমে শিক্ষার্থীরা আত্মিক শুদ্ধতা অর্জনের পাশাপাশি দায়িত্বশীল ও আদর্শ নাগরিক হিসেবে গড়ে উঠবে, এটাই আমাদের প্রত্যাশা।”","img":""},{"id":"r01","bn":"ইবিতে ৪৭ বছরে ৪ সমাবর্তন","en":"Only 4 Convocations in 47 Years at IU","paper":"Daily Amader Shomoy","date":"22 November 2025","link":"https://epaper.dainikamadershomoy.com/2025/11/22/page-03","content":"বিশ্ববিদ্যালয় পড়া প্রতিটা শিক্ষার্থীর স্বপ্ন থাকে তার পড়াশুনা জীবন শেষ হবে গায়ে কালো গাউন, মাথায় কালো টুপি ও হাতে তার অর্জিত সনদপত্র দিয়ে। তবে নিয়মিত সমাবর্তন না পাওয়ায় ইসলামী বিশ্ববিদ্যালয়ের (ইবি) শিক্ষার্থীদের এই স্বপ্ন থাকছে অপূর্ণ। বিশ্ববিদ্যালয় প্রতিষ্ঠার ৪৭ বছরে মোট সমাবর্তন হয়েছে ৪টি। সমাবর্তনের জন্য বিশ্ববিদ্যালয়ের সাবেক ও বর্তমান শিক্ষার্থীরা বিভিন্নভাবে প্রতিনিয়ত দাবি জানিয়ে আসছে। তবে বিশ্ববিদ্যালয় প্রশাসন থেকে বার বার আশ্বাস দেয়া হলেও বাস্তবতা ভিন্ন।\n\nজানা যায়, ইসলামী বিশ্ববিদ্যালয়ে সর্বশেষ (চতুর্থ) সমাবর্তন অনুষ্ঠিত হয়েছিল ২০১৮ সালের ৭ জানুয়ারি। উক্ত সমাবর্তনে ১৯৯৭-৯৮ শিক্ষাবর্ষ থেকে ২০১১-১২ শিক্ষাবর্ষ পর্যন্ত স্নাতক, ২০১৪-১৫ শিক্ষাবর্ষ পর্যন্ত স্নাতকোত্তর এবং বিশ্ববিদ্যালয়ের ২৩৬তম সিন্ডিকেট সভায় অনুমোদিত এমফিল ও পিএইচডি ডিগ্রিধারীরা অংশগ্রহণের সুযোগ পান। বিশ্ববিদ্যালয়ের আচার্য ও সাবেক রাষ্ট্রপতি মো.আব্দুল হামিদ উপস্থিত থেকে শিক্ষার্থীদের হাতে সনদপত্র তুলে দিয়েছিলেন। \n\nএর আগে ২০০২ সালের ২৮ মার্চ তৃতীয় সমাবর্তন, ১৯৯৯ সালের ৫ ডিসেম্বর দ্বিতীয় সমাবর্তন ও ১৯৯৩ সালের ২৭ এপ্রিল ইবিতে প্রথম সমাবর্তন অনুষ্ঠিত হয়েছিল।\n\nসমাবর্তন না হওয়াতে বিশ্ববিদ্যালয়ের শিক্ষার্থীদের স্নাতক বা স্নাতকোত্তর শেষে প্রভিশনাল সার্টিফিকেট (সাময়িক সনদপত্র) নিয়েই ক্যাম্পাস ছাড়তে হচ্ছে। নিয়মিত সমাবর্তন না হওয়ায় বিশ্ববিদ্যালয় কর্তৃপক্ষের অবহেলা ও স্বদিচ্ছা নিয়ে প্রশ্ন তুলেছেন শিক্ষার্থীরা। ২০১২-১৩ থেকে ২০১৮-১৯ অব্দি প্রায় ১০ হাজার ৩২৮ জন শিক্ষার্থী স্নাতক, ২০১৫-১৬ থেকে ২০২০-২১ অব্দি প্রায় ০৮ হাজার ৩৭ জন শিক্ষার্থী স্নাতকোত্তর সম্পন্ন করেছে বলে জানিয়েছে বিশ্ববিদ্যালয়ের উপ-পরীক্ষা নিয়ন্ত্রক শাখা। এছাড়াও বেশ কয়েকটি বর্ষের এমফিল ও পিএইচডি গবেষকরা ডিগ্রি নিয়েছেন।\n\nবিশ্ববিদ্যালয়ের ফলিত রসায়ন ও কেমিকৌশল বিভাগের ২০১৭-১৮ শিক্ষাবর্ষের সাবেক শিক্ষার্থী সালমান হোসেন বলেন, \"সমাবর্তন শিক্ষার্থীদের জন্য এক বিশেষ আকর্ষণের কেন্দ্রবিন্দু। এটি শুধু আনুষ্ঠানিকতার মধ্যে সীমাবদ্ধ নয়, বরং এর মাধ্যমে শিক্ষার্থীদের মাঝে পারস্পরিক বন্ধন দৃঢ় হয়। অনেক এলামনাই আছেন, যারা বর্তমানে দেশ-বিদেশে ভালো অবস্থানে রয়েছেন—কিন্তু আমরা তাদের সম্পর্কে জানি না। যদি সমাবর্তন অনুষ্ঠিত হতো, তাহলে আমরা তাদের সাথে পরিচিত হতে পারতাম, মতবিনিময়ের সুযোগ পেতাম। এতে একদিকে যেমন আমাদের মধ্যে আন্তঃসম্পর্ক আরও গভীর হতো, অন্যদিকে এলামনাই নেটওয়ার্কও আরও শক্তিশালী হয়ে উঠতো।\"\n\nবিশ্ববিদ্যালয়ের বায়োমেডিকেল ইঞ্জিনিয়ারিং বিভাগের বর্তমান শিক্ষার্থী মাহমুদা আক্তার মিমি বলেন, \"আমাদের বিশ্ববিদ্যালয়ে ৪৭ বছরে মাত্র ৪ সমাবর্তন হয়েছে, এই সংখ্যাটি সত্যিই কম। সমাবর্তন শুধু একটি অনুষ্ঠান নয়, এটি একজন শিক্ষার্থীর শিক্ষাজীবনের এক সুন্দর সমাপ্তির অংশও বটে। আমি চাই আমাদের বিশ্ববিদ্যালয় আর পিছিয়ে না থাকুক এবং আমরা সকলেই যেন বিশ্ববিদ্যালয় জীবন শেষে এই সুন্দর সমাপ্তির অনুষ্ঠানটি পাই, এটিই বিশ্ববিদ্যালয় কর্তৃপক্ষের কাছে আমার চাওয়া।\"\n\nবিশ্ববিদ্যালয়ের তথ্য ও যোগাযোগ প্রযুক্তি বিভাগের ২০১৪-১৫ শিক্ষাবর্ষের আরেক সাবেক শিক্ষার্থী মোস্তাফিজুর রহমান রাজু বলেন, \"প্রতিটি প্রাইভেট বিশ্ববিদ্যালয়ে প্রতি বছর সমাবর্তন হলেও পাবলিক বিশ্ববিদ্যালয়ে বেশ কয়েক বছর পর পর সমাবর্তন হয়। এটি অবশ্যই আমাদের জন্য বেদনাদায়ক। প্রতি বছর না হলেও অন্তত ২ বা ৩ বছর পর পর সমাবর্তন হওয়া উচিত। এতে সিনিয়র-জুনিয়র সবাই মিলে একত্রিত হওয়া যায়। আশা করি খুব দ্রুতই আমাদের বিশ্ববিদ্যালয়ে সমাবর্তন হবে।\" \n\nউপাচার্য অধ্যাপক ড. নকীব মোহাম্মদ নসরুল্লাহ বলেন, “সমাবর্তন এবছরের ডিসেম্বর বা আগামী বছরের জানুয়ারিতে করার পরিকল্পনা ছিল। তবে গুচ্ছ ভর্তি পরীক্ষার মতো মহাযজ্ঞ কাঁধে আসায় ব্যস্ততা বাড়ছে। আগামী বছর শেষের দিকে চেষ্টা করবো। এছাড়া বিদেশে স্কলারশিপ বা উচ্চ শিক্ষা নিতে আবেদন করার জন্যও অনেক সময় মূল সার্টিফিকেট লাগে, এক্ষেত্রে আমাদের অর্ডিন্যান্সের প্রতিবন্ধকতা কাটিয়ে তুলতে কিছুটা সংশোধনী দরকার।”","img":"images/clip-mveq5yda.jpg"}],"edu":[{"period":"2023 — Present","degree":"B.Sc. (Engg.) in Biomedical Engineering","inst":"Islamic University, Kushtia, Bangladesh","note":"Faculty of Engineering and Technology","badges":["Currently Running · 6th Batch","Session 2022–23"]},{"period":"Class of 2022","degree":"Higher Secondary Certificate (HSC)","inst":"Government Bangla College, Dhaka","note":"","badges":["GPA 4.50 / 5.00","Science Group"]},{"period":"Class of 2020","degree":"Secondary School Certificate (SSC)","inst":"Tongi Pilot High School, Gazipur","note":"","badges":["GPA 5.00 / 5.00 ✦","Science Group"]}],"jobs":[{"org":"Daily Amader Shomoy","role":"Islamic University Correspondent","periods":["August 2026 — Present"],"status":"current"},{"org":"Daily Agrajatra Pratidin","role":"Islamic University Correspondent","periods":["January 2026 — December 2026"],"status":"former"},{"org":"Sunnews","role":"Islamic University Correspondent","periods":["January 2026 — December 2026"],"status":"former"},{"org":"The Daily Aajker Probhat","role":"Islamic University Correspondent","periods":["December 2025 — December 2026"],"status":"former"},{"org const MO='january february march april may june july august september october november december'.split(' ');
const ts=d=>{const m=String(d).match(/(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);return m?Date.UTC(+m[3],Math.max(0,MO.indexOf(m[2].toLowerCase())),+m[1]):0};
const W=[...S.articles,...S.reports].sort((a,b)=>ts(b.date)-ts(a.date));
const nm=H.name.split(' ').filter(w=>!/^md\.?$/i.test(w)),short=nm.length>1?nm[0]+' '+nm[nm.length-1]:H.name;
const paras=t=>String(t||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('');
const today=()=>{try{return new Intl.DateTimeFormat(/[\u0980-\u09FF]/.test(H.place)?'bn-BD':'en-GB',{day:'numeric',month:'long',year:'numeric'}).format(new Date())}catch(e){return ''}};
const row=x=>`<a class="row" href="w/${esc(x.id)}.html"><div class="m"><span>${esc(x.paper)}${x.id[0]=='r'?'<b>Report</b>':''}</span><span>${esc(x.date)}</span></div><h3 lang="bn">${esc(x.bn)}</h3><div class="en">${esc(x.en)}</div></a>`;
const xp=a=>a.map(x=>`<div class="xp"><div><h3>${esc(x.org)}</h3><div class="r">${esc(x.role)}</div></div><div class="per">${(x.periods||[]).map(p=>`<div>${esc(p)}</div>`).join('')}${x.status=='current'?'<div class="c">Current</div>':'<div>Former</div>'}</div></div>`).join('');
const toast=m=>{const t=$('#ts');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)};
const NAV=[['','Home'],['writing','Writing'],['experience','Experience'],['education','Education'],['about','About']];
const V={
home(){
 const w=H.name.split(' '),k=Math.ceil(w.length/2),l1=w.slice(0,k).join(' '),l2=w.slice(k).join(' ');
 const pp=new Set(W.map(x=>x.paper.trim()).filter(Boolean)).size;
 app.innerHTML=`<div class="w hero"><div class="dl"><span>${esc(H.place)}</span><time>${esc(today())}</time></div>
 <h1 aria-label="${esc(H.name)}"><span><i>${esc(l1)}</i></span>${l2?`<span><i>${esc(l2)}</i></span>`:''}</h1><p class="tag">${esc(H.tagline)}</p>
 <div class="hg"><figure class="ph"><img src="${esc(IM.profile)}" alt="${esc(H.name)}" onerror="this.closest('figure').remove()"><figcaption>${esc(H.caption)}</figcaption></figure>
 <div class="ht"><p class="roles">${esc((H.pills||[]).join(', '))}</p><p class="lead">${esc(H.bio)}</p>
 <ul class="cur">${(H.currently||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
 <p class="n">${S.articles.length} articles and ${S.reports.length} special reports in ${pp} newspapers.</p></div></div>
 <section class="sec"><div class="sh"><h2>Latest writing</h2><a class="more" href="#/writing">All ${W.length} pieces</a></div>${W.slice(0,5).map(row).join('')}</section></div>`},
writing(f){f=f=='a'||f=='r'?f:'all';let q='';
 const n={all:W.length,a:S.articles.length,r:S.reports.length};
 app.innerHTML=`<div class="w pg"><h2>Writing</h2><div class="tb">${[['all','All'],['a','Articles'],['r','Special reports']].map(([k,l])=>`<button data-f="${k}" aria-pressed="${k==f}">${l} (${n[k]})</button>`).join('')}</div>
 <input type="search" id="q" placeholder="Search by title or newspaper" aria-label="Search writing" autocomplete="off"><div class="cnt" id="wc"></div><div id="wl"></div></div>`;
 const fill=()=>{const l=W.filter(x=>(f=='all'||x.id[0]==f)&&`${x.bn} ${x.en} ${x.paper}`.toLowerCase().includes(q));$('#wl').innerHTML=l.map(row).join('')||'<p class="em">Nothing matches that search.</p>';$('#wc').textContent=l.length+(l.length==1?' piece':' pieces')};
 $('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();fill()};
 document.querySelectorAll('.tb button').forEach(b=>b.onclick=()=>{f=b.dataset.f;document.querySelectorAll('.tb button').forEach(x=>x.setAttribute('aria-pressed',x==b));fill()});fill()},
experience(){app.innerHTML=`<div class="w pg"><h2>Experience</h2><h3 class="sub">Journalism</h3>${xp(S.jobs)}<h3 class="sub">Organisations and clubs</h3>${xp(S.clubs)}</div>`},
education(){app.innerHTML=`<div class="w pg"><h2>Education</h2><div style="margin-top:22px">${S.edu.map(x=>`<div class="xp"><div><h3>${esc(x.degree)}</h3><div class="r">${esc(x.inst)}${x.note?'<br>'+esc(x.note):''}</div></div><div class="per"><div>${esc(x.period)}</div>${(x.badges||[]).map(b=>`<div>${esc(b)}</div>`).join('')}</div></div>`).join('')}</div></div>`},
about(){app.innerHTML=`<div class="w pg"><h2>About</h2><div class="hg" style="margin-top:10px"><figure class="ph"><img src="${esc(IM.about)}" alt="${esc(H.name)}" onerror="this.closest('figure').remove()"></figure><div class="ht"><div class="pr" style="margin-top:20px">${(A.bio||[]).map(p=>`<p>${esc(p)}</p>`).join('')}</div>
 <h2 style="margin-top:56px;font-size:28px">Contact</h2><dl class="ab">${(A.contacts||[]).map(c=>`<dt>${esc(c.label)}</dt><dd>${c.href?`<a href="${esc(c.href)}" ${/^http/.test(c.href)?'target="_blank" rel="noopener"':''}>${esc(c.text)}</a>`:esc(c.text)}</dd>`).join('')}</dl>
 <h2 style="margin-top:56px;font-size:28px">Interests</h2><p class="roles" style="margin-top:12px">${esc((A.skills||[]).join(', '))}</p></div></div></div>`}
};
const AL={articles:['writing','a'],reports:['writing','r'],job:['experience'],club:['experience']};
function route(){let[v,a]=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/');if(v=='w'&&a){location.replace('w/'+encodeURIComponent(a)+'.html');return}v=v||'home';if(AL[v])[v,a]=AL[v];if(!V[v])v='home';
 document.title=S.meta.title;V[v](a);if(v!='home')document.title=v[0].toUpperCase()+v.slice(1)+' | '+short;
 scrollTo(0,0);closeMenu();const cur=v=='home'?'':v;
 document.querySelectorAll('#hn a').forEach(x=>x.toggleAttribute('aria-current',x.getAttribute('href')=='#/'+cur))}
$('#lg').textContent=short;$('#hn').innerHTML=NAV.slice(1).map(([h,l])=>`<a href="#/${h}">${l}</a>`).join('');
$('#menu').innerHTML=`<div class="w"><div class="bar"><span class="logo">${esc(short)}</span><button id="mx" style="min-height:44px;padding:0 12px;font:500 15px var(--sans)">Close</button></div><nav>${NAV.map(([h,l])=>`<a href="#/${h}">${l}</a>`).join('')}</nav><div class="seg">${['system','light','dark'].map(m=>`<button data-m="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div><p>System follows your phone's setting.</p></div>`;
const mq=matchMedia('(prefers-color-scheme:dark)'),R=document.documentElement;
function apply(m){const d=m=='dark'||(m=='system'&&mq.matches);R.dataset.theme=d?'dark':'light';R.dataset.mode=m;$('#tc').content=d?'#121517':'#ECEEEB';document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m==m))}
function setTheme(m){try{localStorage.setItem('theme',m)}catch(e){}apply(m)}
(mq.addEventListener?mq.addEventListener.bind(mq,'change'):mq.addListener.bind(mq))(()=>{if(R.dataset.mode=='system')apply('system')});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setTheme(b.dataset.m));apply(R.dataset.mode||'system');
$('#tg').onclick=()=>setTheme(R.dataset.theme=='dark'?'light':'dark');
function closeMenu(){const m=$('#menu');if(m.hidden)return;m.hidden=true;document.body.style.overflow='';$('#mb').setAttribute('aria-expanded','false')}
$('#mb').onclick=()=>{$('#menu').hidden=false;document.body.style.overflow='hidden';$('#mb').setAttribute('aria-expanded','true');$('#menu nav a').focus()};
$('#mx').onclick=()=>{closeMenu();$('#mb').focus()};addEventListener('keydown',e=>{if(e.key=='Escape')closeMenu()});
$('#menu nav').onclick=e=>{if(e.target.closest('a'))setTimeout(closeMenu,0)};
$('#ft').innerHTML=`<span>&copy; ${new Date().getFullYear()} ${esc(H.name)}</span><nav>${(A.contacts||[]).filter(c=>/^https?:/.test(c.href)).map(c=>`<a href="${esc(c.href)}" target="_blank" rel="noopener">${esc(c.label)}</a>`).join('')}</nav>`;
const ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Person',name:H.name,url:S.meta.url,description:H.bio,sameAs:(A.contacts||[]).filter(c=>/^https?:/.test(c.href)).map(c=>c.href)}).replace(/</g,'\\u003c');document.head.append(ld);
addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
