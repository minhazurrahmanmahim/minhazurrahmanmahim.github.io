ভাইরাস বা ব্যাকটেরিয়ার আক্রমণ থেকে রক্ষার জন্য অ্যান্টিবডি বা স্মৃতি কোষ তৈরি হয়ে থাকে। এর ফলে টিকা প্রদানের মাধ্যমে নির্দিষ্ট রোগের ভাইরাস/ব্যাকটেরিয়া প্রবেশ করলে আগে থেকে তৈরি হওয়া অ্যান্টিবডি উক্ত ভাইরাস/ব্যাকটেরিয়াকে ধ্বংস করে দেয় এবং মানুষ সেই নির্দিষ্ট রোগ থেকে দ্রুততম সময়ের মধ্যে আক্রান্ত হওয়া থেকে রক্ষা পায়। অনেকক্ষেত্রেই এই অ্যান্টিবডি সারা জীবন নির্দিষ্ট রোগ প্রতিরোধে সক্ষম হয়। তবে বিজ্ঞানীরা একটি নির্দিষ্ট রোগ বা রোগের জীবাণু যখন মহামারীতে রূপান্তরিত হয় বা হওয়ার সম্ভাবনা থাকে এবং পরবর্তীতে এর জীবাণু শনাক্ত করার পর এর অ্যান্টিবডি তৈরিতে সক্ষম হোন। \n\nবিভিন্ন কমন ও অতি সম্ভাবনীয় রোগের টিকা শিশু জন্মানোর একটি নির্দিষ্ট সময় পর শিশুদের দেহে সাসপেনশন বা ইঞ্জেকশন আকারে প্রবেশ করানো হয়। এতে তারা সেইসব নির্দিষ্ট রোগ থেকে রক্ষা পায়। বাংলাদেশ সরকার ১০ টি রোগের টিকা বিনামূল্যে প্রদান করে থাকে। তবে অনেক গুরুতর রোগের টিকা এখন অব্দি বিনামূল্যে প্রদান করা উচিত হলেও সরকার সেসব টিকা বিনামূল্যে প্রদানের কোনো পদক্ষেপ এখন পর্যন্ত নেয় নি। তন্মধ্যে মেনিনজাইটিস, ইনফ্লুয়েঞ্জা, হেপাটাইটিস-এ, মাম্পস, ইত্যাদি অন্যতম। \n\nতবে টিকা নেওয়ার আগে আমাদের অবশ্যই ডাক্তারের পরামর্শ নিতে হবে এবং এর কার্যকারিতা ও পার্শ্বপ্রতিক্রিয়া সম্বন্ধে অবগত হতে হবে। তবে অধিকাংশ টিকার ক্ষেত্রেই খুব কম সময়েই পার্শ্বপ্রতিক্রিয়া দেখা যায় আর দেখা গেলেও কোনো গুরুত্বপূর্ণ পার্শ্বপ্রতিক্রিয়া দেখা যায় না। সাধারণত সাময়িক জ্বর, মাথা ব্যথা ও লালচে দাগ হয়ে থাকে। টিকার উদ্ভবের মাধ্যমে বৈশ্বিকভাবে মানুষ লাভবান হয়েছে। টিকার মাধ্যমে মানুষ নিজে ও নিজের পরিবার ও আশেপাশের মানুষরা বিভিন্ন রোগ হতে রক্ষা পাচ্ছে। অনেক টিকার কারণেই কিছু মারাত্মক রোগ পুরোপুরি ভাবে নির্মূল হয়েছে। তন্মধ্যে পোলিও, মিজলস অন্যতম। টিকা নেওয়ার মাধ্যমে আমাদের সামাজিক স্বাস্থ্য সুরক্ষা পাচ্ছে ও আমরা অর্থনৈতিকভাবেও লাভবান হচ্ছি। কারণ টিকার মাধ্যমে চিকিৎসা ব্যয় হ্রাস পাচ্ছে।\n\nতবে মানুষের স্বাস্থ্য সুরক্ষার পাশাপাশি আমাদের আশেপাশের গবাদি পশুর স্বাস্থ্য সুরক্ষায়ও টিকা প্রদান করা অত্যন্ত গুরুত্বপূর্ণ। গবাদি পশুগুলোকে রোগব্যাধি থেকে সুরক্ষায় রাখা ও গবাদি পশুদের থেকে যাতে মানুষের মধ্যে রোগ-জীবাণু না ছড়ায় সেই লক্ষ্যে গবাদি পশু-পাখিদের মধ্যেও টিকা প্রদান করে হয়ে থাকে। কুকুর-বিড়ালের রেবিস ও লিউকেমিয়া ভাইরাস, গবাদি পশুর খুরা রোগ, মুরগির বার্ড ফ্লু সহ আরো নানা ধরণের মারাত্মক রোগের জন্য পশু-পাখিদের টিকা প্রদান করা হয়ে থাকে। পশু পাখিদের টিকা দেওয়ার মাধ্যমে রোগ প্রতিরোধ, মানুষের সুরক্ষা, পশুপাখির উৎপাদন বৃদ্ধি সহ স্বাস্থ্যকর পরিবেশ নিশ্চিত করা সম্ভব। \n\nতাই টিকা নিয়ে বিভিন্ন প্রচলিত প্রোপাগান্ডা ও অসত্য ও ভিত্তিহীন তথ্যে বিশ্বাস স্থাপন না করে মানুষ ও পশুপাখির স্বাস্থ্য সুরক্ষায় নির্দিষ্ট সময়ে নির্দিষ্ট টিকা প্রদানের মাধ্যমে নিজেদের পরিবেশ, সমাজ ও রাষ্ট্রকে সুরক্ষিত রাখা সম্ভব। বিনামূল্যে প্রয়োজনীয় টিকা প্রদানের ব্যবস্থা আরো গতিশীল ও সুপরিকল্পনার মাধ্যমে করা, প্রকল্পের আওতায় থাকা টিকার প্রকল্প দ্রুত বাস্তবায়ন করা ও টিকা নিয়ে সচেতনতা বৃদ্ধি করার মাধ্যমে মানুষের স্বাস্থ্য সুরক্ষা বৃদ্ধি ও জীবনযাত্রার মানোন্নয়ন সম্ভব।","img":""},{"id":"a28","bn":"পাবলিক বিশ্ববিদ্যালয়ে শিক্ষকতা","en":"Teaching in Public Universities","paper":"Daily Karatoa","date":"04 November 2024","link":"https://ekaratoa.com/epaper/edition/1591/november/page/4","content":"আমাদের সমাজে পেশার দিক দিয়ে বিবেচনা করতে গেলে সবচেয়ে সম্মানজনক পেশা ধরা হয় শিক্ষকতাকে। তবে এই শিক্ষকতা পেশা, সবচেয়ে সম্মানজনক পেশা হলেও আমরা এই পেশাকেই আবার কয়েকটি অংশে বিভক্ত করে থাকি। প্রাথমিক স্কুল, মাধ্যমিক স্কুল, কলেজ, মাদরাসা ও বিশ্ববিদ্যালয়ে শিক্ষকতা। তন্মধ্যে পাবলিক বিশ্ববিদ্যালয়, প্রাইভেট বিশ্ববিদ্যালয়, জাতীয় বিশ্ববিদ্যালয় ও পাবলিক বিশ্ববিদ্যালয়ের অধিভুক্ত কলেজগুলোতে বিশ্ববিদ্যালয়ের শিক্ষকরা শিক্ষকতা করে থাকেন। জাতীয় বিশ্ববিদ্যালয় ও পাবলিক বিশ্ববিদ্যালয়ের অধিভুক্ত সরকারি কলেজ গুলোতে বিসিএসের মাধ্যমে শিক্ষক নিয়োগ হয়ে থাকে। কিন্তু প্রাইভেট ও পাবলিক বিশ্ববিদ্যালয়ে যোগ্যতার ভিত্তিতে শিক্ষক নিয়োগ হয়।\n\nপাবলিক বিশ্ববিদ্যালয়ের অত্যন্ত মেধাবী, পরিশ্রমী ও দক্ষ শিক্ষার্থীরাই পরবর্তীতে পাবলিক বিশ্ববিদ্যালয়ে শিক্ষকতা করে থাকেন। সাধারণত প্রথমে লেকচারার হিসেবে যোগ দিয়ে পরবর্তীতে ধীরে ধীরে সহকারি অধ্যাপক, সহযোগী অধ্যাপক এবং অধ্যাপক হিসেবে পদোন্নতি হয় শিক্ষকদের। তবে এই শিক্ষক নিয়োগের ক্ষেত্রে অনেক সময় অসাধু নিয়োগকর্তাদের কারণে অনেক অযোগ্যরা নিয়োগ পেয়ে থাকেন। পরবর্তীতে শিক্ষার মানে প্রভাব পড়ে তাদের জন্য।\n\nপাবলিক বিশ্ববিদ্যালয়গুলোতে যোগ্যতার ভিত্তিতে নিয়োগ না দিলে পরবর্তীতে শিক্ষকদের একাডেমিক দূর্বলতার কারণে  বিভিন্ন ধরণের প্রভাব পড়ে শিক্ষার্থীদের উপর। বিশ্ববিদ্যালয়ের অধিকাংশ বিভাগের কোর্সসমূহ ইংরেজিতে হয়ে থাকে কিন্তু খুব কম সংখ্যক শিক্ষকই ইংরেজিতে পাঠদান করে থাকেন এবং কথা বলে থাকেন। এছাড়াও অনভিজ্ঞতা ও কোর্সের সাথে শিক্ষকদের একাডেমিক ব্যাকগ্রাউন্ডের মিল না থাকায় বিভিন্ন সময় অনেক পড়াই তারা পড়াতে পারেন না, যার দরুণ শিক্ষার্থীদের অনলাইনের বিভিন্ন প্ল্যাটফর্মের উপর ভরসা করতে হয়। প্রতিনিয়ত একই নিয়মে পাঠদানের ফলে শিক্ষার্থীদের মধ্যে একগুয়েমি ভাব চলে আসে এবং পড়ার প্রতি তৈরি হয় অনীহা। এছাড়াও ঠিক করে ল্যাব না করানো ও শিক্ষার্থীদের মধ্যে গবেষণা সূলভ মনোভাব তৈরিতে ব্যর্থতাও শিক্ষকদের মধ্যে পরিলক্ষিত হয়। বর্তমানের আধুনিক বিশ্বে সকল শিক্ষকদের উচিত অনলাইন সকল শিক্ষা বিষয়ক প্ল্যাটফর্মে দক্ষ হওয়া। কিন্তু অধিকাংশ শিক্ষকদের মধ্যে এ বিষয়ে অদক্ষতা দেখা যায়, যার দরুণ ডিজিটাল লার্নিং সিস্টেম থেকে পিছিয়ে পড়ে শিক্ষার্থীরা। আন্তর্জাতিক মানের শিক্ষার্জনের ক্ষেত্রে অনলাইন প্ল্যাটফর্মে দক্ষ হওয়ার বিকল্প নেই। বিশ্ববিদ্যালয়ের অনেক শিক্ষকরাই বিভাগে শিক্ষকতার পাশাপাশি বিভিন্ন গুরুত্বপূর্ণ পদে থাকেন। সেসব পদে দায়িত্ব পালন ও ব্যস্ততার কারণে শিক্ষার্থীদের পাঠদানে ব্যাঘাত ঘটে। বিশ্ববিদ্যালয়ে শিক্ষকদের বেশিরভাগ ক্ষেত্রেই প্রতিনিয়ত তাদের মান যাচাইয়ের কোনো ব্যবস্থা থাকে না। যার কারণে তাদের অদক্ষতা ও কোনো ব্যাপারে না জানার পরেও নিজেদের আপডেট করা ও শিক্ষা অর্জন করা থেকে দূরে সরে যান অনেক শিক্ষক।\n\nশিক্ষকদের কিছু বড় সমস্যা হলো রাজনীতি করা, ব্যক্তিত্ব বিসর্জন দেওয়া ও শিক্ষার্থীদের ফলাফল দেওয়ার ক্ষেত্রে সমতা বজায় না রাখা। শিক্ষকদের রাজনীতির একটি বিরাট খারাপ প্রভাব শিক্ষার্থীদের উপর পড়ে থাকে। রাজনৈতিক কোন্দলের কারণে ঠিক করে ক্লাস না নেওয়া, সময়মতো পরীক্ষা না হওয়া, শিক্ষক-শিক্ষকে রেশারেশি, পদ নিয়ে কাড়াকাড়িসহ নানা ধরণের সমস্যা হয়ে থাকে। ব্যক্তিত্ব বিসর্জন বলতে শিক্ষকদের একটি বড় ধরণের খারাপ গুণকে বুঝানো হয়েছে। শিক্ষার্থীদের সাথে শিক্ষকসূলভ আচরণ না করে বন্ধুদের মতো আচরণ করা, তুই-তুকারি করা, গায়ে হাত তোলা, মেয়েদের উত্তক্ত করাসহ নানা ধরণের খারাপ ব্যবহার আমরা বিভিন্ন সময় সংবাদ মাধ্যমে পেয়ে থাকি। যা অবশ্যই তাদের ব্যক্তিত্ব বিসর্জনের বা ব্যক্তিত্ব নষ্ট করার মতো একটি বিষয়। শিক্ষার্থীদের একাডেমিক ফলাফলে সকলের ক্ষেত্রে সমতা না রাখা একটি কমন বিষয়ই বলা যায়। যেসব শিক্ষার্থীরা শিক্ষকদের অনুকূলে দাসত্ব করে থাকে এমনকি তাদের খারাপ বিষয়গুলোতেও সমর্থন করে থাকে তাদেরকে অতিরিক্ত নাম্বার দেওয়া বা তুলনামূলক ভালো ফলাফল দেওয়া শিক্ষকদের একটি অন্যতম খারাপ একটি দিক, যা পাবলিক বিশ্ববিদ্যালয়ের শিক্ষার্থীদের মাঝে একটি বলতে না পারা জানা বিষয়। \n\nগবেষণা খাতে ফান্ড না থাকা ও ল্যাবে যথাযথ ফ্যাসিলিটি না থাকার কারণে শিক্ষার্থীরা দক্ষ হয়ে শিক্ষা অর্জন করতে পারে না। এটি পাবলিক বিশ্ববিদ্যালয়ের একটি বড় সমস্যাগুলোর একটি। বিশ্ববিদ্যালয়ের শিক্ষার্থীদের পড়াশুনার পাশাপাশি গবেষণাও একটি গুরুত্বপূর্ণ জায়গা। এছাড়াও শিক্ষকদের অদক্ষতা ও অনীহার কারণে শিক্ষার্থীরা গবেষণায় ঠিক করে সময় দিতে পারে না, যার কারণে গবেষণার অগ্রগতি বাধাগ্রস্থ হয়। পাবলিক বিশ্ববিদ্যালয়ের শিক্ষকদের চাকরি সরকারি হওয়াতে শিক্ষকদের মধ্যে অনেক সময় গা ছাড়া ভাব থাকে, এবং অনেক শিক্ষকরাই নিজেদের ব্যক্তিগত বিভিন্ন চাহিদা হাসিলের উদ্দেশ্যে উঠে লেগে পড়েন। আবার অনেক ক্ষেত্রেই স্বল্প বেতনের কারণেও অনেক শিক্ষকদের পাঠদানে অনীহা কাজ করে থাকে। শিক্ষকদের সাথে শিক্ষার্থীদের সুসম্পর্ক বজায় না থাকা ও শিক্ষার্থীদের প্রতি অমনোযোগিতাও শিক্ষাজীবনে নানা প্রভাব ফেলে থাকে। \n\nপাবলিক বিশ্ববিদ্যালয়ে শিক্ষার মানোন্নয়নে অচিরেই সকল সমস্যা সমাধান করতে হবে। অযোগ্য ও অদক্ষদের শিক্ষকতা বাতিল করতে হবে, দক্ষ ও যোগ্য ব্যক্তিদের নিয়োগ প্রদান করতে হবে। নিয়োগের ক্ষেত্রে সকল দুর্নীতি, বৈষম্য ও সুদ-ঘুষ দিয়ে নিয়োগপ্রথা ভেঙ্গে দিতে হবে। শিক্ষকদের একাডেমিক ব্যাকগ্রাউন্ডের সাথে মিল রেখে তাদেরকে কোর্স নিতে হবে। প্রতিনিয়ত একই নিয়মে পাঠদান না করে পাঠদানে ভিন্নতা ও পরিবর্তন, পরিমার্জন ও হালনাগাদ বজায় রাখতে হবে। শিক্ষার্থীদের পাঠদান, ল্যাব ও গবেষণায় পারদর্শী করার জন্য আন্তর্জাতিক মান অনুসরণ করতে হবে। শিক্ষার্থীদের সকল ল্যাব সঠিকভাবে শিখাতে হবে যাতে ভবিষ্যতে তারা এর প্রয়োগ করতে পারে, এ নিয়ে গবেষণা করতে পারে। ল্যাব ফ্যাসিলিটি বৃদ্ধি, উন্নয়ন ও ফান্ড বৃদ্ধিতে সকল ধরণের পদক্ষেপ নিতে হবে এবং ল্যাব ফ্যাসিলিটি ও গবেষণা খাতে বরাদ্দ বাড়াতে হবে। অনলাইন সকল শিক্ষামূলক প্ল্যাটফর্মে শিক্ষকদের দক্ষ হতে হবে এবং গুরুত্বপূর্ণ অনলাইন প্ল্যাটফর্ম ব্যবহার করে শিক্ষার্থীদের দক্ষ করে তুলতে হবে। যেসব শিক্ষকরা পাঠদানের পাশাপাশি বিভিন্ন গুরুত্বপূর্ণ পদে দায়িত্ব পালন করে থাকেন সেগুলোর সময় নির্ধারিত করে দিতে হবে অথবা গুরুত্বপূর্ণ পদের দায়িত্বে থাকা শিক্ষকদের ক্লাস নেওয়া থেকে বিরত থাকতে হবে। শিক্ষকদের রাজনীতি পুরোপুরি ভাবে নিষিদ্ধ করতে হবে। যারা গোপনে রাজনীতি করবে তাদের বিরুদ্ধে ব্যবস্থা গ্রহণ করতে হবে।  শিক্ষকদের অসদাচরণ, খারাপ ব্যবহার, মেয়েদের উত্তক্ত করাসহ নিয়ম বহির্ভূত সকল খারাপ ও দোষমূলক কাজের ক্ষেত্রে শিক্ষকতা বাতিলের নিয়ম করতে হবে এবং প্রয়োজনে আইনানুগ ব্যবস্থা গ্রহণ করার নিয়ম করতে হবে। শিক্ষকরা সকল শিক্ষার্থীদের সমানভাবে মূল্যায়ন করছে কিনা এবং সকলকে তাদের প্রাপ্য ফলাফল দিচ্ছে কিনা সেভাবে কঠোর নজরাদারির ব্যবস্থা করতে হবে বিশ্ববিদ্যালয় প্রশাসনের। শিক্ষকরা প্রতিনিয়ত নিজেদের আপডেট করছে কিনা এবং শিক্ষার্থীদের সঠিকভাবে পাঠদান করছে কিনা, সকল কিছু মনিটর করার ব্যবস্থা করতে হবে এবং জবাবদিহিতার আওতায় আনতে হবে। শিক্ষকদের প্রয়োজনীয় বিষয় আমলে নিয়ে প্রশিক্ষণের ব্যবস্থা করতে হবে। শিক্ষকদের প্রাপ্য বেতন প্রদান ও প্রয়োজনীয় সুবিধাদি বিলম্ব না করে প্রদান করতে হবে এবং এ ব্যাপারে গড়িমসি করা যাবে না। শিক্ষকদের উপর সকল অন্যায়, অবিচার ও অসম্মানজনক সকল কাজের ক্ষেত্রে কঠোর ব্যবস্থা নিতে হবে এবং শিক্ষকদের সর্বদা সম্মানের সহিত ব্যবহার প্রদর্শণ করতে হবে।\n\nশিক্ষকরা জাতির মেরুদন্ড গড়ার কারিগর। সেই শিক্ষকদের মাঝেই যদি সমস্যা থাকে, এমনকি উচ্চ শিক্ষা পাঠদানের ক্ষেত্রে। তাহলে জাতির জন্য তা অবশ্যই ক্ষতির কারণ হবে। যা পরবর্তীতে প্রভাব ফেলবে পুরো ভবিষ্যত প্রজন্মের উপর এবং বিঘ্নিত হবে শিক্ষার মান ও দেশের উন্নয়ন। তাই শিক্ষার্থীদের সঠিক শিক্ষায় গড়ে তোলার জন্য শিক্ষকদের শিক্ষাদানের উপর অধিকাংশ বিষয় নির্ভর করে। তাই এ বিষয়ে আমাদের কড়া নজরদারি করতে হবে, বিশ্ববিদ্যালয় প্রশাসনের শিক্ষক নিয়োগ ও পরিচালনার ব্যাপারে কঠোর হতে হবে। এবং যোগ্য ব্যক্তিদের যোগ্য জায়গায় বসিয়ে জাতি ও দেশের উন্নয়নে নিজেদের ঐক্যবদ্ধ রাখতে হবে।","img":""},{"id":"a27","bn":"পশ্চাদপদ মানসিকতা পরিহার করুন","en":"Avoid a Backward Mentality","paper":"Daily Jai Jai Din","date":"26 October 2024","link":"https://epaper.jaijaidinbd.com/?date=2024-10-26&page=6&news=06_102","content":"কোনো ব্যক্তির চিন্তা-ভাবনা, মতাদর্শ, বিশ্বাস স্থাপনের জায়গা অনুযায়ী তার আচার-ব্যবহার ও  সিদ্ধান্ত নেওয়ার মাধ্যমে তার মানসিকতা প্রকাশ পায়। সমাজে প্রতিটি মানুষের ভিন্ন ভিন্ন মতাদর্শ থাকে বা থাকতে পারে। তবে সমাজের মানুষের অনেক মতই রয়েছে যা তারা আবশ্যকভাবে মেনে থাকে বা সকলে মিলে একই মতাদর্শ অনুসরণ করে থাকে। ঐ সকল মতাদর্শগুলোকে সর্বজনীন গ্রহণযোগ্য মতাদর্শ বলে। আমাদের সমাজে এমন অনেক মতাদর্শের মানুষ রয়েছে যারা সকলে মিলে একটি সার্বজনীন গ্রহণযোগ্য মতাদর্শ মেনে চলে। নির্দিষ্ট মতাদর্শের মানুষদের ভিন্ন করার জন্য আমরা জেনারেশনও বিভক্ত করে থাকি। একেক জেনারেশনের মানুষ একেকটি নির্দিষ্ট মতাদর্শ মেনে চলে এবং তার আশেপাশের মানুষদেরও তা মেনে চলার জন্য নির্দেশ বা অনুরোধ করে থাকে। মতাদর্শ বা মানসিকতা নির্দিষ্ট করে মেনে চলা এবং নতুন মতাদর্শ গ্রহণে দ্বিধা প্রকাশ করা ব্যক্তিদের পশ্চাদপদ মানসিকতার মানুষ বলা হয়। পশ্চাদপদ মানসিকতা সাধারণত পুরনো প্রজন্মের মানুষদের মধ্যে বেশি দেখা যায়। আমাদের দেশের ২০০০ সালের আগের মানুষদের মধ্যে শিক্ষা গ্রহণের হার, কুসংস্কার, ধর্মান্ধতা অত্যন্ত বেশিই দেখা যায় এবং যেতো। যার কারণে তাদের মধ্যেই পশ্চাদপদ মানসিকতা বেশি দেখা যায়। তারা পুরনো কুসংস্কার, ধর্মান্ধতা, নিয়ম-কানুন, রীতি-নীতি মেনে চলে এবং নতুন কোনো মতামত বা নিয়ম সর্বজনীন গ্রহণযোগ্য এবং সত্য ও সঠিক হলেও তা মানতে অস্বীকৃতি জানায় এবং তাদের অধীনস্থ সকলকে এ দ্বারা প্রভাবিত করার চেষ্টা করে। সঠিক শিক্ষাগ্রহণ থেকে বঞ্চিত হওয়া, পরিবার ও পরিবেশগত প্রভাব ও মূল্যবোধের কারণে তারা পশ্চাদপদ মানসিকতার হয়ে থাকে এবং এই মানসিকতা দ্বারা সকলের উপর প্রভাব খাটানোর চেষ্টা করে থাকে। পুরনো প্রজন্মের পশ্চাদপদ মানসিকতার মানুষদের মধ্যে যেসব বৈশিষ্ট্য দেখা যায় তার মধ্যে নতুন মতবাদ গ্রহণে অনিচ্ছা, শিক্ষার অভাব, বাল্যবিবাহ, যৌতুক প্রথা, নারীদের প্রতি বৈষম্য, অন্ধবিশ্বাস, কুসংস্কার, ধর্মান্ধতা এমনকি সাম্প্রদায়িকতাও দেখা যায়। \n\n২০০০ সালের আগের মানুষদের মধ্যে পুরাতন মতবাদ বিরাজমান। শিক্ষাক্ষেত্রে পরিবর্তন, বিজ্ঞানের নতুনত্ব, আধুনিকতার ছোঁয়ায় আধুনিক চিন্তাধারা গ্রহণে তারা অনীহা প্রকাশ করে এবং ঐতিহ্যগত রীতি-নীতির উপর জীবন পরিচালনা করতে চায়। \n\nআমাদের দেশে ২০০০ সালের আগে শিক্ষার হারও তুলনামূলক অনেক কম ছিল বলা যায়। শিক্ষার হার কম থাকার কারণেও অনেকে এই পশ্চাদপদ মানসিকতার হয়ে থাকে।\n\nপশ্চাদপদ মানসিকতার আরেকটি চরম বৈশিষ্ট্য হলো বাল্যবিবাহ। এখনো গ্রামাঞ্চলগুলোতে অহরহ বাল্যবিবাহ হয়ে থাকে। পশ্চাদপদ মানসিকতা থেকে যতদিন সরে না আসবে ততদিন এই ব্যাধী চলতেই থাকবে।\n\nযৌতুক প্রথা এই মানসিকতার মানুষদের মধ্যে একটি কমন বৈশিষ্ট্য। যৌতুকের জন্য এখনো অনেক বিয়ে ভেঙে যায়, পারিবারিক কলহ এবং সংসারে অশান্তি চলতে থাকে।\n\nনারীদের সকল সুযোগ সুবিধা সমানভাবে না দেওয়া এই মানসিকতার মানুষদের আরেকটি খারাপ বৈশিষ্ট্য। শিক্ষা ও কর্মক্ষেত্রে তাদেরকে পুরুষদের থেকে কম সুবিধা দেওয়া এবং মাধ্যমিক পর্যন্ত পড়াশুনা করানো এবং চাকরি না করার জন্য পরিবার থেকে বাধা দেওয়ার মাধ্যমে নারীদের প্রতি বৈষম্য করাও এই মানসিকতার মানুষদের বৈশিষ্ট্য। \n\nএই মানসিকতার মানুষ প্রচুর অন্ধবিশ্বাস করে থাকে এবং কুসংস্কার মেনে থাকে। কোনো কিছুর ভিত্তি না থাকলেও ঐতিহ্য মেনে চলা ও সামাজিক নিয়মের সাথে গা ভাসিয়ে অন্ধবিশ্বাস করে এবং কুসংস্কার ও কু-রীতি নীতি মেনে থাকে। \n\nধর্মান্ধতা পশ্চাদপদ মানসিকতার মানুষদের মধ্যে প্রচুর দেখা যায়। যেহেতু এই মানসিকতার মানুষরা শিক্ষাগ্রহণ থেকে পিছিয়ে থাকে তাই পুরনো রীতি অনুযায়ী ধর্মীয় আবেগ বেশি থাকে এবং ধর্মান্ধতার কারণে মাজার পূজাসহ নানা ধরণের কু-ধর্মীয় রীতি নীতি পালন করে থাকে।\n\nসাম্প্রদায়িকতার মাধ্যমে সমাজে একে অপরের প্রতি বিবেধ, কলহ ও দাঙ্গা লাগানো এই মানসিকতার মানুষদের একটি চরম খারাপ বৈশিষ্ট্য। এক ধর্মের মানুষের অন্য ধর্মের মানুষদের সাথে না চলা, অন্য ধর্মকে অবজ্ঞা করা ও ক্ষতি করার মাধ্যমে সাম্প্রদায়িক সম্প্রীতি নষ্ট করে থাকে এই মানসিকতার মানুষরা। \n\n\nপশ্চাদপদ মানসিকতার এসব বৈশিষ্ট্যের কারণে সমাজে নানা ধরণের প্রভাব পড়ে থাকে। \n\nসাধারণত তাদের এসব বৈশিষ্ট্যের কারণে তাদের অধীনস্থ অনেকেই প্রভাবিত হয়ে থাকেন এবং তাদের সন্তান-সন্ততিরা এর কারণে উচ্চ শিক্ষা থেকে বঞ্চিত হয়।\n\nনারীদের সাথে বৈষম্য করার কারণে নারীরা পিছিয়ে পড়ে এবং সমাজের অনেক সুযোগ সুবিধা থেকে বঞ্চিত হয় এবং তাদের বেড়ে উঠায় বাধা সৃষ্টি হয়। \n\nযেহেতু তারা নতুন মতবাদ গ্রহণে অনীহা প্রকাশ করে, তাই তাদের জন্য অনেক সামাজিক ও অর্থনৈতিক কাজে বাধা সৃষ্টি হয় এবং সমাজ ও রাষ্ট্রের উন্নয়নে ব্যাঘাত ঘটে থাকে। \n\nযৌতুক প্রথার কারণে বিবাহ-বিচ্ছেদ ঘটে এবং সাংসারিক কলহ তৈরি হয়। এছাড়াও বাল্যবিহের কারণে অনেক মায়ের মৃত্যু, অল্প বয়সে গর্ভধারণ ও শিশুর বৃদ্ধিতে বাধা সৃষ্টি হয় এবং শিশুরা অপুষ্টিতে ভুগে থাকে। \n\nঅন্ধবিশ্বাস, ধর্মান্ধতা ও কুসংস্কার মেনে চলার কারণে সমাজে অস্থিতিশীল অবস্থা বিরাজমান থাকে। আধুনিকায়ন থেকে মানুষ দূরে সরে যায় এবং নিজেদের ও আশেপাশের মানুষের ক্ষতিসাধন করে থাকে। \n\nআধুনিক চিকিৎসা থেকেও এই মানসিকতার মানুষরা দূরে থাকে যার কারণে জনস্বাস্থ্য হুমকির মুখে পড়ার সম্ভাবনা থাকে। যা পরবর্তীতে দীর্ঘমেয়াদী সমস্যাও হতে পারে।\n\nসাম্প্রদায়িক সম্প্রীতি নষ্ট ও সমাজে দাঙ্গা লাগানোর জন্য তারা প্রচন্ডভাবে দায়ী এবং তাদের এ কাজের কারণে সমাজের মানুষদের মধ্যে মেলবন্ধন ও যোগাযোগে বাধা সৃষ্টি হয়ে থাকে। \n\n\nপশ্চাদপদ মানসিকতা পরিহারের জন্য সমাজে শিক্ষার হার বৃদ্ধি করতে হবে। সার্বজনীন ও বিজ্ঞানসম্মত জ্ঞান আরোহনের মাধ্যমে পশ্চাদপদ মানসিকতা পরিহার করা সম্ভব।\n\nনারীদের যথাযোগ্য সম্মান করতে হবে। যৌতুক প্রথা বিলুপ্ত করতে হবে এবং বাল্যবিবাহের বিরুদ্ধে সোচ্চার হতে হবে। নারীদের যেসব বিষয়ে ক্ষমতায়ন না করার মাধ্যমে সমাজের উন্নয়ন বাধাগ্রস্থ হয় সেসব ক্ষেত্রে নারীর ক্ষমতায়ন বৃদ্ধি করতে হবে। \n\nআধুনিক প্রযুক্তি ও চিকিৎসা গ্রহণের মাধ্যমে এবং পুরাতন রীতি নীতি পরিহারের মাধ্যমে এই মানসিকতা থেকে উঠে আসা সম্ভব এবং এর মাধ্যমে জনস্বাস্থ্যের জন্য উপকার ও জনগণের জীবন যাত্রার মান বৃদ্ধি পাবে। \n\nসাম্প্রদায়িকতা থেকে সরে এসে সকল ধর্ম ও বর্ণের মানুষ একত্রে মিলে বসবাস করতে হবে। একে অপরের বিপদে এগিয়ে আসতে হবে। কারো প্রতি বৈষম্য না করে সকলের সাথে একত্রে মিলে জীবনযাপন করতে হবে।\n\nসবশেষে, সামাজিক ও রাষ্ট্রীয়ভাবে সচেতনতা বৃদ্ধির মাধ্যমে এই মানসিকতা থেকে সরে আসা সম্ভব এবং যারা এই মানসিকতার তাদের মধ্যে পরিবর্তন আনা সম্ভব। বাল্যবিবাহ, যৌতুক প্রথা ও অন্যান্য অপরাধের কারণে দ্রুততম সময়ে আইন ভঙ্গকারীদের আইনের আওতায় আনা এবং কঠোর শাস্তি দ্রুততম সময়ের মাধ্যমে নিশ্চিত করে এই ধরণের মানসিকতা পরিহার করা সম্ভব।","img":""},{"id":"a26","bn":"বিশ্ববিদ্যালয়ে সিনিয়র-জুনিয়র সম্পর্ক যেমন হওয়া উচিত","en":"How Senior-Junior Relationships Should Be in University","paper":"Daily Share Biz","date":"03 July 2024","link":"https://www.facebook.com/mdminhazur44rahman/posts/pfbid023dUTvaKKag7yJfTkgJ1TdyiqjosWU6nbJQMRuh9LPBJmo8ECUzvcfxtVTYBSa2qXl","content":"প্রতিটি বিশ্ববিদ্যালয়ের শৃঙ্খলা, ভাতৃত্ব ও নিয়মানুবর্তীতা বজায় রাখার জন্য সিনিয়র জুনিয়র সম্পর্ক সুন্দর ও সুগঠিত হওয়া উচিত। সিনিয়র জুনিয়র সম্পর্ক মূলত গড়ে উঠে স্থিতিশীলতা, সহযোগিতামূলক এবং পারস্পরিক সম্মানের উপর ভিত্তি করে। পড়াশোনার জন্য মানুষ স্কুল, কলেজ জীবন শেষে বিশ্ববিদ্যালয় জীবনে পদার্পণ করে। স্কুল ও কলেজ জীবনে সিনিয়র জুনিয়র সম্পর্ক বিশেষ নিয়মের মধ্যে দিয়ে পার না করলেও বিশ্ববিদ্যালয় জীবনে বিশেষ নিয়মের ভিতর দিয়েই সিনিয়র জুনিয়র সম্পর্ক তৈরি করতে হয়। জ্ঞান ও অভিজ্ঞতা ভাগাভাগি করা, সমস্যা সমাধান সহ অন্যান্য কাজ একইসাথে করা, নিয়মিত যোগাযোগ রাখা, পরস্পরকে সম্মান, শ্রদ্ধা ও সহানুভূতিশীল আচরণ করা, বৈষম্য না করা, শারীরিক ও মানসিক অসুস্থতায় পাশে থাকা, ভয়-ভীতি না পাওয়া সহ ইত্যাদি মাধ্যমে সিনিয়র-জুনিয়র সম্পর্ক তৈরি হয় ও দৃঢ় হয়। পরিবারে থাকাকালীন যেমন বাবা মা ছাড়া এবং বাবা মায়ের দেখাশোনা ও সাহায্য ছাড়া চলা যায় না তেমনি বিশ্ববিদ্যালয়ে থাকাকালীন সিনিয়রদের ছাড়া এবং সিনিয়রদের দিকনির্দেশনা ও সাহায্য ছাড়া চলা যায় না। তবে বাংলাদেশসহ দক্ষিণ এশিয়ার অধিকাংশ পাবলিক বিশ্ববিদ্যালয়ে সিনিয়র জুনিয়র সম্পর্ক নিয়ে রয়েছে নানা অপসংস্কৃতি। পাবলিক বিশ্ববিদ্যালয়গুলোতে প্রতি নিয়ত জুনিয়রদের সাথে সিনিয়রদের নানা অসৌজন্যমূলক আচরণ, র‍্যাগিং, শারীরিক ও মানসিক নির্যাতনের ঘটনা ঘটে থাকে এবং এ নিয়ে সংবাদ মাধ্যমে অনেক সংবাদ প্রকাশিত হতে দেখা যায়। বাংলাদেশের পাবলিক বিশ্ববিদ্যালয়গুলোর মধ্যে ঢাবি, জাবি, ইবি, জবি, হাবিপ্রবি, যবিপ্রবি সহ অধিকাংশ বিশ্ববিদ্যালয়ে প্রতি বছর অসংখ্য শিক্ষার্থী র‍্যাগিং এর জন্য বহিষ্কার হয়ে থাকে।\n\nর‍্যাগিং একটি অপসংস্কৃতি। বিশ্ববিদ্যালয় জীবন শুরু হওয়ার পর সিনিয়রদের দ্বারা নানা ধরণের শারীরিক ও মানসিক নির্যাতনের স্বীকার হওয়াকে র‍্যাগিং বলে। ম্যানার শিখানোর নামে শিক্ষার্থীদের জোর করে গান গাইতে বলা, নাচানো, মানসিক প্রেশার দেওয়া, জুনিয়র হওয়াতে বৈষম্য করা, নির্দিষ্ট বাধ্যবাধকতা অনুযায়ী চলতে বাধ্য করা, ইত্যাদি র‍্যাগিং এর অংশ। এসব অপসংস্কৃতির কারণে সিনিয়র-জুনিয়র সম্পর্ক নষ্ট হয়। মূলত পরবর্তী জুনিয়র না আসা অব্দি এই ধরণের নিয়ম চলমান থাকে এবং ক্রমান্বয়ে এই নিয়ম চলে আসে, যেটিকে 'চেইন অফ কমান্ড' বলে আখ্যা দেওয়া হয়। র‍্যাগিং এর কারণে অসংখ্য শিক্ষার্থী ঝড়ে পড়ে, মানসিক ও শারীরিকভাবে ক্ষতিগ্রস্থ হয়। বুলিং ও র‍্যাগিং প্রতিরোধ সংক্রান্ত নীতিমালা-২০২৩ অনুযায়ী কোনো শিক্ষার্থীর বিরুদ্ধে র‍্যাগিং এর প্রমাণ পাওয়া গেলে তার বিরুদ্ধে ফৌজদারি আইনে ব্যবস্থা নিতে বলা হয়েছে। তবে বেশিরভাগ বিশ্ববিদ্যালয়ে র‍্যাগিং এর প্রমাণ পাওয়া গেলে সাময়িক ও স্থায়ী বহিষ্কার করা হয়। \n\nবিশ্ববিদ্যালয় জীবনে যারা নিজ পরিবার থেকে দূরে বসবাস করে তাদের সকলের প্রয়োজনে সিনিয়ররা ছাড়া আর কেউই তেমন কাজে আসে না বলা যায়। যেকোনো প্রয়োজনে সিনিয়রদেরই দরকার হয়। তাই বিশ্ববিদ্যালয় জীবনে সিনিয়র-জুনিয়র সম্পর্ক ভালো থাকা অত্যন্ত গুরুত্বপূর্ণ একটি বিষয়। সিনিয়র-জুনিয়র ভালো সম্পর্ক রাখার জন্য জুনিয়রদের উচিত সিনিয়রদের প্রাপ্য সম্মান প্রদর্শন করা, যেসব সিনিয়ররা সহজে মিশে তাদের সাথে ভালো সম্পর্ক বজায় রাখা, সিনিয়রদের কাছ থেকে কিছু শিখার ক্ষেত্রে সংকোচ না রাখা, যেকোনো সমস্যায় সিনিয়রদের জানানো, নিয়মিত তাদের সাথে যোগাযোগ রাখা, অসৌজন্যমূলক আচরণ না করা, কোনো সিনিয়র খারাপ ব্যবহার করলে তার সিনিয়রকে অবগত করা এবং তার সাথে বেয়াদবি না করা এবং সিনিয়রদের উচিত জুনিয়র থাকাকালীন যে ধরণের সমস্যার সম্মুখীন হয়েছে তা জুনিয়রদের জানানো, জুনিয়ররা কোনো সমস্যায় পড়লে তা সমাধানে সর্বোচ্চ চেষ্টা করা, জুনিয়রদের প্রতি সহানুভুতিশীল হওয়া, অভিজ্ঞতা ভাগাভাগি করতে সংকোচ না করা। সর্বোপরি, র‍্যাগিং মুক্ত, সম্মান ও সহযোগিতামূলক, বৈষম্যহীন সম্পর্কই হতে পারে সিনিয়র ও জুনিয়রদের মধ্যে সবচেয়ে সর্বোত্তম সম্পর্কের উপায়।\n\nএকটি সুন্দর বিশ্ববিদ্যালয় জীবন ও বিশ্ববিদ্যালয়ের পরিবেশ সুন্দর রাখতে সিনিয়র-জুনিয়র সম্পর্ক একটি বিশেষ গুরুত্ব বহন করে। বিশ্ববিদ্যালয় কর্তৃপক্ষের উচিত সিনিয়র-জুনিয়র মেন্টরিং প্রোগ্রাম তৈরি করা, যেকোনো সমস্যা দ্রুত সমাধান করা, সম্মান ও সহযোগিতার সংস্কৃতি বৃদ্ধির জন্য কর্মশালা ও অনুষ্ঠান আয়োজন করা। একত্রে চলা ব্যতীত বেড়ে উঠা ও সাফল্য অর্জন করা সম্ভব নয়। তাই সকলেরই উচিত বিষয়টি মাথায় রেখে সহানুভূতিশীল ও পারস্পরিক সম্মান বজায় রেখে চলা। এতে সুন্দর থাকবে বিশ্ববিদ্যালয়ের পরিবেশ, উপকৃত হবে সকল শিক্ষার্থীরা।","img":""},{"id":"a25","bn":"বন্ধু নির্বাচনে হতে হবে সতর্ক","en":"Be Careful in Choosing Friends","paper":"Daily Jai Jai Din","date":"30 June 2024","link":"https://www.facebook.com/mdminhazur44rahman/posts/pfbid035FW93rF7USQHfgPxC5p3fmAutrEDCg4SwCa8QRfJprQkqoG8nK6NDHjLPgD9uhJ4l","content":"মানুষ তার জীবনের সবচেয়ে সুন্দর থেকে উত্তম সময় গুলো পরিবারের পর বন্ধুদের সাথেই কাটিয়ে থাকে। বন্ধুরা হয় বিপদের সাথী, কষ্টের স্বস্তি, দুঃসময়ের সান্ত্বনা এবং আপন না হওয়া সত্ত্বেও আপন কেউ। জন্মের পর থেকে মৃত্যুর আগ পর্যন্ত বন্ধুত্বসুলভ মানুষের কাছেই আমরা আমাদের সবকিছু ভাগাভাগি করে থাকি এবং তাদের সাথেই জীবনযাপন করে থাকি। পরিবারের সদস্যদের সাথেও আমাদের থাকতে হবে বন্ধুত্বসুলভ সম্পর্ক নয়তো আমরা তাদের সাথেও নিজেদের সবটুকু দিয়ে বেঁচে থাকতে পারবো না। তাই বন্ধুত্ব জিনিসটা পরিবার থেকেই শুরু হয়।\n\nতবে একজন মানুষের প্রাতিষ্ঠানিক পড়াশুনা থেকে শুরু হয় পরিবারের মানুষের বাহিরে গিয়ে অপরিচিত কাউকে বন্ধু বানানো। তাছাড়া নিজেদের আত্মীয়, পাড়া-প্রতিবেশীদের মধ্যেও বন্ধু এবং বন্ধুত্বসুলভ সম্পর্কের মানুষ থাকে। একজন মানুষ কোন পথে পরিচালিত হবে তার অনেকটাই নির্ভর করে বন্ধু নির্বাচনের উপর। একটি প্রচলিত কথা রয়েছে যে, সঙ্গ দোষে, লোহা ভাসে। তাই জীবনের গতির সাথে সঙ্গের সম্পর্ক বিদ্যমান। একজন বন্ধুই পারে একজন মানুষকে বেঠিক পথ থেকে সঠিক এবং সঠিক পথ থেকে বেঠিক পথে নিয়ে যেতে। বন্ধুদের মাধ্যমেই আমরা পরিবারের বাহিরে গিয়ে অন্যান্য জ্ঞান আহরণ করে থাকি। বন্ধুদের সাহায্যের মাধ্যমেই কষ্ট থেকে স্বস্তিতে এবং বিষন্নতা থেকে ফিরে আসা যায়। আবার কখনো বন্ধুরাই হয় বিষন্নতার কারণ। তাই বন্ধু নির্বাচনে হতে হবে সতর্ক।\n\nএকজন ভালো বন্ধু পারে একজন বিষন্নতায় আটকে থাকা বন্ধুকে বিষন্নতা থেকে ফিরিয়ে আনতে। বন্ধুরা পারে তার মনের না বলতে পারা কথা গুলো শুনে তার চাহিদা অনুযায়ী কাজ করার অনুপ্রেরণা যোগাতে। একজন ভালো বন্ধু পারে পড়াশোনায় আটকে গেলে তাকে সাহায্য করতে। বিপথে গেলে একজন ভালো বন্ধুই একজন ব্যক্তিকে সঠিক পথে নিয়ে আসতে পারে। যে কষ্ট আর কথা গুলো পরিবারের মানুষকে বলা যায় না সেগুলো বন্ধুরাই পারে শুনতে এবং সমাধান করতে। একাকিত্বে ডুবে যাওয়ার সময় একজন বন্ধুই পারে তাকে প্রফুল্লতা ফিরিয়ে দিতে। বিপদের সময় কেউ পাশে না থাকলেও বিশ্বস্ত বন্ধুরাই থাকে পাশে, করে সাহায্য। ব্যর্থতায় একজন বন্ধুই যোগাতে পারে সাহস আর অনুপ্রেরণা। বন্ধুদের অনুপ্রেরণার মাধ্যমে যেকোনো কঠিন ও অসম্ভব কাজ করা যায় সহজেই। পড়াশোনায় খারাপ এবং যেকোনো অদক্ষ ব্যক্তি বন্ধুদের মাধ্যমেই হতে পারে দক্ষ, যোগ্য এবং পড়াশোনায় উত্তম। যে কাজ একা করা যায় না, সে কাজ গুলো বন্ধুদের সাহায্যেই সম্পন্ন করা সম্ভব হয়। বন্ধুরা বৃদ্ধ বয়সে ভর দিয়ে হাঁটা লাঠির মতো পাশে থাকে শেষ সময় অব্দি। ভালো বন্ধুরা সর্বোচ্চ খারাপ সময়েও পাশ কাটিয়ে যায় না, একা করে রাখে না। \n\nএদিকে একজন মানুষের জীবন ধ্বংস হতে পারে ভুল বন্ধু বাছাইয়ের কারণে। খারাপ সঙ্গের কারণে একজন ভালো গুণ সম্পন্ন ব্যক্তিও খারাপ পথে যেতে সময় নেয় না। বেশিরভাগ মানুষ খারাপ বা ভুল বন্ধু নির্বাচনের মাধ্যমেই খারাপ বা ভুল পথে যাওয়ার জন্য প্রথম পা দেয়। মূলত নেশায় আসক্ত হওয়া, পড়াশোনা থেকে ছিটকে যাওয়া, কিশোর অপরাধে যুক্ত হওয়া, খুন-খারাবি, চুরি, ছিনতাই, দুর্নীতি সহ সকল খারাপ কাজেই মানুষ বন্ধুদের মাধ্যমেই প্রথমে করার উৎসাহ, সাহস এবং উপায় খুঁজে পায়। অনেক সময়, ছেলেরা মেয়ে বন্ধুদের সাথে বন্ধুত্ব করার মাধ্যমেও বিপথে চলে যায়। প্রথমত ছেলে-মেয়ে বন্ধু হওয়ার পর একজন ছেলে বা একজন মেয়ে যখন একজন মেয়েকে বা ছেলেকে পছন্দ করে বসে তখন তাদের মধ্যে সমস্যার সৃষ্টি হয় এবং শেষ পর্যন্ত বন্ধুত্ব নষ্ট হওয়ার পর শুরু হয় বিষন্নতা। তাই ছেলে-মেয়ে বন্ধু হওয়ার ক্ষেত্রে হতে হবে সতর্ক। এছাড়াও বন্ধু নির্বাচনের ক্ষেত্রে সর্বদা উপকারী, সৎ, ন্যায়পরায়ণ, ধার্মিক, নিষ্ঠাবান এবং দক্ষ ব্যক্তিকেই বন্ধু করা উচিত। কখনোই নেশায় আসক্ত, পড়াশোনায় খারাপ, গীবতকারী, অসৎ ব্যক্তিরা ভালো বন্ধু হওয়ার যোগ্য নয়। তাই তাদের থেকে দূরত্ব বজায় রাখতে হবে।\n\nবন্ধুরাই পারে বিশ্ব জয়ে সহযোগিতা করে এগিয়ে নিতে, বন্ধুরাই পারে জয়ের জন্য সর্বশেষ পদক্ষেপে গিয়ে বিফল করে দিতে। বন্ধুরাই পারে বিষন্নতা থেকে ফিরিয়ে আনতে আবার সুস্থ মানুষকে বিষন্ন করে দিতে। তাই জীবনের গতি সঠিক রাখতে, জীবন সুন্দর করতে, সফলতার উচ্চ শিখরে পৌঁছাতে, সঠিক-ভুল নির্বাচন করতে বন্ধু নির্বাচন অত্যন্ত গুরুত্বপূর্ণ একটি বিষয়। ভালো থাকা হোক সকল বন্ধুরা মিলে।","img":""},{"id":"a24","bn":"ইদ হলো ঐক্যের, ইদ হলো ভাতৃত্বের","en":"Eid is Unity, Eid is Brotherhood","paper":"Daily Khola Kagoj","date":"09 April 2024","link":"https://www.facebook.com/photo.php?fbid=2070562339986060&set=pb.100010969419262.-2207520000&type=3","content":"মুসলিমদের নিজেদের মধ্যে বন্ধন, ভাতৃত্ববোধ ও ঐক্যবদ্ধতা বৃদ্ধি ও একত্রিত হয়ে আনন্দ উদযাপনের জন্য প্রতি বছর দুইবার দুইটি ইদ উদযাপন করে থাকে। একটি হলো ইদ-উল-ফিতর এবং আরেকটি ইদ-উল-আযহা। তন্মধ্যে ২০২৪ এ ইদ-উল-ফিতর উদযাপন করা হবে আগামী ১০ অথবা ১১ ই এপ্রিল। ইদ-উল-ফিতর উপলক্ষে প্রতি বছর মুসলিমদের থাকে অসংখ্য আয়োজন। চাঁদ দেখার উপর নির্ভর করে বিশ্বব্যাপী মুসলিমরা ইদ-উল-ফিতর উদযাপন করে থাকে। প্রতি বছর মুসলিমদের ইদ-উল-ফিতরের আমেজ শুরু হয় রোযা রাখার মাধ্যমে। রমযান মাস ব্যাপী চাঁদ দেখার উপর নির্ভর করে মুসলিমরা প্রতি বছর ২৯ থেকে ৩০ টি রোযা রেখে থাকে। রোযা রাখার মাধ্যমে সংযম করে তারা মহান সৃষ্টিকর্তা, আল্লাহর প্রিয় বান্দা হওয়ার সর্বোচ্চ চেষ্টা করে থাকে। রমযান মাস মুসলিমদের শিক্ষা দেয়, কিভাবে সকল পাপ কাজ থেকে নিজেদের বিরত রাখা যায়, আল্লাহর এবাদত করার প্রতি মনোযোগ ও আকর্ষণ বৃদ্ধি করা যায়, গরিব, দুঃখী ও অসহায়দের না খেয়ে থাকার যন্ত্রণা অনুভব করা যায়, ইত্যাদি। রোযার মাসকে গুণাহ মাফের মাসও বলা হয়ে থাকে। রাসুলুল্লাহ (সাঃ) বলেছেন, যে রমযান মাস পেয়েছে কিন্তু নিজের গুনাহ মাফ করাতে পারে নি সে ধ্বংস হোক (আল আদাবুল মুফরাদ : ৬৪৬; সহিহ ইবনে হিব্বান : ৯০৮)। সাধারণত প্রতিটি মুসলিম, মুসলিমা, মুমিন, মুমিনা রমযান মাস ব্যাপী তাকওয়া অর্জনের দৃঢ় সিদ্ধান্ত নেয়, সাওম পালন করে, খুশুখুজুর সাথে সালাত আদায় করে, পাপাচার থেকে বিরত থাকে, কুরআন তেলাওয়াত করে, বেশি বেশি দান-সাদাকাহ করে ও বেশি বেশি দোয়া প্রার্থনা ও এবাদত-বন্দেগীর মাধ্যমে মাস অতিক্রম করে থাকে। এছাড়াও মহান আল্লাহ তা'য়ালা এই পবিত্র রমযান মাসকে অন্যান্য মাসের চেয়ে অধিক সম্মান দিয়েছেন কারণ এই মাসেই রয়েছে এমন একটি রাত যে রাতের মর্যাদা, গুরুত্ব হাজারো মাসের চেয়ে বেশি আর সেটি হলো লাইলাতুল-ক্বদরের রাত। মুসলিমরা রমযানের শেষ দশ দিনের বেজোড় রাত গুলোতে লাইলাতুল-ক্বদর সন্ধান করে এবং সারা রাত আল্লাহর এবাদত-বন্দেগীতে কাটিয়ে দেয়। এছাড়াও অনেক মুসলিম রমযানের শেষ দশ দিন ইতেকাফে অংশগ্রহণ করে মসজিদে মসজিদে। ইদ-উল-ফিতরের আরেকটি সৌন্দর্য হলো ইদ-উল-ফিতর উপলক্ষে মানুষ সদাকাতুল ফিতর এবং যাকাত প্রদান করে থাকে। প্রতিটি মুসলিম ব্যক্তির উপর সদাকাতুল ফিতর ও যাকাত আদায় করা ফরজ। প্রত্যেক সামর্থবান ব্যক্তির সম্পদের ২.৫% সম্পদ যাকাত হিসেবে প্রদান করতে হয় এবং একটি নির্দিষ্ট পরিমাণ সদাকাতুল ফিতর ব্যক্তি বিশেষে আদায় করতে হয়। ২০২৪ সালে প্রতি ব্যক্তির সর্বনিম্ন ১১৫ টাকা থেকে সর্বোচ্চ ২৬৪০ টাকা ফিতরা প্রদান করতে হবে। এবং এই ফিতরার টাকা অবশ্যই ইদের নামাজের আগেই গরিব, অসহায়, দুঃস্থদের প্রদান করতে হয়।\n\nইদের আগেই সকল কর্ম ব্যস্ততা শেষে ছুটি দেওয়া হয় সকল কলকারখানা, অফিস, স্কুল, কলেজ, মাদরাসা সহ সকল শিক্ষা প্রতিষ্ঠান। এ সময়ে জীবনের তাগিদে নিজ বাড়ি থেকে দূরে থাকা সকলেই নাড়ীর টানে বাড়ি ফিরে, যা ইদ উপলক্ষে একটি বড় ধরণের ভালো লাগা। ইদের আগে সকলে ক্রয় করে নতুন পোশাক। ইদের দিন সকালে ইদের নামাজ আদায়ের মাধ্যমে মুসলিমরা বাহারী খাবার তৈরি ও আশেপাশের সবাইকে খাবার দেওয়া, আতিথেয়তা করা, বড়রা ছোটদের ইদ-সালামি দেওয়া, ইদের দিন কোথাও ঘুরতে যাওয়ার মাধ্যমে ইদ উদযাপন করে থাকে। এছাড়াও ইদ উপলক্ষে দেশব্যাপী নানা সাংস্কৃতিক অনুষ্ঠানও মেলার আয়োজন করা হয়ে থাকে। এভাবেই প্রতি বছর মুসলিমরা বিশ্বব্যাপী ইদ-উল-ফিতর পালন করে থাকে। ইদ একার নয়, ইদ হোক আমাদের সবার, ইদ হোক ধনী, গরিব, ছোট, বড় সকলে মিলে এক এবং ঐক্যবদ্ধতার।","img":""},{"id":"a23","bn":"শিক্ষার্থীদের ঝরে পড়া রোধ করতে হবে","en":"Dropout Among Students Must Be Prevented","paper":"Daily Ittefaq","date":"08 April 2024","link":"https://epaper.ittefaq.com.bd/edition/1254/1st-edition/page/9","content":"বাড়ছে শিক্ষার মান, কমছে না ঝরে পড়া শিক্ষার্থীদের পরিমাণ। বাংলাদেশে প্রতি বছর বিভিন্ন পর্যায়ে লাখো লাখো শিক্ষার্থী ঝরে পড়ে এবং পড়ছে। শিক্ষার্থীদের ঝরে পড়ার পিছনে বহু কারণ রয়েছে। শিক্ষার্থীদের ঝরে পড়া নিয়ে এ পর্যন্ত সরকারি, বেসরকারি, সামাজিক উন্নয়নমূলক সংগঠন গুলোর নানা ধরণের কার্যক্রম পরিচালিত ও চলমান থাকলেও শিক্ষার্থীদের ঝরে পড়ার সংখ্যা কমছেই না, বরং দিন দিন ঝরে পড়া শিক্ষার্থীদের সংখ্যা বাড়ছেই। একটি পরিসংখ্যান করলে আমরা দেখতে পাই যে, ২০১৪ সালে ইবতেদায়ী সহ প্রাথমিক শিক্ষা সমাপনী পরীক্ষা দিয়েছে প্রায় ৩১ লাখ শিক্ষার্থী। এবং উক্ত বর্ষের শিক্ষার্থীরাই ২০১৭ এর জেএসসি ও জেডিসি পরীক্ষা মিলে মোট অংশগ্রহণ করেছে প্রায় ২৪ লাখ ৬৮ হাজার শিক্ষার্থী এবং ২০২০ এ এসে একই শিক্ষাবর্ষের শিক্ষার্থীরা এসএসসি পরীক্ষায় অংশগ্রহণ করেছে প্রায় ২০ লাখ ৫০ হাজার শিক্ষার্থী এবং সবশেষে ২০২২ শিক্ষাবর্ষে এইচএসসি শিক্ষার্থীর সংখ্যা দাঁড়ায় প্রায় ১২ লাখে। অর্থাৎ প্রাথমিক শিক্ষা সমাপনী পরীক্ষার পর ঝরে পড়েছে প্রায় ৬ লাখের বেশি শিক্ষার্থী, জেএসসির পর প্রায় ৪ লাখ এবং এসএসসির পর প্রায় ৮ লাখ শিক্ষার্থী। শিক্ষার্থীদের এভাবে ঝরে পড়া কারণে শিক্ষাব্যবস্থায় বড় ধরণের প্রভাব পড়ছে। শিক্ষার্থীদের ঝরে পড়ার কারণে কমছে শিক্ষার মান, বাড়ছে দারিদ্র্যতা, ঝরে পড়া শিক্ষার্থীরা ভবিষ্যতের জন্য সামাজিক বোঝা হওয়ার কারণে বাড়ছে বা বাড়বে সামাজিক অস্থিরতা। এছাড়াও দক্ষ জনবলের ঘাটতিও শিক্ষার্থীদের ঝরে পড়ার কারণেই বৃদ্ধি পাচ্ছে। \n\nশিক্ষার্থীদের ঝরে পড়ার পিছনে নানা সামাজিক, পারিবারিক ও শিক্ষাগত সমস্যা রয়েছে। সামাজিক ও পারিবারিক সমস্যা গুলোর মধ্যে দারিদ্র্যতা, বাল্য বিবাহ, অশিক্ষিত পিতা-মাতা, ছেলেদের ক্ষেত্রে দ্রুত কাজে যোগদানের জন্য পারিবারিক চাপ, মাদকদ্রব্যের প্রভাব, উদাসীনতা, অনাগ্রহ, ইত্যাদি কারণ রয়েছে। এবং শিক্ষার্থীদের ঝরে পড়ার পিছনে অসংখ্য শিক্ষাগত সমস্যা রয়েছে। শিক্ষার নিম্নমান, পাঠ্য বিষয়বস্তু কঠিন হওয়াতে আগ্রহ হারানো, শিক্ষকদের সাথে ভালো সম্পর্ক না থাকা, শিক্ষাক্ষেত্রে অতিরিক্ত খরচ, শহরের ক্ষেত্রে যত্রতত্র মানহীন ও দক্ষ শিক্ষক ব্যতীত স্কুল-কলেজ স্থাপন, গ্রামের ক্ষেত্রে বাসস্থান থেকে স্কুল-কলেজ দূরে থাকা, ইত্যাদি। \n\nশিক্ষার্থীদের ঝরে পড়া রোধে সামাজিক, পারিবারিক, শিক্ষাগত ও সরকারি ভাবে সকল ধরণের পদক্ষেপ গ্রহণ করতে হবে। দারিদ্র্যতা নিরসনে শিক্ষা উপবৃত্তি বৃদ্ধি করা, শিক্ষা ক্ষেত্রে প্রয়োজনীয় শিক্ষা উপকরণ বিদ্যালয় থেকে প্রদানের ব্যবস্থা করা, বাল্য বিবাহ রোধে আইনি পদক্ষেপ কঠোর করা, অভিভাবকদের মধ্যে সচেতনতা বৃদ্ধি করা, মাদকদ্রব্য নিয়ন্ত্রণে কঠোর আইনি ব্যবস্থা গ্রহণ করা, প্রাথমিক থেকে মাধ্যমিক পর্যন্ত পাঠ্য বিষয়বস্তু সহজতর করা অথবা ব্যবহারিক শিক্ষা বৃদ্ধি করা, শহরের যত্রতত্র শিক্ষাপ্রতিষ্ঠান গড়ে তোলার ক্ষেত্রে পদক্ষেপ গ্রহণ করা এবং নতুন স্কুল-কলেজ গুলোতে শিক্ষার মান ঠিক আছে কিনা ও পর্যাপ্ত শিক্ষক আছে কিনা শিক্ষা মন্ত্রণালয়ের এদিকে বিশেষ নজরদারি করা, গ্রামে দুর্গম এলাকাগুলোতে স্কুল-কলেজ প্রতিষ্ঠা করা, কারিগরি শিক্ষা বৃদ্ধি করা এবং কারিগরি স্কুল-কলেজ গুলোর উন্নয়নে বিশেষ নজরদারি করা, শিক্ষার্থী এবং অভিভাবকদের সাথে যেন শিক্ষকদের ভালো ও ঘনিষ্ঠ সম্পর্ক থাকে এবং তারা যাতে শিক্ষকদের ভয় না পায় সে ক্ষেত্রে শিক্ষকদের দায়িত্ব পালন করা, কোনো শিক্ষার্থী স্কুলে অনিয়মিত হলে শিক্ষকরা তার খোঁজ খবর নেওয়া এবং তার সমস্যা সমাধানে সহযোগিতা করে স্কুলে যাতে নিয়মিত আসে তা নিশ্চিত করা, শিক্ষকদের পাঠ্য বিষয়বস্তু সহজ সাবলিল ভাবে অধ্যয়ন করানো যাতে শিক্ষার্থীদের পড়ার বিষয়ে আগ্রহ বৃদ্ধি পায়, এছাড়াও পারিবারিকভাবে সচেতনতা বৃদ্ধি এবং সরকারিভাবে সকল প্রয়োজনীয় পদক্ষেপ গ্রহণের মাধ্যমে শিক্ষার্থীদের ঝরে পড়া রোধ করা সম্ভব। \n\nশিক্ষার্থীদের ঝরে পড়া রোধ করা গেলে কমবে সামাজিক সমস্যা, বাড়বে শিক্ষার মান ও শিক্ষিত মানুষের সংখ্যা, বাড়বে দক্ষ জনগোষ্ঠী, কমবে কিশোর অপরাধ, দারিদ্র্যতা ও ভবিষ্যতের সমাজের বোঝার পরিমাণ। তাই শিক্ষার্থীদের ঝরে পড়া সম্পূর্ণ রোধে সামাজিক, পারিবারিক ও রাষ্ট্রীয়ভাবে সকল পদক্ষেপ গ্রহণ করে শিক্ষার মান উন্নয়ন করা এখন সময়ের অপেক্ষা।","img":""},{"id":"a22","bn":"বাংলাদেশ যেভাবে পরিবেশ দূষণের শীর্ষে","en":"How Bangladesh Tops Environmental Pollution","paper":"Daily Share Biz","date":"31 March 2024","link":"https://www.facebook.com/photo/?fbid=2273048713070754&set=pcb.2273049493070676","content":"মাটি, পানি, বায়ু, শব্দ, আলো সকল ধরণের দূষণ একত্রিত হয়ে পরিবেশ দূষণ হয়ে থাকে। বিশ্ব ব্যাঙ্কের দেওয়া এক তথ্য মোতাবেক বাংলাদেশে ২০১৫ সালে পরিবেশ দূষণের কারণে ৮০ হাজার মানুষের মৃত্যু হয়েছে। অর্থাৎ, বাংলাদেশে প্রতি বছর যতো মানুষের মৃত্যু হয় তার ২৮ শতাংশই মারা যায় পরিবেশ দূষণজনিত অসুখবিসুখের কারণে। বাংলাদেশের পরিবেশ এতোটা দূষিত যে, বেঁচে থাকার জন্য বাংলাদেশের মানুষ পৃথিবীর সবচেয়ে দূষিত বাতাস গ্রহণ করে থাকে। ২০২৩ সালের আইকিউএয়ার এর প্রতিবেদনে দেখা যায়, বাংলাদেশ পৃথিবীর সবচেয়ে দূষিত বাতাসের দেশ এবং দ্বিতীয় ও তৃতীয় অবস্থানে যথাক্রমে পাকিস্তান ও ভারত রয়েছে। বিশ্ব স্বাস্থ্য সংস্থার বেধে দেওয়া মানের চেয়ে ১৫ গুণের বেশি পিএম পাওয়া গিয়েছে বাংলাদেশের বাতাসে। পিএম হলো পার্টিকুলেট ম্যাটার, যেটি দ্বারা বোঝা যায় বাতাসে ভাসমান কঠিন বা তরল পদার্থের ক্ষুদ্র কণার মিশ্রণের পরিমান। ধুলো, ধোঁয়া, ছাই, ধাতব কণা, জৈব পদার্থ, বনভূমি দাহ, আগ্নেয়গিরি, ঝড়, ধুলো ঝড়, যানবাহন, কলকারখানা, বিদ্যুৎ কেন্দ্র, ইটভাটা, কৃষি, নির্মাণ কাজ সহ ইত্যাদি কারণে বাতাসে পিএম বৃদ্ধি পেয়ে থাকে। দূষিত শহরের তালিকায় ঢাকা জেলা পৃথিবীর দ্বিতীয় তম দূষিত শহর, প্রথমে রয়েছে ভারতের নয়া দিল্লি। বাংলাদেশের বায়ু দূষণের পিছনে অসংখ্য কারণ রয়েছে। সাধারণত ঢাকায় চলাচল করা যানবাহনের ৮০% বাস এক যুগের বেশি পুরনো, উক্ত যানবাহনের অনিয়ন্ত্রিত ধোঁয়া মারাত্মকভাবে বায়ু দূষণ করে থাকে। এছাড়াও যানবাহনের সংখ্যা বৃদ্ধি পাওয়া, রাস্তাঘাটের অতিরিক্ত যানজট বায়ু দূষণ বৃদ্ধির পিছনে দায়ী। ২০২৩ সালের ৩১ এ জানুয়ারি পরিবেশ মন্ত্রীর দেওয়া তথ্যানুযায়ী, বাংলাদেশে প্রায় ৮০০০ ইট ভাটা রয়েছে, যার ৬০% অবৈধ। অবৈধ ইট ভাটা গুলো পরিবেশগত ছাড়পত্র ছাড়াই বছরের পর বছর চলছে, নিম্ন মানের জ্বালানি ব্যবহার সহ আরো নানা মাধ্যমে এসব ইট ভাটা মারাত্মকভাবে বায়ু দূষণ করছে। এছাড়াও মন্ত্রী আরো জানান যে, বাংলাদেশের শহরগুলোতে দৈনিক প্রায় ৩০ হাজার কঠিন বর্জ্য উৎপন্ন হয়, যেটি আগামী ২০২৫ সালে ৪৭ হাজারে উন্নীত হবে এবং এসব কঠিন বর্জ্যের ১০ শতাংশই প্লাস্টিকজাত। বাংলাদেশে প্রায় ৫০ হাজার কলকারখানা রয়েছে। অধিকাংশ কলকারখানায় পুরনো ও অনুন্নত প্রযুক্তি ব্যবহার, নিম্নমানের জ্বালানি ব্যবহারের কারণে নির্গত ধোঁয়া ও ধূলিকণা, বিভিন্ন রাসায়নিক গ্যাস, যেমন কার্বন ডাই অক্সাইড, কার্বন মনোক্সাইড, সালফার ডাই অক্সাইড, নাইট্রোজেন অক্সাইড ইত্যাদি বায়ু দূষণের জন্য দায়ী। অনিয়ন্ত্রিত নির্মাণ কাজের কারণে নির্মাণ সাইট থেকে ধুলোবালি, ভবন ভাঙার ধুলো মারাত্মক ভাবে দূষণ সৃষ্টি করে থাকে। কাঠ, কয়লা, কেরোসিন সহ ইত্যাদি অপরিমার্জিত জৈব জ্বালানি ব্যবহার, গ্রামাঞ্চলে জৈব জ্বালানির উপর নির্ভরতা বায়ু দূষণ সৃষ্টি করছে। এছাড়াও বন উজাড়, কৃষি কাজ, অপরিচ্ছন্নতা, পরিবেশ আইনের শিথিল প্রয়োগ বায়ু দূষণের পিছনে দায়ী। বায়ু দূষণের কারণে বিভিন্ন ধরণের রোগ হয়ে থাকে যথা শ্বাসকষ্ট, হৃদরোগ, স্ট্রোক, ক্যান্সার, অ্যালার্জি ইত্যাদি। এছাড়াও বায়ু দূষণের কারণে মারাত্মকভাবে পরিবেশের ভারসাম্য নষ্ট হয়ে থাকে। \n\nপানি দূষণ পরিবেশ দূষণের পিছনে একটি অন্যতম প্রধান কারণ। বাংলাদেশে নানা ভাবে পানি দূষণ হয়ে থাকে। তন্মধ্যে শিল্প কারখানা মুখ্য ভূমিকা পালন করে থাকে। কলকারখানার বর্জ্য পানিতে প্রত্যক্ষভাবে ফেলা পানি দূষণের পিছে মারাত্মকভাবে দায়ী। কারখানার রাসায়নিক পদার্থ, ভারী ধাতু, তেল, এবং রঞ্জক পানিতে মিশে পানি দূষণ সৃষ্টি করে থাকে। এছাড়াও শিল্প কারখানা গুলোর ত্রুটিপূর্ণ বর্জ্য ব্যবস্থাপনার কারণে পানি দূষণ হয়ে থাকে। কৃষি ক্ষেত্রে রাসায়নিক সার ও কীটনাশকের অপরিকল্পিত ব্যবহারের কারণে কীটনাশক, সার, এবং রাসায়নিক উপাদান এবং কৃষি ক্ষেত থেকে বর্জ্য পানিতে মিশে পানি দূষণ করছে। এছাড়াও পয়ঃনিষ্কাশন ব্যবস্থার অভাব, অপরিকল্পিত ও অপরিচ্ছন্ন শহরাঞ্চল, কঠিন বর্জ্য পানিতে ফেলা, যানবাহনের তেল ও রাসায়নিক পানিতে মিশে যাওয়া, তেল ও গ্যাস অনুসন্ধান ও উত্তোলনের ফলে পানি দূষণ, আর্সেনিক দূষণ, জলাভূমি ভরাট, পানি ব্যবহারের অসচেতনতা, নদীতে চলমান যানের ময়লা-আবর্জনা পানিতে ফেলা, নদীর পাশে তৈরি হওয়া বাজারের সকল বর্জ্য নদীতে ফেলা সহ ইত্যাদি কারণে মারাত্মকভাবে পানি দূষণের সৃষ্টি হয়ে থাকে। পানি দূষণের কারণে নানা ধরণের পানিবাহিত রোগ হয়ে থাকে যথা ডায়রিয়া, কলেরা, টাইফয়েড এবং দূষিত পানিতে এডিস, অ্যানোফিলিস মশার জন্ম হয়ে ডেঙ্গু, ম্যালেরিয়া, চিকুনগুনিয়া, ফাইলেরিয়া সহ ইত্যাদি মশাবাহিত রোগও পানি দূষণের কারণে হয়ে থাকে। এমনকি দূষিত পানি পানের ফলে জন্ডিস হওয়ারও সম্ভাবনা রয়েছে। এছাড়াও পানি দূষণের কারণে জীববৈচিত্র্য হ্রাস, জলজ প্রাণীর বিলুপ্তি, কৃষি উৎপাদন ক্ষতিগ্রস্ত হওয়া, খাদ্য নিরাপত্তাহীনতা, পরিবেশগত ভারসাম্য নষ্ট হওয়া সহ আরো নানা ক্ষতি হয় এবং হওয়ার সম্ভাবনা থাকে। \n\nপরিবেশ দূষণের আরেকটি অংশ হলো শব্দ দূষণ, যা বাংলাদেশের একটি ক্রমবর্ধমান সমস্যা। বাংলাদেশে শব্দ দূষণ একটি মারাত্মক সমস্যা, যা দিন দিন বেড়েই চলেছে। নানা কারণে শব্দ দূষণ হচ্ছে এবং প্রতিনিয়ত বৃদ্ধি পাচ্ছে। তন্মধ্যে ঢাকাসহ দেশের বড় বড় শহরগুলোতে যানবাহনের অনিয়ন্ত্রিত ব্যবহার এবং যানবাহন বৃদ্ধির কারণে শব্দ দূষণের সৃষ্টি হচ্ছে। প্রয়োজন ছাড়াই হাইড্রোলিক হর্ন ব্যবহার, সাইলেন্সার বিহীন মটর বাইক, যানজটের কারণে মারাত্মক শব্দ দূষণের সৃষ্টি হচ্ছে। শিল্প কারখানা গুলোতে অনুন্নত ও ত্রুটিপূর্ণ যন্ত্রপাতির ব্যবহার ও আবাসিক এলাকার কাছে কারখানা গড়ে উঠাও শব্দ দূষণ করে থাকে। এছাড়াও নির্মাণ কাজে ব্যবহৃত যন্ত্রপাতি, বিবাহ, মিলাদ, রাজনৈতিক সমাবেশে ও বিভিন্ন আচার-অনুষ্ঠানে উচ্চ স্বরে মাইক ও স্পিকার বাজানো ও বহু জায়গায় বিদ্যুৎ বিভ্রাটের কারণে জেনারেটরের ব্যবহারের কারণেও মারাত্মক শব্দ দূষণের সৃষ্টি হয়ে থাকে। শব্দ দূষণের কারণে মানুষের শারীরিক ও মানসিক দুই ধরনের ক্ষতিই হয়ে থাকে। দীর্ঘ সময় ধরে উচ্চ শব্দের সংস্পর্শে থাকলে শ্রবণশক্তি হ্রাস পেতে পারে। শব্দ দূষণের কারণে মানসিক চাপ, উদ্বেগ, এবং বিরক্তি ও মারাত্মক ঘুমের ব্যাঘাত হতে পারে। যা শারীরিক ও মানসিক দুই ধরণের ক্ষতিরই কারণ। শুধু মানুষই না, বরং শব্দ দূষণের কারণে পাখিসহ অন্যান্য প্রাণীরাও মারাত্মক সমস্যার সম্মুখীন হয়ে থাকে। \n\nক্রমশ পরিবেশ দূষণের বৃদ্ধি পাওয়ার আরেকটি কারণ হলো অতিরিক্ত মাটি দূষণ হওয়া। মাটি দূষণের ফলে পরিবেশের মারাত্মক ক্ষতি সাধন হয়ে থাকে। আমরা প্রতি নিয়ত প্লাস্টিক ও পলিথিনের অতিরিক্ত ব্যবহারের মাধ্যমে মারাত্মকভাবে মাটি দূষণ করে থাকি। এছাড়াও শিল্প কারখানার বর্জ্য, কৃষিক্ষেত্রে অতিরিক্ত কীটনাশক ও রাসায়নিক সারের ব্যবহার, বন উজাড় এবং সহজে পচে না এমন ময়লা মাটিতে ফেলা মাটি দূষণের অন্যতম কারণ। মাটি দূষণের ফলে মাটির উর্বরতা হ্রাস পায় এবং ফসল উৎপাদন কমে যায়। এছাড়াও মাটি দূষণের কারণে দূষিত মাটিতে উৎপাদিত খাবার মানব দেহের জন্য মারাত্মক ক্ষতির কারণ। মাটি দূষণের ফলে জীব বৈচিত্র হ্রাস, পানি দূষণ সহ পরিবেশের ভারসাম্যও নষ্ট হয়ে থাকে।\n\nআমাদের দেশ ও পৃথিবীতে ক্রমশ অতি মাত্রায় বৃদ্ধি পাওয়া আরেকটি দূষণ হলো আলোক দূষণ। অতিরিক্ত আলোর ব্যবহার আনন্দ ও আধুনিকতার ছাপ মনে করা হলেও নিরবঘাতকের মতো অতিরিক্ত আলোর ব্যবহার মারাত্মকভাবে মানুষ সহ পরিবেশের অন্যান্য প্রাণীদের ক্ষতি করে যাচ্ছে। অতিরিক্ত আলো ব্যবহারের কারণে মানুষের চোখ ক্ষতিগ্রস্থ হচ্ছে, ঘুমের ব্যাঘাত হয়ে শারীরিক ও মানসিক অসুস্থতা বাড়ছে। আলো দূষণের কারণে পাখি ও অন্যান্য প্রাণীদের ক্ষতি সহ মহাকাশ বিজ্ঞানীদের গবেষণায়ও বাঁধার সৃষ্টি হচ্ছে। \n\nউক্ত সকল ধরণের দূষণ রোধে একটি রাষ্ট্রের জনগণ ও সরকার সকলকে একইসাথে কাজ করতে হবে। বায়ু, মাটি, পানি, শব্দ ও আলো দূষণ রোধে যানবাহনের ধোঁয়া কমানো, কালো ধোঁয়া নির্গমন হয় এমন যানবাহন বন্ধ করা, কলকারখানা থেকে নির্গমন হওয়া ক্ষতিকারক ধোঁয়া নিয়ন্ত্রণ এবং এ ব্যাপারে কঠোর আইন প্রয়োগ, জৈব জ্বালানি ব্যবহার কমিয়ে এনে পরিবেশবান্ধব জ্বালানি ব্যবহার, ইটভাটার ধোঁয়া নিয়ন্ত্রণ, নির্মাণ সাইটের ধুলো নিয়ন্ত্রণ, বনায়ন, পানি দূষণ রোধে কলকারখানার বর্জ্য পানি পরিশোধন করে নদীতে ফেলা, মানুষের বর্জ্য পানি সঠিকভাবে নিষ্কাশন করা, রাসায়নিক সার ও কীটনাশকের ব্যবহার কমিয়ে জৈব সার ব্যবহার বৃদ্ধি করা, পয়ঃনিষ্কাশন ব্যবস্থার উন্নয়ন, জলাভূমি রক্ষা করা, শব্দ দূষণ রোধে যানবাহনের হাইড্রোলিক হর্ন বাজানো নিয়ন্ত্রণ করা, সাইলেন্সার বিহীন মটর বাইক জব্দ করা, আবাসিক এরিয়াতে শিল্প কারখানা বন্ধ করা, শিল্প কারখানা গুলোতে উন্নত যন্ত্রের ব্যবহার ও পুরাতন যন্ত্রের সংস্কার নিশ্চিত করা, মাটি দূষণ রোধে প্লাস্টিক ও পলিথিনের ব্যবহার বন্ধ করে পাট জাতীয় পণ্যের ব্যবহার, নির্দিষ্ট জায়গায় ময়লা ফালানো, আলো দূষণ রোধে প্রয়োজনের চেয়ে বেশি আলো ব্যবহার না করা, আলো নিয়ন্ত্রণ ব্যবস্থা স্থাপন করে আলো অপচয় রোধ করা, এলইডি আলোর মতো উন্নত আলো ব্যবহার করা সহ সকল ধরণের দূষণের বিরুদ্ধে জনসচেতনতা বৃদ্ধি করা ও কঠোর আইনি ব্যবস্থা তৈরি করে তা বাস্তবায়ন করতে হবে। \n\nপরিবেশ আমাদের, আমাদের বেঁচে থাকার জায়গা, পরিবেশের ক্ষতি করা হলো নিজের ও নিজের আশেপাশের সকলের ক্ষতি করার সমান। তাই পরিবেশ রক্ষার্থে ও দূষণ রোধে আমাদের সম্মিলিত প্রচেষ্টাই বড় ধরণের পরিবর্তন এনে দিতে পারে।","img":""},{"id":"a21","bn":"ইবির অগঠিত ওয়েবসাইট","en":"IU's Unstructured Website","paper":"Daily Amader Shomoy","date":"20 March 2024","link":"https://epaper.dainikamadershomoy.com/2024/03/20/page-04","content":"প্রতিষ্ঠার ৪৪ বছরেও ইসলামী বিশ্ববিদ্যালয়ের (ইবি) ওয়েবসাইটটি সুগঠিত এবং সকল ধরণের সুযোগ সুবিধা সম্পন্ন নয়। সাধারণত একটি বিশ্ববিদ্যালয়ের ওয়েবসাইট তখনই সুগঠিত হয় যখন উক্ত ওয়েবসাইটে বিশ্ববিদ্যালয়ের সকল তথ্য যথা ইতিহাস, মিশন, ভিশন, লক্ষ্য, বিভাগ, প্রোগ্রাম, শিক্ষক, শিক্ষার্থী, কর্মকর্তা, কর্মচারী, ভর্তি প্রক্রিয়া, বৃত্তি, আর্থিক সহায়তা, গবেষণা, প্রকাশনা, সম্মেলন, ক্যাম্পাস, লাইব্রেরী, আবাসন, খেলাধুলা, সাংস্কৃতিক কর্মকাণ্ড, সংবাদ, ঘটনা সহ সকল তথ্য থাকে। এবং ওয়েবসাইটটি ব্যবহারকারী বান্ধব যথা সহজ নেভিগেশন, স্পষ্ট লিখা, আকর্ষণীয় ডিজাইন, মোবাইল ডিভাইসের জন্য উপযোগী, সহায়তা কেন্দ্র সম্বলিত থাকে। এছাড়াও উচ্চ মানের ছবি, ভিডিও, গ্রাফিক্স, ভার্চুয়াল ক্যাম্পাস ট্যুর, অনলাইন কোর্স, দ্রুত লোডিং হওয়া, ব্যক্তিগত তথ্যের গোপনীয়তা রক্ষা, সাইবার হামলা থেকে সুরক্ষা, বহুভাষিক, সার্চ ইঞ্জিনে বিশ্ববিদ্যালয়ের ওয়েবসাইট দৃশ্যমান হওয়া, বিশ্ববিদ্যালয়ের খবর ও ঘটনা দ্রুত ছড়িয়ে দেওয়া, প্রাক্তন শিক্ষার্থীদের সাথে যোগাযোগ রাখা, ভর্তি আবেদন, ফি প্রদান, রেজিস্ট্রেশন, কোর্স মেটেরিয়াল ডাউনলোড সহ সকল ধরণের সুযোগ সুবিধা থাকে। কিন্তু ইবির ওয়েবসাইটে উপরোক্ত অনেক সুযোগ সুবিধাই নেই। নেই সকলের জন্য ওয়েব মেইলের ব্যবস্থা। এছাড়াও বিভাগীয় তথ্য সম্পূর্ণ এবং সঠিকভাবে না থাকা, বর্তমান ও প্রাক্তন শিক্ষার্থীদের কোনো প্রকার তথ্য না থাকা সহ ইত্যাদি সমস্যা রয়েছে। তাই অনতিবিলম্বে বিশ্ববিদ্যালয়ের ওয়েবসাইটটি কে একটি সুগঠিত এবং সকল সুযোগ সুবিধা সম্বলিত ওয়েবসাইটে দ্রুত উন্নীত করার জন্য বিশ্ববিদ্যালয়ের সংশ্লিষ্ট কর্তৃপক্ষের নিকট জোরালো আবেদন করছি।","img":""},{"id":"a20","bn":"বন্ধ হোক পলিথিন, সন্ধি হোক পাটের সাথে","en":"Ban Polythene, Reconcile with Jute","paper":"Daily Janakantha","date":"20 March 2024","link":"https://www.facebook.com/photo/?fbid=2273048793070746&set=pcb.2273049493070676","content":"এক সময় বাংলাদেশের প্রধান রপ্তানি পণ্য হওয়ার কারণে \"সোনালী আঁশ\" নামে খ্যাতি পায় পাট। তবে বর্তমানে পলিথিনের অত্যাধিক ব্যবহার, পাটের উৎপাদন কমে যাওয়া, সহজলভ্য থেকে দুর্লভ হয়ে যাওয়া, দেশের অধিকাংশ পাটকল বন্ধ হয়ে যাওয়া, পাট ব্যবসা ও চাষ অলাভজনক হওয়াতে পাটের ব্যবহার একদমই কমে গিয়েছে। পাটের ব্যবহার কমে যাওয়ার কারণে মূলত মুখ্য ভূমিকা পালন করে পলিথিন। আমাদের দেশে প্রতিনিয়ত পলিথিনের ব্যবহার বৃদ্ধি পাচ্ছে, বৃদ্ধি পাচ্ছে পরিবেশ দূষণ। পলিথিন একটি অপচনশীল এবং দীর্ঘস্থায়ী উপাদান। বাংলাদেশে খাবার, পোশাক, ইলেকট্রিক জিনিসপত্র, প্রসাধনী ও ঔষধ সহ ইত্যাদি প্যাকেজিং, পলিথিনের ব্যাগ, প্লাস্টিকের পাত্র, বোতল, কৃষি ক্ষেত্রে বীজ রোপণ, সার প্রয়োগ, সেচ, ফসল সংরক্ষণ, গ্রিন হাউস, প্লাস্টিকের পাইপ, মালচিং, ভবন নির্মাণে পানি ধরে রাখা, ছাদ ঢাকা, মেঝে ঢাকা, পানির ট্যাংক নির্মাণ, প্লাস্টিকের দরজা-জানালা নির্মাণ, খেলনা, ফার্নিচার, জিনিসপত্র, প্লাস্টিকের মোড়ক সহ ইত্যাদি নানা কাজে পলিথিন ব্যবহার করা হয়ে থাকে। পলিথিন হলো এক প্রকার প্লাস্টিক, যাতে পেট্রোলিয়াম থাকে। এবং প্লাস্টিককে নরম করে পলিথিন বানানোর জন্য বিভিন্ন ধরণের মানবদেহের জন্য ক্ষতিকারক রাসায়নিক পদার্থ ব্যবহার করা হয়। এছাড়াও পলিথিনে  সীসা, ক্যাডমিয়াম, পারদ সহ বিভিন্ন ধরণের ভারী ধাতু রয়েছে। পলিথিনে থাকা এসব উপাদান মানবদেহের জন্য মারাত্মক ক্ষতিকর। প্লাস্টিক বা পলিথিন তৈরিতে যেসব রাসায়নিক উপাদান ব্যবহার করা হয় তার জন্য মানুষের হরমোনের ভারসাম্য নষ্ট হতে পারে, শিশুদের বিকাশে বাধা সৃষ্টি হতে পারে, এমনকি গর্ভবতী ও স্তন্যদানকারী মহিলাদের জন্যও ক্ষতির সম্ভাবনা রয়েছে। এছাড়াও পলিথিনের ব্যবহারের জন্য প্রজনন ক্ষমতা হ্রাস পাওয়া, জন্মগত ত্রুটি হওয়া, স্নায়ুতন্ত্র ও কিডনির ক্ষতি হওয়া সহ এমনকি ক্যান্সার হওয়ার মতো বড় ধরনের ঝুঁকিও রয়েছে। পলিথিন ব্যবহারে শুধু মানুষের জন্যই নয় বরং পরিবেশ এবং প্রাণীদের জন্যও মারাত্মক ক্ষতির কারণ। পলিথিনের কারণে মাটি ও পানি মারাত্মকভাবে দূষিত হচ্ছে। পলিথিন মাটিতে বছরের পর বছর থাকার পরেও পচে বা মিশে যায় না। পলিথিনের পচনকাল সাধারণত ১০০০ বছর বা কোনো কোনো ক্ষেত্রে এর থেকেও বেশি। পলিথিন মাটির সংস্পর্শে আসার পর ছোট ছোট টুকরায় ভেঙে যায়, যা মাটির উর্বরতা নষ্ট করে, জমির পানি নিষ্কাশন ব্যবস্থা নষ্ট করে, জলজ প্রাণীদের খাবারের সাথে মিশে প্রাণীদের মৃত্যু হওয়া এবং মাছের খাবারের সাথে মিশে গিয়ে মাছের শরীরে মিশে যাওয়া এবং সেই মাছ খেয়ে নানা ধরণের রোগব্যাধি হওয়া সহ পানি দূষণের মাধ্যমে পানিবাহিত রোগ সহ নানা ক্ষতি করে পরিবেশ দূষণ করে থাকে। এছাড়াও পলিথিনের টুকরো পশুপাখিদের খাদ্যের সাথে মিশে পশুপাখি মারা যাওয়া, জলাশয়ে জমা হয়ে জলজ প্রাণীদের আবাসস্থল নষ্ট হওয়া সহ নানা মাধ্যমে পলিথিন জীব বৈচিত্র্য নষ্ট করছে। আবার পলিথিন পোড়ালে বাতাসে কার্বন ডাই-অক্সাইড, কার্বন মনোক্সাইড, বেনজিন, টলুইন সহ নানা ধরণের ক্ষতিকারক রাসায়নিক পদার্থ ছড়িয়ে পড়ে, যা শ্বাসকষ্ট, হাঁপানি ও ক্যান্সার সহ নানা ধরণের স্বাস্থ্য ঝুঁকির কারণ হতে পারে। পরিবেশের সৌন্দর্য নষ্ট করার ক্ষেত্রেও অনেক ক্ষেত্রেই পলিথিন দায়ী। \n\nএদিকে সহজেই পচনশীল, দ্রুত মাটির সাথে মিশে যাওয়া, সহজেই উৎপাদন যোগ্য পাট খুবই কম ব্যবহার করা হচ্ছে। একসময় বাংলাদেশের অর্থনীতি যেটির উপর নির্ভরশীল ছিল, যেটি ছিল অন্যতম প্রথম ও প্রধান রপ্তানীর শীর্ষে থাকা পণ্য, তা আজ অবহেলিত এবং দুর্লভ হয়ে পড়েছে। পাট পরিবেশের জন্য অত্যন্ত ভালো এবং উপকারী একটি জিনিস। পাটে প্রধানত সেলুলোজ, লিগনিন, হেমিসেলুলোজ, পেকটিন, প্রোটিন ও খনিজ পদার্থ থাকে। সেলুলোজ কাগজ, কাপড় ও অন্যান্য জিনিস তৈরিতে, লিগনিন জৈব জ্বালানি তৈরিতে, হেমিসেলুলোজ খাদ্য ও পশু খাদ্য তৈরিতে ব্যবহৃত হয়। পাট সাধারণত ব্যাগ, বাক্স, বোতলের বিকল্প, খাবার ও ঔষধ প্যাকেজিং, বস্তা, দড়ি, সারের ব্যাগ, মালচিং, জৈব সার, ছাউনি, মেঝে ঢাকার উপাদান, দেয়ালের উপাদান, পানির ট্যাংক, জৈব ভিত্তিক প্লাস্টিক, খেলনা, ফার্নিচার, জিনিসপত্র, মোড়ক সহ ইত্যাদি ক্ষেত্রে ব্যবহারের উপযোগী। এছাড়াও পাট খুবই টেকসই ও দীর্ঘস্থায়ী। এটি দ্রুত বর্ধনশীল ফসল হওয়াতে প্রতিবছর কাটা যায়। এর আরেকটি বড় উপকারি দিক হলো, এটি বৃদ্ধি পাওয়ার সময় বায়ু থেকে প্রচুর পরিমাণে কার্বন ডাই-অক্সাইড শোষণ করে থাকে। পাটের চাষ জীব বৈচিত্র রক্ষায় সাহায্য করে থাকে। \n\nতবে কিছু কিছু ক্ষেত্রে পলিথিন পাটের চেয়ে ভালো। পলিথিন কম খরচে পাওয়া যায়, এটি পানি ধরে রাখার জন্য ব্যবহার করা যায়, ওজনে হালকা, বিভিন্ন আকারে ও বৈশিষ্ট্যে পাওয়া যায় এবং দীর্ঘ সময় ধরে টিকে থাকে। তাই কিছু কিছু ক্ষেত্রে পলিথিনের ব্যবহার রেখে এবং সেই সকল ক্ষেত্রে পলিথিনের পুনর্ব্যবহার নিশ্চিত করে আমাদের উচিত বাকি সকল ক্ষেত্রে দৈনন্দিন জীবনে মানবদেহ, পরিবেশ, দেশ এবং জীব বৈচিত্র রক্ষায় ও সুরক্ষায় পাটের ব্যবহার বৃদ্ধি করা ও পাট যাতে সকল প্রয়োজনীয় কাজে সর্বদা ব্যবহৃত হয় তা সুনিশ্চিত করা। \n\nতাই পাট উৎপাদন বৃদ্ধির জন্য জনগণ ও সরকার সকলকে একই সাথে কাজ করতে হবে। পাটের তৈরি সকল জিনিসপত্র ব্যবহার করে পাটের চাহিদা বৃদ্ধি করতে হবে, যারা পাট চাষ করে তাদের সাহায্য করার জন্য সকল উপায়ে সহায়তা করতে হবে, পাটের ব্যবহার ও সুবিধা সম্পর্কে সকলকে সচেতন করতে হবে। সরকারকে উন্নত পাটের জাত উদ্ভাবন এবং পাট উৎপাদন বৃদ্ধির জন্য বিনিয়োগ করতে হবে, পাট চাষীদের জন্য ভর্তুকি, ঋণ, প্রশিক্ষণ ইত্যাদির জন্য প্রণোদনা প্রদান করতে হবে, পাটের বাজারজাতকরণে উন্নত পদক্ষেপ গ্রহণ করতে হবে, পাট শিল্পের উন্নয়নের জন্য অবকাঠামো ও প্রযুক্তি সরবরাহ করতে হবে, দেশের যেসব পাটকল বন্ধ হয়ে গিয়েছে সেসব পাটকল পুনরায় সচল করার জন্য সকল পদক্ষেপ গ্রহণ করতে হবে,  সরকারি প্রতিষ্ঠান গুলোতে পলিথিনের পরিবর্তে পাটের ব্যবহার বাধ্যতামূলক করতে হবে, যেসব ক্ষেত্রে পলিথিন ব্যবহার করা আবশ্যক সেসব ক্ষেত্রে পলিথিনের পুনর্ব্যবহার সুনিশ্চিত করতে হবে। এছাড়াও উন্নত জাতের বীজ ব্যবহার, আধুনিক কৃষি পদ্ধতি ব্যবহার, কীটপতঙ্গ ও রোগের প্রতিরোধ ব্যবস্থা গ্রহণ করা, পাটের ন্যায্য দাম নিশ্চিত করার মাধ্যমে পাটের উৎপাদন বৃদ্ধি করা সম্ভব।\n\nপরিশেষে, পলিথিনমুক্ত বাংলাদেশ গঠন এবং পাটকে অর্থনীতির চালিকা শক্তি হিসেবে পুনরুজ্জীবিত করার লক্ষ্যে সকলের সম্মিলিত প্রচেষ্টা তৈরি করতে হবে।","img":""},{"id":"a19","bn":"স্মার্ট বাংলাদেশে কিশোর গ্যাং যখন বিষফোড়া","en":"Teen Gangs as a Festering Wound in Smart Bangladesh","paper":"Daily Karatoa","date":"16 April 2024","link":"https://www.ekaratoa.com/epaper/edition/1394/april/page/4","content":"বাংলাদেশে গত কয়েক বছর ধরে কিশোর অপরাধ চরম ভাবে বৃদ্ধি পাচ্ছে। সাধারণত কিশোর অপরাধের সাথে জড়িতদের বয়স ১৫ থেকে ১৭ এর মধ্যে হয়ে থাকে। অপরাধে জড়িতদের নেওয়া হচ্ছে, সংশোধনাগারে এবং প্রাপ্ত বয়স্ক না হওয়াতে তাদের বিরুদ্ধে কঠিন আইনি ব্যবস্থাও নেওয়া হচ্ছে না। সাধারণত তারা মাদকাসক্তি, মাদক চোরা চালান, ইভটিজিং, সন্ত্রাসী, গ্যাং তৈরি করে চলাফেরা করা, জমি দখল করার জন্য ভাড়া খাটা, হামলা, খুন, রাজনৈতিক মিটিল-মিছিলে গিয়ে ঝামেলা সৃষ্টি করা, ছেলে-মেয়ে অবাধ মেলামেশা, টাকার বিনিময়ে সামাজিক অপকর্মে জড়ানো সহ ইত্যাদি সামাজিক অপরাধে জড়িত থাকে। এছাড়াও সামাজিক যোগাযোগ মাধ্যম টিকটক ও লাইকি তেও এদের অসহনীয় কন্টেন্ট দেখা যায়, যার মাধ্যমে আরো অনেক কিশোরই কিশোর অপরাধের জন্য উৎসাহিত হয়। রাজধানী ঢাকাসহ পুরো বাংলাদেশে এদের উৎপাত রয়েছে। তবে ঢাকার মোহাম্মদপুর, মিরপুর, উত্তরা, ডেমরা ইত্যাদি স্থানে এদের উৎপাত অতিরিক্ত। সাধারণত বেশিরভাগ ক্ষেত্রেই রাজনৈতিক দলগুলোর প্রতিনিধিদের প্রতিনিধিত্বেই তারা অপরাধে জড়িত হতে উৎসাহিত হয়ে থাকে। যার দরুণ অপরাধীরা কারাগারে যাওয়ার কিছু দিনের মধ্যেই জামিনে বের হয়ে আবারো অপরাধ চালিয়ে যেতে থাকে। তাদের মধ্যে অপরাধে জড়িত হওয়ার পরেও নূন্যতম কোনো অপরাধবোধ কাজ করে না, তারা দ্বিধা করে না জেলে যাওয়া নিয়ে। রাজনৈতিক দলগুলোর সংশ্লিষ্টতা থাকাতে আইনশৃঙ্খলা রক্ষাকারী বাহিনীদের হাতে পরেও তারা খুব সহজেই জামিনে বের হয়ে আসছে। এভাবে কিশোর গ্যাংয়ের দৌরাত্ম্য বাড়তে থাকলে কেউই নিরাপদে চলাফেরা করতে পারবে না। \n\nপরিবারিক শিক্ষার অভাব, দুর্বল আইনী ব্যবস্থা, সামাজিক বিপর্যয়, মূল্যবোধের অবক্ষয়, জনপ্রতিনিধিদের অপরাধকে প্রশ্রয় দেওয়া, প্রযুক্তির অপব্যবহার, অর্থনৈতিক দুর্দশা, সঠিক দিক নির্দেশনার অভাব, বাবা মা থেকে বিচ্ছিন্ন হয়ে যাওয়া সহ ইত্যাদি কারণে কিশোররা সামাজিক অপরাধে জড়িয়ে যাচ্ছে। \n\nকিশোর অপরাধ দমনে রাষ্ট্র, সমাজ এবং ব্যক্তিগতভাবে সকলকে এগিয়ে আসতে হবে। রাষ্ট্রীয় ভাবে আইনী ব্যবস্থা কঠোর করতে হবে। সামাজিকভাবে গণসচেতনতা বৃদ্ধি করতে হবে, পারিবারিক শিক্ষায় ত্রুটি রাখা যাবে না, সন্তানদের সঠিক খোঁজ খবর নিতে হবে, পাঠ্যপুস্তকে মুল্যবোধ গঠনে নীতি-নৈতিকতা সম্বন্ধে নির্দেশনা দিতে হবে, অভিভাবকদের সচেতনতা বৃদ্ধি করতে হবে, জনপ্রতিনিধিদের এবং রাজনৈতিক ব্যক্তিত্বদের এই বিষয়ে বিশেষ ভাবে নজরদারি করতে হবে। এবং যেসব জনপ্রতিনিধিরা এদের প্রশ্রয় দেয় তাদের বিরুদ্ধে কঠোর ব্যবস্থা গ্রহণ করতে হবে। টিকটক ও লাইকি সহ যেসব সামাজিক যোগাযোগ মাধ্যমে এদের উসকানিমূলক কার্যক্রম দেখা যাবে, তাদের বিরুদ্ধে কঠোর ব্যবস্থা গ্রহণ করতে হবে দেশের অনলাইন পোর্টাল রক্ষণাবেক্ষণকারী আইন শৃঙ্খলা রক্ষাকারী বাহিনীকে। কিশোররা অপরাধে জড়িত হওয়ার পিছনে বাবা-মার সঠিক পরিচালনার অভাব ও অবহেলাও একটি বড় কারণ, তাই আদর্শ বাবা-মা হওয়ার জন্য বাবা-মাদের জন্য সঠিক কাউন্সিলিংয়ের করাতে হবে। ঢাকাসহ দেশের যেসব জায়গায় এদের দৌরাত্ম্য বেশি সেসব জায়গায় আইন শৃঙ্খলা রক্ষাকারী বাহিনীদের কঠোর অবস্থানে থাকতে হবে এবং সাদা পোশাক পরিহিত বাহিনীদের মাধ্যমে মনিটরিং করতে হবে। অপরাধে জড়িতদের সংশোধনাগারে নেওয়ার পাশাপাশি কাউন্সিলিং করাতে হবে, যাতে তারা পরবর্তীতে বের হওয়ার পরে আর অপরাধে না জড়ায়। \n\nআজকের শিশু-কিশোররাই আগামীর বাংলাদেশ। তাদের মাধ্যমেই তৈরি হবে ভবিষ্যতের স্বপ্নের অত্যাধুনিক বাংলাদেশ। তারা দেশের অমূল্য সম্পদ। তারা উচ্ছন্নে গেলে দেশের ভবিষ্যৎ হুমকির মুখে পড়বে। তাই কিশোর অপরাধ দমনে রাষ্ট্র, সরকার, আইন-শৃংখলা রক্ষাকারী বাহিনি, সামাজিক ও পারিবারিক সহ সকলকে ভাবে সকলকে এগিয়ে আসতে হবে।","img":""},{"id":"a18","bn":"পরিবার পরিকল্পনা","en":"Family Planning","paper":"Daily Jai Jai Din","date":"28 February 2024","link":"https://epaper.jaijaidinbd.com/?date=2024-02-28&page=6&news=06_104","content":"জীবনের সমস্যা, প্রতিকূল অবস্থা ও প্রস্তুতি, সুরক্ষা ও নিরাপত্তা, আর্থিক অবস্থা, স্বাস্থ্য, ভ্রমণ, সময় ব্যবস্থাপনা ও পারিবারিক যত্নসহ ইত্যাদি কারণে পরিবার পরিকল্পনা করা জরুরি।\n\nসঠিক পরিবার পরিকল্পনা করে পরিবারের সদস্যদের নিরাপত্তা এবং সুরক্ষা নিশ্চিত করা যায়। এবং ভবিষ্যতে সমস্যায় পরলে তা থেকে উঠে আসার উপায় পাওয়া যায়। পরিবারের অর্থনৈতিক অবস্থা স্বচ্ছল রাখার জন্যেও পরিবার পরিকল্পনা করা জরুরি। এছাড়াও পরিবারের সদস্যদের শারীরিক স্বাস্থ্যের জন্য যত্ন ও মানসিক স্বাস্থ্যের জন্য ভ্রমণ পরিকল্পনা করাও পরিবার পরিকল্পনার একটি অংশ।\n\nতবে বাংলাদেশে পরিবার পরিকল্পনা নিয়ে নানা সমস্যা রয়েছে। যা দেশের সামাজিক, আর্থিক, রাজনৈতিক এবং সাংস্কৃতিক দুর্দশার একটি প্রতিফলিত রূপ। পরিবার পরিকল্পনা না করে শিশু জন্মদানের কারণে অনেকক্ষেত্রেই সামাজিক ও আর্থিক সমস্যা হচ্ছে। টিনেজ মেয়েদের প্রেগন্যান্সির হার দেশের বিভিন্ন অঞ্চলে এখনো প্রচুর, যা সঠিক পরিবার পরিকল্পনা না করার একটি ফল। পরিবার পরিকল্পনার অভাবে অর্থনৈতিক অস্থিরতা, বেকারত্বসহ ইত্যাদি কারণে পরিবারে অর্থনৈতিক অবস্থা দূর্বল হয়ে পরছে। সঠিক পরিবার পরিকল্পনার অভাবে হতে পারে সামাজিক সম্পর্কের অভাব। এছাড়াও শিশুদের পড়াশোনা না করানো, পরিবারের সদস্যদের মধ্যে মিল বন্ধন না থাকা, হিংসা, নির্যাতনের মনোভাব এবং নারীদের সঠিক অধিকার থেকে বঞ্চিত হওয়াসহ আরো নানা সমস্যা হতে পারে সঠিক পরিবার পরিকল্পনার অভাবে। \n\nসঠিক শিক্ষা ও শিক্ষার হার বৃদ্ধির মাধ্যমেই সঠিক পরিবার পরিকল্পনা ছড়িয়ে দেওয়া সম্ভব। এবং সকলের অধিকার ও সুরক্ষায় সঠিক আইনি পদক্ষেপ প্রয়োগ করা, সামাজিক সচেতনতা বৃদ্ধি করা, সময় মেনে সময় মতো সকল কাজ করা, আর্থিক অবস্থা স্বচ্ছল রাখতে সরকারি ও বেসরকারি প্রতিষ্ঠানে যেকোনো কাজের প্রশিক্ষণ নেওয়া, সরকার ও জনকল্যাণমূলক সংস্থাগুলোর পরিবার পরিকল্পনা সেবা ছড়িয়ে দেওয়া, সামাজিক অবস্থা ও সংস্কৃতির বিকাশসহ ইত্যাদি মাধ্যমে সঠিক পরিবার পরিকল্পনা ছড়িয়ে দেওয়া সম্ভব।","img":""},{"id":"a17","bn":"ইবির অভ্যন্তরে ভাঙ্গা রাস্তা","en":"Broken Roads Inside IU Campus","paper":"Daily Kaler Kantho","date":"25 February 2024","link":"https://www.ekalerkantho.com/home/page/2024-02-25/6","content":"ইসলামী বিশ্ববিদ্যালয় (ইবি) কে আধুনিক বিশ্ববিদ্যালয় হিসেবে আখ্যায়িত করেছেন ইবির ভিসি অধ্যাপক ড শেখ আব্দুস সালাম। বিশ্ববিদ্যালয়কে আধুনিক করার পরেও ক্যাম্পাসের অভ্যন্তরে বিভিন্ন জায়গায় ভাঙ্গা রাস্তা দেখা যায়। তন্মধ্যে ক্যাম্পাসের কেন্দ্রীয় ক্যাফেটেরিয়ার সামনে থেকে সাদ্দাম হোসেন হলের মোড়ে এক বিশাল রাস্তার অংশ বহুদিন ধরে ভাঙ্গা রয়েছে, যা এক প্রকার মরণফাদ বলা যায়। মোড়ের অংশ ভাঙ্গা হওয়াতে অনেক ঝুঁকিপূর্ণভাবে গাড়ি মোড় নেয় এবং একইসাথে উভমুখী মোড় নিলে যেকোনো সময় দুর্ঘটনার বড় আশংকা রয়েছে। প্রতিদিন বিশ্ববিদ্যালয়ের গাড়ি গুলো এই ভাঙ্গা অংশের উপর দিয়ে খুবই ঝুঁকিপূর্ণভাবে মোড় নিয়ে থাকে। এছাড়াও ক্যাম্পাসের অভ্যন্তরে অনুষদের ভবনের সামনে, প্যারাডাইজ রোড থেকে দ্বিতীয় ফটক, প্যারাডাইজ রোড থেকে মফিজ লেক সহ আরো বিভিন্ন জায়গায় ভাঙ্গা রাস্তা রয়েছে। বিশ্ববিদ্যালয়ের সংশ্লিষ্ট কর্তৃপক্ষের সুদৃষ্টি আকর্ষণ করছি যাতে ক্যাম্পাসের অভ্যন্তরের সকল ভাঙ্গা রাস্তার সংস্কার কাজ সুসম্পন্ন করা হয়।","img":""},{"id":"a16","bn":"বাংলাদেশের নদী ও রেল লাইনের পাশের এলাকাগুলো বস্তি থেকে স্বস্তির হবে কবে?","en":"When Will Areas by Rivers and Railways Become Livable?","paper":"Daily Jai Jai Din","date":"18 February 2024","link":"https://epaper.jaijaidinbd.com/?date=2024-02-18&page=6&news=06_106","content":"বাংলাদেশের অধিকাংশ রেল লাইনের পাশের এলাকা গুলো এবং নদীপার অঞ্চল গুলো বস্তি এলাকা হয়ে থাকে। যেখানে বসবাস করে সকল মৌলিক অধিকার থেকে বঞ্চিত মানুষরা। মূলত খাদ্য, বস্ত্র, বাসস্থান, শিক্ষা ও চিকিৎসা এই সকল অধিকার গুলো মানুষের মৌলিক অধিকার হিসেবে আমরা ছোট থেকে পড়ে এসেছি। তবে এখনো দেশের বড় একটি অংশ এই মৌলিক অধিকার থেকে বঞ্চিত। তাদের থাকার নেই কোনো জায়গা, রয়েছে পুষ্টি যুক্ত খাদ্যের অভাব, বস্ত্রের অভাব, নেই অন্তত প্রাথমিক শিক্ষাও এবং তারা কেউই সঠিক ও সম্পূর্ণ চিকিৎসা সেবা পায় না। বাসস্থানের অভাবে তারা অবস্থান করে সরকারি জায়গাগুলোতে, নদী পার, রেল লাইনের পাশবর্তী জায়গা সহ ইত্যাদি স্থানে তারা মানবেতর জীবনযাপন করে থাকে। অর্থ, খাবার ইত্যাদির অভাবে তারা মানুষের কাছ থেকে ভিক্ষাবৃত্তি করছে। অনেকেই জড়িয়ে যাচ্ছে নেশার সাথে। অনেকেই জড়াচ্ছে ছিনতাই করা থেকে নানা রকম সামাজিক অপকর্মে। এছাড়াও নদীপার এলাকাগুলোতে দেহ ব্যবসার মতো নিকৃষ্ট কাজে জড়িত ব্যক্তিদেরও দেখা যায়। বস্তি এলাকাগুলো তে এলাকার অনেক ক্ষমতাশীল ব্যক্তিরা করছে চাঁদাবাজি। এছাড়াও চিকিৎসা সেবার অভাবে অনেকেই মারাত্মক রোগাক্রান্ত হয়েও চিকিৎসা পাচ্ছে না। বস্তি এলাকাগুলোতে জন্মানো শিশুরা ছোট থেকেই অবহেলায়, অপুষ্টিতে বেড়ে উঠছে। এমনকি তারা প্রাথমিক শিক্ষায়ও শিক্ষিত হচ্ছে না, যা দেশের ভবিষ্যত প্রজন্মের জন্য এক বড় ধরণের দূর্যোগ বয়ে আনছে। বস্তি এলাকার মানুষের পুনর্বাসনে সরকারি বা বেসরকারি উদ্যোগ একদম নেই বললেই চলে। এতে দিনে দিনে বাড়ছে বস্তি এলাকা এবং মৌলিক চাহিদা হতে বঞ্চিত মানুষ। এছাড়াও বস্তি এলাকাগুলোতে দিনে দিনে বাড়ছে বেআইনি কাজ ও অপকর্ম, যা হতে পারে একটি বড় ধরণের সামাজিক সমস্যা।\n\nতাই নদীপার, রেল লাইন ও অন্যান্য জায়গাগুলোতে বস্তি নিরসনে সরকারী পদক্ষেপ নেওয়া জরুরী হয়ে পরেছে। সঠিক পরিকল্পনা, সামাজিক সহিষ্ণুতা, মানবাধিকার নিশ্চিত করা, সকল সম্প্রদায়ের মানুষকে সমান সম্মান ও সহানুভূতি দেখানো, পুনর্বাসনে সরকারি ও বেসরকারি পদক্ষেপ নিশ্চিত করা, বস্তিবাসীদের সাথে যোগাযোগ বৃদ্ধি করা, সঠিক বাস্তুসংস্থান, সমাজের সকল জায়গায় সমানভাবে উন্নতি করার লক্ষ্যে সরকারের পদক্ষেপ নেওয়া, বস্তিবাসীদের আর্থিক সামর্থ্য বৃদ্ধিতে প্রশিক্ষণ দেওয়া, গণশিক্ষা ও সকল শিশু যাতে ছোট থেকে শিক্ষাগ্রহণ করতে পারে সেজন্য সামাজিক সচেতনতা বৃদ্ধি করা, বস্তিবাসীরা যাতে সঠিক চিকিৎসা সেবা পায় তা নিশ্চিত করা এবং সরকারি মেডিকেল গুলো তে সুযোগ সুবিধা বৃদ্ধি করাসহ বস্তিবাসীদের মধ্যে যাতে কোনো ধরণের আইন বিরোধী কাজ না হয় সেজন্য আইন-শৃঙ্খলা বাহিনীদের সর্বদা সোচ্চার থেকে বস্তি নিরসনে এবং বস্তির উন্নয়নে সব ধরণের সামাজিক ও রাষ্ট্রীয় পদক্ষেপ নেওয়া জরুরী।","img":""},{"id":"a15","bn":"প্রতি জেলায় পাবলিক বিশ্ববিদ্যালয়","en":"A Public University in Every District","paper":"Daily Bhorer Kagoj","date":"17 February 2024","link":"https://epaper.bhorerkagoj.net/city/2024/02/17/5","content":"বাংলাদেশে বর্তমানে প্রায় ৫৮ টি পাবলিক বিশ্ববিদ্যালয় রয়েছে। সকল পাবলিক বিশ্ববিদ্যালয়ের আসন সংখ্যা একত্রিত করা হলে আসন রয়েছে সর্বমোট প্রায় ৬০ হাজার। তন্মধ্যে সু-প্রতিষ্ঠিত প্রায় ৩০ টির মতো। বাকি সবগুলো নতুন এবং নির্মাণাধীন অবস্থায় রয়েছে। পুরাতন অধিকাংশ সহ নতুন সকল বিশ্ববিদ্যালয় গুলোতে রয়েছে আবাসন সংকট, শিক্ষক সংকটসহ নানা সমস্যা। পুরাতন এবং প্রতিষ্ঠিত বিশ্ববিদ্যালয় গুলোর সমস্যা সমাধান না করেই প্রতিবছর নতুন নতুন বিশ্ববিদ্যালয় স্থাপন করে যেন বোঝার পরিমাণ বৃদ্ধি করা হচ্ছে। ২০ই জুন, ২০২৩ ইং তারিখের সংসদ অধিবেশনে শিক্ষামন্ত্রী প্রতিটি জেলায় একটি করে পাবলিক বিশ্ববিদ্যালয় এবং প্রতিটি বিভাগে একটি করে মেডিকেল বিশ্ববিদ্যালয় স্থাপনের কথা জানান। পুরাতন বিশ্ববিদ্যালয় গুলোর সকল সমস্যা সমাধান না করে নতুন বিশ্ববিদ্যালয় স্থাপন করে সমস্যার পরিমাণ বৃদ্ধিই করা হচ্ছে। বিভিন্ন বিশ্ববিদ্যালয়ের আবাসন সংকট, শিক্ষক সংকট, ক্লাসরুম সংকটসহ সকল সমস্যা সমাধান করা অতিসত্তর জরুরি। পুরাতন বিশ্ববিদ্যালয় গুলোর সমস্যা সমাধান করেই তবে নতুন বিশ্ববিদ্যালয় স্থাপন করা উচিত হবে। তাই বিশ্ববিদ্যালয় মঞ্জুরি কমিশনসহ সংশ্লিষ্ট কর্তৃপক্ষকে এ বিষয়ে দৃষ্টি দেওয়ার জন্য বিশেষভাবে অনুরোধ করছি।","img":""},{"id":"a14","bn":"সমস্যায় পরিপূর্ণ ইসলামী বিশ্ববিদ্যালয়","en":"Islamic University Full of Problems","paper":"Daily Share Biz","date":"15 February 2024","link":"https://www.facebook.com/photo/?fbid=2273048989737393&set=pcb.2273049493070676","content":"আয়তনে বাংলাদেশের সপ্তম বৃহত্তম এবং স্বাধীনতার পর স্থাপিত বাংলাদেশের সর্বপ্রথম পাবলিক বিশ্ববিদ্যালয় ইসলামী বিশ্ববিদ্যালয় (ইবি)। স্থাপিত হওয়ার ৪৪ বছরেও অসংখ্য সমস্যায় জর্জরিত ইবি। বিশ্ববিদ্যালয় নিয়ে শিক্ষার্থীদের অভিযোগ যেন শেষ হতে চায় না। শিক্ষার্থীদের অভিযোগ এবং বিশ্ববিদ্যালয়ের সকল সমস্যার মধ্যে কিছু সমস্যা তুলে ধরা-\n\n১। ক্যাফেটেরিয়াঃ ইবির ক্যাফেটেরিয়া বন্ধ আছে আজ প্রায় এক বছর ধরে। সীমিত আসন, অসুন্দর ডেকোরেশন, খাবারের নিম্নমান, খাবারের অতিরিক্ত দামসহ ইত্যাদি সমস্যায় পূর্ণ ইবির ক্যাফেটেরিয়া। সর্বশেষ ঠিকাদার জটিলতার কারণে বন্ধ হয় এটি। \n\n২। গ্রন্থাগারঃ ক্লাস চলাকালীন ব্যতীত গ্রন্থাগার বন্ধ রাখা, অপর্যাপ্ত আসন, ধীরগতি সম্পন্ন ইন্টারনেট, ই-লাইব্রেরী না থাকা, বইয়ের ঘাটতি সহ নানা সমস্যায় শিক্ষার্থীদের অভিযোগের তালিকায় ইবির গ্রন্থাগার। \n\n৩। ফোয়ারাঃ প্রায় ৩ বছরের অধিক সময় ধরে বন্ধ আছে ইবির \"সততা ফোয়ারা\"। বিশেষ দিনগুলোতেও বন্ধ থাকে এটি। নেই সংস্কারের জন্য কোনো ব্যবস্থা। \n\n৪। সামাজিক যোগাযোগ মাধ্যমে নিষ্ক্রিয়তাঃ ইবি কে ডিজিটাল বিশ্ববিদ্যালয় করার পর স্মার্ট করার দাবি থাকলেও এখনো কোনো সামাজিক যোগাযোগ মাধ্যমেই ইবির কোনো ভেরিফাইড একাউন্ট নেই। গুরুত্বপূর্ণ নোটিশ, বিজ্ঞাপন, প্রচার-সম্প্রচার, প্রতিবেদন, খবরাখবর দ্রুত শিক্ষার্থী, কর্মকর্তা ও অন্যান্য সকলকে জানানো, গুজব রটানো থেকে বিরত থাকা, সঠিক তথ্যসূত্র যুক্ত তথ্য নিশ্চিতের জন্য, বহির্বিশ্বে বিশ্ববিদ্যালয়ের কার্যকলাপ, ঐতিহ্য, প্রাপ্তি, গুণাবলি তুলে ধরার জন্য, বিশ্ববিদ্যালয় এবং বিশ্ববিদ্যালয়ের শিক্ষার্থীদের সকল অর্জন সকলের কাছে একযোগে ছড়িয়ে দেওয়ার জন্যসহ অনেক কারণেই প্রতিটি শিক্ষা প্রতিষ্ঠানের সামাজিক যোগাযোগ মাধ্যমে সক্রিয় থাকা অবশ্যই জরুরী। \n\n৫। জিমনেসিয়ামঃ ক্লাস চলাকালীন দিন ব্যতীত জিমনেসিয়াম বন্ধ রাখা, অকেজো ও মরিচাযুক্ত ব্যবহারের অনুপযোগী সরঞ্জাম, জিম ট্রেইনার না থাকা, অপর্যাপ্ত জিম সরঞ্জামসহ আরো নানা কারণে জিমনেসিয়াম তার সৌন্দর্য হারিয়েছে। নেই জিম উন্নয়নের জন্য কোনো প্রকার ব্যবস্থা। \n\n৬। পোষ্য কোটায় ভর্তিঃ প্রতি বছর স্নাতক শ্রেণিতে ভর্তির সময় পোষ্য কোটায় অযোগ্য শিক্ষার্থীদের ভর্তি নেওয়া ইবির সকল সমস্যার মধ্যে একটি। যা বিশ্ববিদ্যালয়ের নাম ও মান উভয় খারাপ করার জন্য যথেষ্ঠ।\n\n৭। ভাঙ্গা রাস্তাঃ বিশ্ববিদ্যালয়ের অভ্যন্তরে বিভিন্ন জায়গায় রাস্তা ভাঙ্গা। যা খুবই ঝুঁকিপূর্ণ। বিশেষত, টিএসসির সামনে থেকে সাদ্দাম হোসেন হলের দিকে যে মোড় নিয়েছে, সেই মোড়ের অংশের রাস্তা ভাঙ্গা যা অন্তন্ত ঝুঁকিপূর্ণ এবং প্রতিদিন বাস চলাচলের সময় অসুবিধার সম্মুখীন হয়। এছাড়াও অনুষদের ভবনের সামনে, প্যারাডাইজ রোড থেকে দ্বিতীয় ফটক, প্যারাডাইজ রোড থেকে মফিজ লেক সহ আরো বিভিন্ন জায়গায় ভাঙ্গা রাস্তা রয়েছে।\n\n৮। হলের নিম্ন মানের খাবারঃ বিশ্ববিদ্যালয়ের সকল হল গুলোতেই খাবারের মান খুবই খারাপ। যা শিক্ষার্থীদের স্বাস্থ্যের জন্য খুবই ক্ষতিকর। রয়েছে পরিষ্কার-পরিচ্ছন্নতার অভাব।\n\n৯। ল্যাবরেটরি স্কুল এন্ড কলেজঃ ইসলামী বিশ্ববিদ্যালয় ল্যাবরেটরি স্কুল এন্ড কলেজ নির্মাণাধীন আছে বহুদিন ধরেই। নেই যথেষ্ঠ প্রয়োজনীয় শিক্ষক। সঠিক পরিচালনার অভাবে পড়াশোনার নিম্ন মান সহ নানা কারণে শিক্ষার্থীদের আগ্রহ হারাচ্ছে এই প্রতিষ্ঠান। \n\n১০। কেন্দ্রীয় মসজিদঃ প্রায় দুই যুগের বেশি সময় ধরে চলছে কেন্দ্রীয় মসজিদের নির্মাণ কাজ। যা এখনো শেষ হয় নি। মসজিদে নেই পর্যাপ্ত সাউন্ড সিস্টেম। সংস্কারে নেই কোনো উদ্যোগ। \n\n১১। সুপেয় পানিঃ ইবির ফুটবল মাঠের আশেপাশে নেই সুপেয় পানির ব্যবস্থা। শিক্ষার্থীরা খেলাধুলা শেষে ক্লান্ত অবস্থায় পানির সন্ধানে যেতে হয় বহুদূর।\n\n১২। আবর্জনাঃ ক্যাম্পাসে যত্রতত্র ময়লা- আবর্জনা থাকার কারণে ইবির সৌন্দর্য হচ্ছে ক্ষুন্ন। ময়লা আবর্জনা পরিষ্কার করার জন্য কর্তৃপক্ষের যথাযথ নেই কোনো উদ্যোগ।\n\n\nএছাড়াও বিভিন্ন বিভাগে সেশন জট, শিক্ষার্থীরা সম্পূর্ণ আবাসিকতা না পাওয়া, ফি জমাদানে অনলাইন সেবা পুরোপুরি ভাবে চালু না হওয়া, ধীরগতি সম্পন্ন নির্মাণাধীন কাজ, চিকিৎসা কেন্দ্রে যথাযথ সকল রোগের চিকিৎসা ও ঔষধ না থাকাসহ আরো নানা সমস্যায় পরিপূর্ণ ১৭৫ একরের ইবি।\n\nপ্রশাসনের বিশেষ সু- দৃষ্টি কামনা করছি যেন, শিক্ষক- শিক্ষার্থীর সকল সুযোগ সুবিধার কথা বিবেচনা করে এবং দেশ এবং বিশ্ব পর্যায়ে বিশ্ববিদ্যালয়ের মান উঁচু করতে বিশ্ববিদ্যালয়ের উন্নয়নে এবং সকল সমস্যা দূরীকরণে সকল ধরণের পদক্ষেপ গ্রহণ করার জন্য বিশেষভাবে অনুরোধ করছি।","img":""},{"id":"a13","bn":"বিশ্বের কোথায় ধর্ষণের শাস্তি কেমন","en":"What Are the Punishments for Rape Around the World","paper":"Daily Jai Jai Din","date":"13 February 2024","link":"https://epaper.jaijaidinbd.com/?date=2024-02-13&page=13&news=13_104","content":"পারিবারিক শিক্ষার অভাব, অসুস্থ মন মানসিকতা ও ভাবনা, দুর্বল আইনকানুন সহ নানা ধরণের মূল্যবোধের অবক্ষয়ের কারণে আমাদের সমাজে, রাষ্ট্রে এবং পৃথিবীতে প্রতিনিয়ত নিকৃষ্ট কাজ বেড়েই চলেছে। তন্মধ্যে ধর্ষণ একটি, যা প্রতিনিয়ত বিভিন্ন দেশে দেশে পালাক্রমে বেড়েই চলেছে। \n\nজেনে নেওয়া যাক পৃথিবীর কোন দেশে ধর্ষণের শাস্তি কেমন:\n\nযুক্তরাষ্ট্র: বিশ্বের সবচেয়ে শক্তিধর রাষ্ট্র যুক্তরাষ্ট্রে সর্বোচ্চ শাস্তি যাবজ্জীবন কারাদন্ড থেকে বিভিন্ন অঙ্গরাজ্যে বিভিন্ন শাস্তি রয়েছে। \n\nসৌদি আরব: সৌদি আরবে ধর্ষণের সর্বোচ্চ শাস্তি শিরচ্ছেদের মাধ্যমে মৃত্যু।\n\nসংযুক্ত আরব আমিরাত: উক্ত রাষ্ট্রে শাস্তি হিসেবে রায়ের সাত দিনের মধ্যে ফাঁসি কার্যকর করা হয়।\n\nআফগানিস্তান: রায়ের চার দিনের মধ্যে আসামীর মাথায় গুলি করে মৃত্যুর মাধ্যমে রায় কার্যকর করা হয়।\n\nমিশর: জনসম্মুখে ফাঁসি দিয়ে ধর্ষকের মৃত্যুদন্ড দেওয়া হয়। \n\nইরান: ধর্ষককে ফাঁসিতে ঝুলিয়ে অথবা গুলি করে মৃত্যুদণ্ড কার্যকর করা হয়। কখনো ধর্ষিতার অনুমতি নিয়ে ১০০ দোররা বা যাবজ্জীবন শাস্তি নিশ্চিত করা হয়।\n\nচীন: চীনে ধর্ষকের যৌনাঙ্গ কেটে দেওয়া হয় অথবা মৃত্যুদণ্ড দেওয়া হয়।\n\nগ্রিস: ধর্ষককে আগুনে পুড়িয়ে মৃত্যুদণ্ড দেওয়া হয়। \n\nউত্তর কোরিয়া: ধর্ষককে গুলি করে মৃত্যুদণ্ড দেওয়া হয়।\n\nভারত: ভারতে ধর্ষকের সর্বোচ্চ শাস্তির বিধান মৃত্যুদণ্ড থাকলেও বেশিরভাগ ক্ষেত্রে ৭ থেকে ১৪ বছরের কারাদন্ড দেওয়া হয়। \n\nনরওয়ে ও ইসরায়েল: উক্ত রাষ্ট্র গুলোতে ৪ থেকে ১৫ এবং ৪ থেকে ১৬ বছরের কারাদন্ডের শাস্তির বিধান রয়েছে। \n\nবাংলাদেশ: বাংলাদেশে ১৭ই নভেম্বর ২০২০ এ ধর্ষকের সর্বোচ্চ শাস্তি মৃত্যুদণ্ডের আইন পাস করা হয়।\n\nপরিসংখ্যান:\n\nপুলিশ সদর দপ্তরের হিসাব অনুযায়ী, ২০১৮ সালে তিন হাজার ৯৪৯টি, ২০১৯ সালে পাঁচ হাজার ৮৭২টি, ২০২০ সালে ছয় হাজার ৫৫৫টি ও ২০২১ সালে ছয় হাজার ৩৪১টি ধর্ষণের মামলা করা হয়েছে।\n\nএদিকে গত পাঁচ বছরে রাজধানী ঢাকায় তিন হাজার ৪২টি ধর্ষণ মামলা করা হয়েছে। এর মধ্যে নারী দুই হাজার ৪৭০ জন এবং শিশু ৫৭২ জন। ২০২২ সালের জানুয়ারি থেকে ডিসেম্বর পর্যন্ত ধর্ষণ মামলা হয়েছে ৫২৩টি। এর মধ্যে নারী ৪৩০ জন এবং শিশু ৯৩ জন।\n\nঢাকা মহানগর পুলিশের (ডিএমপি) প্রতিবেদন থেকে এসব তথ্য জানা যায়। \n\nতাই ধর্ষণ সহ সব ধরণের সামাজিক সমস্যা দূরীকরণে আমাদের সমাজের সকল সচেতন নাগরিকদের একত্রিত হয়ে কাজ করতে হবে এবং আইনের সঠিক বাস্তবায়ন নিশ্চিত করতে হবে।","img":""},{"id":"a12","bn":"বন্ধু হলো জীবনের এক অমূল্য উপহার","en":"A Friend is an Invaluable Gift of Life","paper":"Daily Ittefaq","date":"02 February 2024","link":"https://epaper.ittefaq.com.bd/edition/1121/1st-edition/page/8","content":"মানুষ সামাজিক জীব। একা একা জীবন কাটানো তার পক্ষে সম্ভব নয়। তাই মানুষের জীবনে বন্ধুত্বের গুরুত্ব অপরিসীম। বন্ধুত্ব মানুষের জীবনকে সুখী, সমৃদ্ধ ও অর্থবহ করে তোলে। বন্ধুত্বের মাধ্যমে মানুষ একাকিত্ব কাটিয়ে উঠতে পারে। বন্ধুরা আমাদের সুখ-দুঃখ, হাসি-কান্না, আনন্দ-বেদনার অংশীদার হয়। তারা আমাদের মনের ভাবনা-চিন্তা, আশা-আকাঙ্ক্ষা, স্বপ্ন-সৌন্দর্যকে শেয়ার করতে সাহায্য করে। বন্ধুদের সাথে আড্ডা, গল্প-গুজব, খেলাধুলা, ভ্রমণ ইত্যাদি করে মানুষ জীবনকে উপভোগ করতে পারে। বন্ধুত্ব মানুষের সামাজিকীকরণে গুরুত্বপূর্ণ ভূমিকা পালন করে। বন্ধুদের মাধ্যমে মানুষ নতুন নতুন বিষয়ে জানতে পারে, নতুন নতুন মানুষের সাথে পরিচিত হতে পারে এবং নতুন নতুন অভিজ্ঞতা লাভ করতে পারে। বন্ধুত্ব মানুষের আত্মবিশ্বাস বৃদ্ধিতেও সাহায্য করে। বন্ধুদের সমর্থন ও সহযোগিতা পেয়ে মানুষ নতুন নতুন কিছু করার সাহস পায়।\n\nজীবনে বন্ধু নির্বাচন করা খুবই গুরুত্বপূর্ণ। একজন ভালো বন্ধু একজনের জীবনকে সুন্দর করে তোলে। তাই ভালো বন্ধু নির্বাচনের ক্ষেত্রে কিছু বিষয় মাথায় রাখা উচিত। একজন ভালো বন্ধু হবে বিশ্বস্ত, সহানুভূতিশীল, সৎ, ন্যায়পরায়ণ ও ইতিবাচক চিন্তাভাবনার অধিকারী। সে আমাদের কথা গোপন রাখবে এবং আমাদের বিশ্বাস ভঙ্গ করবে না, আমাদের দুঃখ-কষ্ট বুঝতে পারবে, আমাদের পাশে থাকবে, মিথ্যা বলবে না, আমাদের ন্যায়সঙ্গত অধিকার রক্ষা করবে এবং আমাদেরকে ভালোবাসা, সম্মান ও উৎসাহ দেবে।\n\nবন্ধুদের প্রতি আমাদের কর্তব্য হলো তাদের প্রতি সৎ ও বিশ্বস্ত থাকা, সুখ-দুঃখ, হাসি-কান্না, আনন্দ-বেদনায় তাদের পাশে থাকা, তাদের সমস্যায় তাদের সাহায্য করা, ভালোবাসা ও সম্মান দেওয়া, আশা-আকাঙ্ক্ষা পূরণে সহায়তা করা এবং তাদের উন্নতি ও সাফল্যে আনন্দিত হওয়া।\n\nবন্ধুত্ব একটি মূল্যবান সম্পর্ক। একজন ভালো বন্ধু জীবনকে সুন্দর ও সমৃদ্ধ করে তোলে। তাই আমাদের উচিত ভালো বন্ধু নির্বাচন করা এবং তাদের প্রতি কর্তব্য পালন করা।","img":""},{"id":"a11","bn":"শৌচাগারে মোবাইল চালানোর অপকারিতা","en":"The Harms of Using Mobile in the Bathroom","paper":"Daily Sangbad","date":"18 February 2024","link":"https://epaper.sangbad.net.bd/2024-02-18/6/%E0%A6%B8%E0%A6%AE%E0%A7%8D%E0%A6%AA%E0%A6%BE%E0%A6%A6%E0%A6%95%E0%A7%80%E0%A7%9F","content":"আমাদের দৈনন্দিন জীবনে বিভিন্ন কারণে আমরা প্রয়োজনের থেকেও অতিরিক্ত মোবাইল চালিয়ে থাকি। যা আমাদের শারীরিক ও মানসিক স্বাস্থ্যের জন্য অত্যন্ত ক্ষতিকরও হতে পারে। তবে দৈনন্দিন জীবনে অনেকেই মোবাইলে অতিরিক্ত আসক্ত হওয়ার কারণে শৌচাগারেও মোবাইল নিয়ে থাকি। শৌচাগারে মোবাইল চালানোর অসংখ্য ক্ষতিকর দিক রয়েছে। তন্মধ্যে, চোখের সমস্যা হওয়া, ব্যাকটেরিয়ার সংক্রমণ, অতিরিক্ত সময় ব্যয়, খারাপ আসক্তি হওয়া ইত্যাদি রয়েছে। শৌচাগারে সাধারণত কম আলো থাকে যার দরুণ শৌচাগারে মোবাইল চালালে মোবাইলের অতি বেগুণী রশ্মি আমাদের চোখের ক্ষতি করতে পারে। এছাড়াও শৌচাগার ব্যাকটেরিয়ার একটি জনপ্রিয় ক্ষেত্র। শৌচাগারে মোবাইল ব্যবহারের ফলে মোবাইলে ছড়িয়ে যেতে পারে মারাত্মক ভাইরাস-ব্যাকটেরিয়া। যার পরবর্তীতে ফোনের মাধ্যমে খারাপ রোগের সংক্রমণ ছড়িয়ে যেতে পারে। এছাড়াও অতিরিক্ত সময় ব্যয় হতে পারে শৌচাগারে মোবাইল ব্যবহারের মাধ্যমে। প্রয়োজনের অতিরিক্ত সময় শৌচাগারে বসে থাকলে হতে পারে অর্শ্ব, গেজ, পাইলসের মতো খারাপ রোগ। যেসব রোগের এখনো কোনো স্থায়ী চিকিৎসা বের হয় নি। \n\nতাই সবধরণের ক্ষতিকর দিক এবং রোগ-ব্যাধী থেকে বেঁচে থাকাসহ স্বাস্থ্য সচেতনতার জন্য শৌচাগারে মোবাইল চালানো থেকে সকলের সম্পূর্ণভাবে বিরত থাকা উচিত।","img":""},{"id":"a10","bn":"বন্ধ হোক পোষ্য কোটা","en":"The Dependent Quota Must End","paper":"Daily Bhorer Kagoj","date":"22 January 2024","link":"https://epaper.bhorerkagoj.net/city/2024/01/22/5","content":"বাংলাদেশে কলেজে ভর্তি থেকে বিশ্ববিদ্যালয় ভর্তি পরীক্ষা এবং সরকারি চাকরিক্ষেত্র পর্যন্ত ২৫৮ টি কোটা সুবিধা রয়েছে। তন্মধ্যে বিশ্ববিদ্যালয় ভর্তিতে পোষ্যকোটা একটি। পোষ্যকোটা হলো সেই কোটা যে কোটার মাধ্যমে বিশ্ববিদ্যালয়ের কর্মরত কর্মচারী, কর্মকর্তা এবং শিক্ষকমণ্ডলীদের সন্তান-সন্ততীরা কোটা সুবিধা পেয়ে থাকে। কোটা মূলত প্রতিবন্ধী, বিশেষচাহিদা সম্পন্ন, সুযোগ সুবিধা থেকে বঞ্চিত (নৃগোষ্ঠী) দের জন্য প্রযোজ্য হয়ে থাকে। কিন্তু বিশ্ববিদ্যালয়ের কর্মরত শিক্ষকমন্ডলী, কর্মকর্তা, কর্মচারীদের সন্তানরা কোনোভাবেই কোনো প্রকার সুযোগ সুবিধা থেকে বঞ্চিত নয়। গত ২০২২-২৩ শিক্ষাবর্ষে অনেক বিশ্ববিদ্যালয় ভর্তিতে পোষ্যকোটায় শিক্ষার্থী ভর্তি নিয়ে থাকে। পোষ্যকোটা থাকাতে অনেক ক্ষেত্রেই ভর্তি পরীক্ষায় পাশ না করার পরেও শিক্ষার্থী ভর্তি নেওয়া হয় যার দরুণ অনেকেই ভালো নাম্বার পেয়েও চান্স পায় না। ২০২২-২৩ শিক্ষাবর্ষে ইসলামী বিশ্ববিদ্যালয়ে পোষ্যকোটায় ভর্তি নেওয়ার জন্য অনেক কর্মকর্তা, কর্মচারী দফায় দফায় কর্ম বিরতি চালায়। তাই সঠিক মেধার মূল্যায়নের জন্য পোষ্যকোটা বন্ধের জন্য সকল বিশ্ববিদ্যালয় এবং বিশ্ববিদ্যালয় মঞ্জুরি কমিশনের সু-দৃষ্টি কামনা করছি।","img":""},{"id":"a09","bn":"তরুণদের চোখে আগামীর বাংলাদেশ","en":"Bangladesh of Tomorrow Through the Eyes of Youth","paper":"Daily Karatoa","date":"23 March 2024","link":"https://www.ekaratoa.com/epaper/edition/1376/march/page/4","content":"বাংলাদেশের তরুণ সমাজ আগামীর বাংলাদেশকে একটি আলোর ছবি হিসেবে দেখতে পায়। তাদের চোখে আগামীর বাংলাদেশ একটি মহান অনুভূতি নিয়ে পূর্ণতা প্রদর্শন করবে। তরুণরা বর্তমান বাংলাদেশের প্রযুক্তি, সমাজ, বিজ্ঞান ও সাংস্কৃতিক পরিবর্তনে সহায়তা করে বাংলাদেশকে ভবিষ্যতে একটি আদর্শ রাষ্ট্র হিসেবে গড়ে তুলতে পারে।\n\nবাংলাদেশ একটি সুন্দর দেশ, যেখানে প্রাকৃতিক সৌন্দর্য, ঐতিহাসিক ঐক্য এবং মানবিক বিনয় একত্রিত রয়েছে। তবে, এই দেশের উন্নতি ও সমৃদ্ধি এখনো অপেক্ষমান। এই অপেক্ষার পেছনে তরুণদের প্রশাসনিক দক্ষতা, উদ্যম এবং সমাজের প্রতি দায়িত্বশীলতা অনেকটাই গুরুত্বপূর্ণ। তরুণদের চোখে আগামীর বাংলাদেশ হলো একটি প্রগতিশীল দেশ, যেখানে শিক্ষা, প্রযুক্তি ও নৈতিকতা সমানভাবে উন্নত হচ্ছে। প্রযুক্তিতে নতুন উদ্ভাবন ও প্রযুক্তির অগ্রগতির মাধ্যমে তাদের মতামত ও উদ্যোগের প্রতি সমর্থন দেওয়া হচ্ছে। সেই সাথে, শিক্ষার মাধ্যমে তারা নৈতিক এবং সামাজিক মর্যাদা বজায় রাখতে পারছে।\n\nএকটি প্রগতিশীল বাংলাদেশ তরুণদের চোখে অর্থবান ও পরিবেশবাদী হবে। সাথে সাথে বাংলাদেশ প্রযুক্তিতে নতুন উদ্ভাবন ও উন্নতির সাথে তাল মিলিয়ে চলছে, যা একটি উচ্চমানের অর্থনীতি, বাস্তু সংস্কৃতির প্রতি সতর্কতা এবং পরিবেশের সমৃদ্ধির প্রতি গভীর সংশ্রয় দেখায়। তরুণদের চোখে আগামীর বাংলাদেশ হলো একটি সাহসী, প্রযুক্তিবাদী এবং সমৃদ্ধ দেশ যেখানে প্রতিটি নাগরিকের স্বপ্ন ও মূল্যবান কার্যক্রমের প্রতি সমান মৌলিক অধিকার রয়েছে।\n\nতরুণদের চোখে আগামীর বাংলাদেশ একটি সুন্দর, প্রগতিশীল, অর্থবান, পরিবেশবাদী এবং সমৃদ্ধ দেশ। তরুণদের প্রশাসনিক দক্ষতা, উদ্যম এবং সমাজের প্রতি দায়িত্বশীলতা এই দেশের উন্নতি ও সমৃদ্ধির জন্য অপরিহার্য।\n\n\nতবে বাংলাদেশের উন্নতির জন্য তরুণদের অনেক পদক্ষেপ নেওয়া উচিত। কিছু প্রধান পদক্ষেপ নিম্নে তুলে ধরা হলো:\n\n১। শিক্ষার প্রসারঃ তরুণদের শিক্ষার প্রসার এবং বিশেষভাবে প্রযুক্তি ও বিজ্ঞানের মাধ্যমে তাদের প্রশিক্ষণ দেওয়া। নতুন বিষয়গুলোতে তাদের উৎসাহিত করা যাতে তারা নতুন প্রযুক্তি উদ্ভাবন ও প্রয়োগ করতে উৎসাহিত হয়।\n\n২। উদ্যোগ ও উদ্যোগশীলতাঃ তরুণদেরকে নতুন নতুন উদ্যোগ নিতে উৎসাহিত করা উচিত। নতুন নতুন বিষয়ে প্রযুক্তির ব্যবহার সুনিশ্চিত করা উচিত।\n\n৩। উদ্যোগের জন্য সাহায্যঃ তরুণদের নতুন নতুন উদ্যোগের জন্য ব্যবসায়িক, আর্থিক এবং প্রকৌশলগত সাহায্য প্রদান করা উচিত। এবং সরকার ও বিভিন্ন প্রতিষ্ঠানের উচিত তাদের এ বিষয়ে সর্বোচ্চ সহযোগিতা করা। \n\n৪। সামাজিক সংশ্লিষ্টতাঃ তরুণদের মধ্যে সমাজের নীতি নির্ধারক হিসেবে আদর্শ থাকা উচিত। তাদেরকে সামাজিক দায়িত্বের প্রতি উৎসাহ ও সমর্থন দেওয়া উচিত।\n\n৫। পরিবেশ সংরক্ষণঃ তরুণদের সচেতনতা ও দায়িত্বের দিক থেকে পরিবেশ সংরক্ষণে সব ধরণের পদক্ষেপ গ্রহণ করা উচিত।\n\n৬। দূরশিক্ষা ও কর্মসংস্থানঃ তরুণদের জন্য দূরশিক্ষা সুবিধা প্রদান করা উচিত এবং তাদের উদ্যোগের মাধ্যমে কর্মসংস্থানের ব্যবস্থা করা উচিত।\n\n৭। দুর্নীতির বিরুদ্ধে রুখে দাঁড়ানোঃ সকল প্রকার দুর্নীতি থেকে নিজেদের রক্ষা করে যারা দুর্নীতি করে তাদের দমনে সকলে একত্রিত হয়ে কাজ করা। \n\nবর্তমানে বাংলাদেশের তরুণদের বড় সমস্যা হচ্ছে বেকারত্ব। \n\nবেকারত্ব নিরসনে তরুণদের কিছু পদক্ষেপ নেওয়া যেতে পারে:\n\n১। কাজের দক্ষতা ও প্রশিক্ষণঃ তরুণদের কাজের দক্ষতা বৃদ্ধি করার জন্য বিভিন্ন ধরণের কাজের প্রশিক্ষণ নেওয়া উচিত। তরুণদের উচিত পড়াশোনার পাশাপাশি অন্যান্য যেকোনো কাজে দক্ষ হয়ে উঠা।\n\n২। উদ্যোগশীলতা ও ব্যবসা কর্মকলাঃ তরুণদের উদ্যোগের জন্য সরকার ও বিত্তবানদের সাহায্য প্রদান করা উচিত, যাতে তারা তাদের ব্যবসা কর্মকলা শুরু করতে পারে।\n\n৩। প্রবৃদ্ধি ও প্রতিষ্ঠান সৃষ্টিঃ তরুণদের প্রবৃদ্ধি করার জন্য তাদের জন্য সুযোগ তৈরি করা যেতে পারে যাতে তারা নতুন ব্যবসা প্রতিষ্ঠা করতে পারে।\n\n৪। কর্মসংস্থান ও সরকারের প্রোগ্রামঃ সরকার বা প্রাইভেট সেক্টরের কর্মসংস্থান প্রোগ্রাম প্রদান করে তরুণদের উন্নতি করতে সহযোগিতা করা। \n\n৫। উদ্যোগ সমর্থনঃ তরুণদের উদ্যোগের জন্য সরকার ও ব্যবসায়িক সংস্থার সমর্থন ও অনুমোদন সহজতর করা। \n\n৬। প্রশাসনিক সুবিধা ও তথ্য প্রদানঃ তরুণদের জন্য প্রশাসনিক সুবিধা এবং তথ্য প্রদান করে তাদের ব্যবসা পরিচালনা করতে সহযোগিতা করা। \n\nএই পদক্ষেপগুলো তরুণদের বেকারত্ব নিরসনে সহায়তা করতে পারে। তবে, এই ধরনের পদক্ষেপে সরকার, প্রাইভেট সেক্টর এবং সমাজের মধ্যে সমন্বয় ও সমর্থন প্রয়োজন।\n\nভবিষ্যতের বাংলাদেশ যেন তরুণদের চোখে প্রত্যক্ষ হয়, সেই জন্য দল, মত, নির্বিশেষে সকলকে একইসাথে কাজ করতে হবে।","img":""},{"id":"a08","bn":"প্রবীণরা অবহেলার স্বীকার না হোক","en":"The Elderly Must Not Be Neglected","paper":"Daily Ittefaq","date":"25 February 2024","link":"https://epaper.ittefaq.com.bd/edition/1168/1st-edition/page/9","content":"মানুষের জীবনকালের একটি বড় অংশ জুড়ে রয়েছে বার্ধক্যের সময়। বিশ্বের অধিকাংশ দেশগুলোতে ৮০ বছরের বেশি বয়সকে বার্ধক্যের সময় ধরা হলেও বাংলাদেশে ৬০ বছরের অধিক বয়সকে বার্ধক্যের সময় ধরা হয়। বাংলাদেশ সরকারের হিসেবে, বর্তমানে দেশে ১ কোটি ৫০ লাখের অধিক প্রবীণ রয়েছে। যেটির সংখ্যা ২০২৫ এ ১ কোটি ৮০ লাখ এবং ২০৫০ এ ৪ কোটি ৫০ লাখ ছাড়াবে। বার্ধক্য হলো সেই সময়, যে সময় থেকে মানুষের শারীরিক দুর্বলতা এবং রোগব্যাধি মানুষকে মারাত্মক ভাবে গ্রাস করে এবং তাদের পক্ষে একা চলা বা একা সব কাজ করা সম্ভব হয়ে উঠে না আর। ফলে তাদের যত্নে, দেখাশোনায় সর্বদা কারো সহযোগিতার প্রয়োজন হয়। বার্ধক্যতে একজন ব্যক্তির পক্ষে আর কঠিন পরিশ্রমের কাজ করা সম্ভব হয়ে উঠে না। যার দরুণ তাদের উপার্জন করা ছেড়ে দিতে হয়। বার্ধক্য কালে শরীরে দেখা দেয় নানা রোগ, মাংসপেশির দুর্বলতা, রক্তচাপ,  কমে যায় রোগ প্রতিরোধ ক্ষমতা, শরীরের শক্তি ও সবলতা। এছাড়াও এই বয়সে ডিপ্রেশন, স্মৃতিহারা সহ ইত্যাদি মানসিক সমস্যা দেখা দেয়। প্রবীণ বয়সে অনেকেই নিজের সঙ্গী বা সঙ্গিনী কে হারিয়ে মানসিকভাবে ভেঙ্গে পরে। বার্ধক্য কালে অনেকেই অভাবের তাড়নায় ভারী ও কঠিন কাজ করে থাকে। যা তাদের স্বাস্থ্যের জন্য মারাত্মক ঝুঁকির কারণ। এছাড়া এই বয়সে পরিবার থেকে অবহেলার স্বীকারও হয়ে থাকে অনেক বৃদ্ধরা। অনেকে সঠিক চিকিৎসার অভাবে অসুস্থতায় দিন যাপন করে থাকে। তাদের এই বয়সে নিয়মিত মেডিকেল পরীক্ষা এবং চিকিৎসা সেবা প্রদান করা অতিব গুরুত্বপূর্ণ। তাদের মানসিক স্বাস্থ্যের সুরক্ষায় কাউন্সিলিং এবং তাদের সকল সমস্যা সমাধানে গুরুত্ব দেওয়া উচিত। প্রবীণ বয়সে অনেকেই সন্তান না থাকাতে বা সন্তানদের অবহেলার কারণে থাকেন বৃদ্ধাশ্রমে। বৃদ্ধাশ্রমে অবহেলায়, অনাদরে, পুষ্টিকর খাদ্যের অভাবে, প্রয়োজনীয় জিনিসপত্রের অভাবে এবং একাকীত্বে দিনযাপন করতে হয় তাদের। এছাড়াও সরকার থেকে বয়স্কদের জন্য বয়স্ক ভাতার ব্যবস্থা থাকলেও তা প্রয়োজনের তুলনায় খুবই নগন্য। তাই প্রবীণ বা বয়স্কদের সুরক্ষায় এবং যত্নে আমাদের সকলের একইসাথে কাজ করতে হবে। প্রবীণদের সাথে সহানুভূতিপূর্ণ এবং আদরপূর্ণ সম্পর্ক রক্ষা করা প্রয়োজন। প্রবীণদের কল্যাণে সরকারের উচিত বয়স্ক ভাতা বৃদ্ধি করা এবং তাদের জন্য সরকারি মেডিকেল গুলোতে ফ্রি চিকিৎসার ব্যবস্থা করে দেওয়া। প্রতিটি বৃদ্ধাশ্রমে সরকারি অনুদান দেওয়া এবং বিত্তবানদের এগিয়ে আসা উচিত। এছাড়া প্রতিটি পরিবারকে তাদের প্রতি যত্নবান ও সহানুভূতিশীল হতে হবে। তাদের নিয়মিত দেখাশোনা করা, প্রয়োজনীয়তা পূরণ করা এবং মানসিক স্বাস্থ্যের প্রতি মনোযোগ দিতে হবে। প্রবীণদের জন্য বিভিন্ন সামাজিক ও কল্যাণমূলক কর্মসূচি বাস্তবায়ন করা উচিত। বিভিন্ন স্কুল, কলেজ, সমাজকল্যাণ কেন্দ্র এবং অন্যান্য স্থানে প্রবীণদের নিরাপত্তা ও সুরক্ষার বিষয়ে সচেতনতামূলক কর্মশালা্র আয়োজন করা উচিত। অনেক প্রবীণ ব্যক্তি শারীরিক, মানসিক বা আর্থিক নির্যাতনের শিকার হোন। এই ধরণের নির্যাতন সম্পর্কে সচেতনতা বৃদ্ধি করা এবং সঠিক আইনানুগ ব্যবস্থা গ্রহণ করা। প্রবীণদের সন্তানের অবহেলায় শাস্তির যে বিধান রয়েছে তা সঠিকভাবে বাস্তবায়ন করা এবং শাস্তির পরিমাণ বৃদ্ধি করা। প্রতি বছর ০১ লা অক্টোবর, বিশ্ব প্রবীণ দিবসে প্রবীণদের সুরক্ষায়, যত্নে ও অধিকার রক্ষায় বিশেষভাবে গণ সচেতনতা গড়ে তোলা উচিত, যাতে অবহেলিত না হয় একজনও প্রবীণ।","img":""},{"id":"a07","bn":"পাবলিকিয়ান হওয়ার যুদ্ধ","en":"The Battle to Become a Public University Student","paper":"Daily Sangram","date":"10 January 2024","link":"https://www.facebook.com/photo/?fbid=2273049313070694&set=pcb.2273049493070676","content":"বাংলাদেশে প্রতিবছর উচ্চ মাধ্যমিক পরীক্ষা শেষে শুরু হয় শিক্ষার্থীদের পাবলিকিয়ান হওয়ার যুদ্ধ। বাংলাদেশে গড়ে প্রতিবছর ১০ থেকে ১২ লক্ষ শিক্ষার্থী উচ্চ মাধ্যমিক পরীক্ষা দিয়ে থাকে। যাদের বিপরীতে মাত্র ৫৮ টি পাবলিক বিশ্ববিদ্যালয়ে আসন রয়েছে মাত্র প্রায় ৬০ হাজার। তবে পাবলিকিয়ান হওয়ার চাইতে ডাক্তার হওয়ার প্রবণতাও কম নয়। সরকারি মেডিকেল ভর্তি পরীক্ষায় প্রতি বছর প্রায় ৩ লক্ষের বেশি শিক্ষার্থী অংশগ্রহণ করে, যাদের বিপরীতে মোট আসন রয়েছে প্রায় ৪ হাজার। অবাক প্রতিযোগিতার এই পরীক্ষায় উত্তীর্ণ হতে শিক্ষার্থীরা বেছে নেয় তাদের পছন্দের কোচিং সেন্টার। আর বাংলাদেশের বেশিরভাগ জেলার শহরাঞ্চলগুলোর অলিতে গলিতে কোচিং সেন্টারগুলোর এটাই মোটা অঙ্কের অর্থ উপার্জনের মক্ষম উপায়। মেডিকেল, ইঞ্জিনিয়ারিং, সাধারণ বিশ্ববিদ্যালয়ের ভর্তি পরীক্ষার কোচিং করার জন্য কোচিং সেন্টার ভেদে ২০ থেকে ৪০ হাজার টাকা নেওয়া হয় প্রতিটি শিক্ষার্থীর কাছ থেকে। শুধু কোচিং নয়, ভর্তি পরীক্ষা সম্পর্কিত বই, গাইডের মাধ্যমে শিক্ষার্থীদের খরচ করতে হয় মোটার অংকের অর্থ। সাধারণত উচ্চ মাধ্যমিক পরীক্ষার ৩ থেকে ৬ মাসের মধ্যে মেডিকেল, ইঞ্জিনিয়ারিং, সাধারণ বিশ্ববিদ্যালয় ভর্তি পরীক্ষা সম্পন্ন হয়।  এই কয়েক মাসের সাধনার মধ্যেই নির্ভর করে একজন শিক্ষার্থীর পাবলিকিয়ান বা ডাক্তার হওয়ার যুদ্ধে জয়ী হওয়ার সম্ভাবনা। সবশেষে, যুদ্ধে ব্যর্থদের অনেকেই সামাজিক ও পারিবারিক চাপে বেছে নেয় আত্মহননের মতো সিদ্ধান্তও। এ সমাজের প্রেক্ষাপটানুযায়ী, অনেকেই পাবলিকিয়ান না হতে পেরে নিজেদের ব্যর্থ ভাবে এবং সমাজের অধিকাংশ মানুষের পাবলিকিয়ান হলেই সফল এই ভাবনার কারণে যারা চান্স পায় না তাদের মধ্যে নেমে আসে বিশাল হতাশার ছাপ এবং বিষন্নতার ছায়া। যা পরবর্তীতে শিক্ষার্থীদের শারীরিক ও মানসিক স্বাস্থ্যের জন্য মারাত্মক ঝুঁকি বয়ে আনে। তাই আমাদের সমাজের সকল মানুষের উচিত এ ধরণের ভাবনা থেকে বেরিয়ে আসা। এই ভাবনায় উপনিত হওয়া যে, যে পাবলিকিয়ান সেই সফল নয় বরং যে পরিশ্রমী সেই সফল। কারণ পাবলিক বিশ্ববিদ্যালয়ে না পড়েও সফল হওয়া যায় এবং জীবনে উন্নতি করা যায় এমনটা প্রমাণ করেছে হাজারো থেকে লাখো শিক্ষার্থী। আসুন, ভ্রান্ত ধারণা থেকে বেরিয়ে আসি এবং একটি সুন্দর সামাজিক ও শিক্ষাগত নিয়ম গড়ি।","img":""},{"id":"a06","bn":"শীতের আর্তনাদ","en":"Winter's Cry","paper":"Daily Sangbad","date":"10 January 2024","link":"https://www.facebook.com/photo/?fbid=2273049313070694&set=pcb.2273049493070676","content":"প্রতি বছর নভেম্বর থেকে ফেব্রুয়ারি পর্যন্ত যেন সারাদেশ ব্যাপী বাৎসরিক আর্তনাদ নেমে আসে। এ আর্তনাদ শীতার্তদের আর্তনাদ, এ আর্তনাদ ছিন্নমূলদের আর্তনাদ, এ আর্তনাদ একটি সম্পূর্ণ ঋতুর আর্তনাদ। প্রতি বছর হাজারো শিশু, বৃদ্ধ, দরিদ্র্য, অসহায় মানুষ পুরো শীতকাল ব্যাপী অমানবিক কষ্ট ভোগ করে থাকে। শীতের তীব্রতায় গরম কাপড়ের অভাবে মারা যেতেও দেখা যায়। গরম কাপড়ের অভাবে রেল লাইনের পাশে, শহরের বস্তি এলাকাগুলোতে, শহরের ফুটপাথসহ দেশের বিভিন্ন জায়গায় দরিদ্র্য, ছিন্নমূল, শীতার্তদের অসহায় জীবনযাপন করতে দেখা যায়। বিশেষ করে দেশের উত্তরবঙ্গের এলাকাগুলোতে অধিকাংশ মানুষ শীতকালে মানবেতর জীবনযাপন করে থাকে। শীতকালে উপযুক্ত শীতবস্ত্র ও চিকিৎসার অভাবে দরিদ্র ও প্রান্তিক মানুষ নিউমোনিয়া, শ্বাসকষ্ট, সর্দি, কাশি, জ্বর, পেটের পীড়াসহ নানা রোগে আক্রান্ত হয়। বিশেষ করে শীতকালে শিশু ও বৃদ্ধদের মধ্যে এসব রোগ মারাত্মকভাবে দেখা দেয়। তাই এই অসহায় মানুষদের পাশে দাঁড়ানো সকল মানুষের সামাজিক, মানবিক ও ধর্মীয় দায়িত্ব। সরকারের উচিত দারিদ্র্য বিমোচনে কাজ করা, শীতকালে বাস্তুচ্যুতদের পুনর্বাসন করা এবং তাদের বিনামূল্যে বস্ত্র বিতরণ করা। এছাড়াও, সমাজের সকল বিত্তবান ব্যক্তি, সামাজিক সাহায্যকারী সংস্থা, রাজনৈতিক সংগঠনের উচিত গরিব-অসহায় মানুষদের পাশে দাঁড়ানো এবং যারা প্রতি বছর নতুন শীতবস্ত্র কিনে তাদের পুরানো শীতবস্ত্র গরীবদের মাঝে বিতরণ করা। আমাদের সকলের দায়িত্ববোধেই বাঁচতে পারে একটি প্রাণ, কমতে পারে একটি মানুষের আর্তনাদ।","img":""},{"id":"a05","bn":"ইবির জিমনেসিয়ামে যত সমস্যা","en":"Many Problems in IU's Gymnasium","paper":"Daily Ajkaler Khobor","date":"06 January 2024","link":"https://epaper.ajkalerkhobor.net/2024/01/06/4/details/4_r3_c1.jpg","content":"বাংলাদেশের অধিকাংশ পাবলিক বিশ্ববিদ্যালয়ে শিক্ষার্থীদের পড়াশোনার পাশাপাশি শারীরিক ও মানসিক স্বাস্থ্যের উন্নতির জন্য থাকে ইন্ডোর গেইম ও জিমনেসিয়ামের ব্যবস্থা। তেমনি ইসলামী বিশ্ববিদ্যালয়ে (ইবি) জিমনেসিয়াম থাকলেও তা নিয়ে শিক্ষার্থীদের অভিযোগের শেষ নেই। বিশ্ববিদ্যালয়ের কর্মদিবসগুলোতে রাত সাড়ে ৭ টা পর্যন্ত এবং বন্ধের দিনগুলোতে বন্ধ থাকে এটি। জিমনেসিয়ামে ব্যবহৃত বহু সরঞ্জাম অকেজো এবং মরিচাযুক্ত হয়ে ব্যবহারের অনুপযোগী অবস্থায় রয়েছে। জিম ট্রেইনার থাকলেও জিমনেসিয়ামে কখনো তাদের দেখা পায় নি শিক্ষার্থীরা, যার কারণে জিম করার সময় সঠিক নির্দেশনা পায় না শিক্ষার্থীরা, যা হতে পারে শরীর ও স্বাস্থ্যের জন্য মারাত্মক ক্ষতিকর। এছাড়াও বন্ধের দিনগুলোতে জিমনেসিয়াম বন্ধ থাকাতে সেদিনগুলোতে শিক্ষার্থীদের শরীর চর্চা এবং ইন্ডোর খেলাগুলো থেকে বিরত থাকতে হয়। এর আগেও জিমনেসিয়াম স্বল্প সময় খোলা নিয়ে শিক্ষার্থীরা আন্দোলন করলেও এ ব্যাপারে কোনো পদক্ষেপ গ্রহণ করে নি কর্তৃপক্ষ। তাই অনতি বিলম্বে শিক্ষার্থীদের সুযোগ-সুবিধা এবং শারীরিক ও মানসিক স্বাস্থ্যের কথা চিন্তা করে ছুটির সময়সহ প্রতিদিন রাত ১০ টা পর্যন্ত জিমনেসিয়াম খোলা রাখা, সরঞ্জাম গুলোর সংস্কার ও পরিচর্যা করা এবং জিম ট্রেইনারদের নির্দিষ্ট সময়ে জিমনেসিয়ামে উপস্থিত থাকাসহ জিমনেসিয়ামের উন্নয়নে সব ধরণের পদক্ষেপ গ্রহণের জন্য বিশ্ববিদ্যালয়ের সংশ্লিষ্ট কর্তৃপক্ষের সুদৃষ্টি কামনা করছি।","img":""},{"id":"a04","bn":"সমুন্নত হোক ইবির গ্রন্থাগার","en":"Let IU's Library Be Elevated","paper":"Daily Amader Shomoy","date":"03 January 2024","link":"https://epaper.dainikamadershomoy.com/2024/01/03/page-04?fbclid=IwY2xjawNHOYJleHRuA2FlbQIxMABicmlkETFPczhjaEtUQVZyRUJnSGhsAR4RKJf4Ok63Mb_Gwl2LSI5kY3XRah7jW4iiwF0POhhPriv5DnSwJsNKIeGlEQ_aem_D1xa3l9bzk_Bf-Halzsy8A","content":"বাংলাদেশের উল্লেখযোগ্য গ্রন্থাগার গুলোর মধ্যে একটি হলো 'খাদেমুল হারামাইন বাদশা ফাহদ বিন আব্দুল আজিজ কেন্দ্রীয় গ্রন্থাগার'। যেটি ইসলামী বিশ্ববিদ্যালয় কেন্দ্রীয় গ্রন্থাগার নামেও পরিচিত। বিশ্ববিদ্যালয় প্রতিষ্ঠার ৪৪ বছর, গ্রন্থাগার স্থাপিত হওয়ার ৩৯ বছর এবং বাংলাদেশ বিশ্ববিদ্যালয় মঞ্জুরি কমিশনের ডিজিটাল লাইব্রেরির অধিভুক্তি পেলেও নানা কারণে বিশ্ববিদ্যালয়ের শিক্ষার্থীদের অভিযোগের শীর্ষে উক্ত গ্রন্থাগার। শিক্ষার্থীদের প্রয়োজনানুসারে ক্লাস চলাকালীন সময় ছাড়াও অন্যান্য সময়ে গ্রন্থাগার খোলা রাখার দাবি থাকলেও শুধুমাত্র ক্লাস চলাকালীন সময়েই খোলা এবং ছুটির দিনগুলোতে বন্ধ রাখা হয় এটি। শিক্ষার্থীদের উপস্থিতি অনুযায়ী, পর্যাপ্ত আসনের ব্যবস্থা নেই এখানে। বিনামূল্যে ব্যবহারযোগ্য ইন্টারনেট ব্যবস্থা থাকলেও তা খুবই ধীরগতি সম্পন্ন। ২০২০ সনের দিকে ই-লাইব্রেরি চালু করার উদ্যোগ নিলেও এতোদিনেও সম্পন্ন হয় নি কাজ। তাই শিক্ষার্থী, শিক্ষকদের সুযোগ-সুবিধার কথা বিবেচনা করে চাহিদানুযায়ী, ছুটির সময়সহ প্রতিদিন অন্তত সকাল ৬ টার আগে থেকে রাত ১০ টা অব্দি গ্রন্থাগার খোলা রাখা, গ্রন্থ
